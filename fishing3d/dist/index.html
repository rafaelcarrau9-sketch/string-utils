import * as THREE from 'three';

/* ===== src/core/MathUtils.js ===== */
/** Utilidades numéricas compartidas. Sin dependencias de three. */

const clamp = (v, min, max) => (v < min ? min : v > max ? max : v);

const lerp = (a, b, t) => a + (b - a) * t;

const smoothstep = (edge0, edge1, x) => {
  const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
  return t * t * (3 - 2 * t);
};

/** Interpolación exponencial independiente del framerate. */
const damp = (current, target, lambda, dt) =>
  lerp(current, target, 1 - Math.exp(-lambda * dt));

const randRange = (rng, min, max) => min + rng() * (max - min);

/** Distribución sesgada hacia el extremo bajo: los ejemplares grandes son raros. */
function skewedRandom(rng, min, max, bias = 2.2) {
  return min + (max - min) * Math.pow(rng(), bias);
}

/** Mulberry32: PRNG determinista y rápido, para mundos reproducibles. */
function createRandom(seed = 1) {
  let a = seed >>> 0;
  return function random() {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Ruido de valor 2D con interpolación suave. Base de todo el terreno. */
function makeValueNoise2D(seed = 1) {
  const perm = new Uint8Array(512);
  const rng = createRandom(seed);
  for (let i = 0; i < 256; i++) perm[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [perm[i], perm[j]] = [perm[j], perm[i]];
  }
  for (let i = 0; i < 256; i++) perm[i + 256] = perm[i];

  const hash = (x, y) => perm[(perm[x & 255] + y) & 255] / 255;

  return function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi), b = hash(xi + 1, yi);
    const c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  };
}

/** Suma de octavas. amplitude/frequency por octava con lacunaridad 2. */
function fbm(noise, x, y, octaves = 4, persistence = 0.5) {
  let total = 0, amplitude = 1, frequency = 1, max = 0;
  for (let i = 0; i < octaves; i++) {
    total += noise(x * frequency, y * frequency) * amplitude;
    max += amplitude;
    amplitude *= persistence;
    frequency *= 2;
  }
  return total / max;
}

/* ===== src/core/GeometryUtils.js ===== */
/** Fusiona geometrías indexadas con los mismos atributos (position/normal/uv). */
function mergeGeometries(geometries) {
  const result = new THREE.BufferGeometry();
  const names = ['position', 'normal', 'uv'];
  const total = geometries.reduce((n, g) => n + g.attributes.position.count, 0);
  const buffers = {};
  names.forEach((name) => {
    const size = geometries[0].attributes[name].itemSize;
    buffers[name] = { array: new Float32Array(total * size), size, offset: 0 };
  });

  const indices = [];
  let vertexOffset = 0;
  for (const g of geometries) {
    const indexed = g.index ? g : g.toNonIndexed();
    const src = indexed.index ? indexed : indexed;
    names.forEach((name) => {
      const data = src.attributes[name].array;
      buffers[name].array.set(data, buffers[name].offset);
      buffers[name].offset += data.length;
    });
    if (src.index) {
      const idx = src.index.array;
      for (let i = 0; i < idx.length; i++) indices.push(idx[i] + vertexOffset);
    } else {
      const count = src.attributes.position.count;
      for (let i = 0; i < count; i++) indices.push(i + vertexOffset);
    }
    vertexOffset += src.attributes.position.count;
  }

  names.forEach((name) => {
    result.setAttribute(name, new THREE.BufferAttribute(buffers[name].array, buffers[name].size));
  });
  result.setIndex(indices);
  return result;
}

/**
 * Dos planos cruzados en X, con el pivote en la base. Para hierba y follaje.
 *
 * `upBias` inclina las normales hacia arriba. Sin esto los planos son
 * verticales, su normal es horizontal y con el sol alto el producto N·L vale
 * casi cero: las copas salen negras a mediodía. Las hojas reales no son un
 * plano, así que fingir una normal más redonda es lo correcto, no un truco.
 */
function crossPlanes(width, height, upBias = 0) {
  const a = new THREE.PlaneGeometry(width, height, 1, 2);
  a.translate(0, height / 2, 0);
  const b = a.clone();
  b.rotateY(Math.PI / 2);
  const merged = mergeGeometries([a, b]);
  a.dispose();
  b.dispose();
  if (upBias > 0) {
    const normals = merged.attributes.normal;
    const v = new THREE.Vector3();
    for (let i = 0; i < normals.count; i++) {
      v.fromBufferAttribute(normals, i);
      v.multiplyScalar(1 - upBias);
      v.y += upBias;
      v.normalize();
      normals.setXYZ(i, v.x, v.y, v.z);
    }
    normals.needsUpdate = true;
  }
  return merged;
}

/* ===== src/core/Settings.js ===== */
/**
 * Calidad gráfica. Cada preset se traduce en decisiones concretas que los
 * sistemas leen al construirse (resolución de sombras, densidad de hierba,
 * tamaño del render target del reflejo del agua...).
 */

const QUALITY_PRESETS = {
  bajo: {
    label: 'Bajo',
    pixelRatio: 0.75,
    shadows: false,
    shadowMapSize: 1024,
    waterReflection: 256,
    grassDensity: 0.25,
    viewDistance: 220,
    rainParticles: 1500,
    antialias: false
  },
  medio: {
    label: 'Medio',
    pixelRatio: 1,
    shadows: true,
    shadowMapSize: 2048,
    waterReflection: 512,
    grassDensity: 0.6,
    viewDistance: 320,
    rainParticles: 4000,
    antialias: true
  },
  alto: {
    label: 'Alto',
    pixelRatio: 1,
    shadows: true,
    shadowMapSize: 4096,
    waterReflection: 1024,
    grassDensity: 1,
    viewDistance: 450,
    rainParticles: 9000,
    antialias: true
  }
};

const DEFAULT_SETTINGS = {
  quality: 'medio',
  fov: 70,
  sensitivity: 1,
  invertY: false,
  masterVolume: 0.8,
  showFps: false,
  autoQuality: true
};

function presetFor(settings) {
  return QUALITY_PRESETS[settings.quality] || QUALITY_PRESETS.medio;
}

/* ===== src/core/Performance.js ===== */
/**
 * Vigilancia de rendimiento y calidad adaptativa.
 *
 * No sé en qué máquina se va a jugar, así que el juego lo averigua solo:
 * mide los fotogramas por segundo y, si no llega, baja un escalón de calidad;
 * si sobra holgura durante un buen rato, vuelve a subir.
 *
 * Sólo toca lo que se puede cambiar en caliente sin reconstruir la escena:
 * resolución de render, sombras, distancias de dibujado y densidad de lluvia.
 * El reflejo del agua se fija al crear el mundo y no se toca aquí.
 */

const LEVELS = ['bajo', 'medio', 'alto'];

const LOW_FPS = 32;        // por debajo de esto, molesta
const HIGH_FPS = 56;       // por encima, sobra margen para subir
const SAMPLE_SECONDS = 2;  // ventana de medición
const PATIENCE_DOWN = 2;   // ventanas malas seguidas antes de bajar
const PATIENCE_UP = 6;     // ventanas buenas seguidas antes de subir

class Performance {
  constructor({ renderer, sky, vegetationRef, treesRef, grassRef, weather, settings, onChange }) {
    this.renderer = renderer;
    this.sky = sky;
    this.vegetationRef = vegetationRef;   // función: devuelve la vegetación actual
    this.treesRef = treesRef;
    this.grassRef = grassRef;
    this.weather = weather;
    this.settings = settings;
    this.onChange = onChange;

    this.levelIndex = LEVELS.indexOf(settings.quality);
    if (this.levelIndex < 0) this.levelIndex = 1;
    this.auto = settings.autoQuality !== false;

    this.frames = 0;
    this.elapsed = 0;
    this.fps = 60;
    this.badWindows = 0;
    this.goodWindows = 0;
    this.locked = false;      // se bloquea si el jugador toca la calidad a mano
  }

  get level() { return LEVELS[this.levelIndex]; }
  get preset() { return QUALITY_PRESETS[this.level]; }

  /** El jugador ha elegido calidad a mano: se respeta y se deja de ajustar. */
  lockTo(quality) {
    const index = LEVELS.indexOf(quality);
    if (index < 0) return;
    this.levelIndex = index;
    this.locked = true;
    this.apply();
  }

  update(dt) {
    this.frames += 1;
    this.elapsed += dt;
    if (this.elapsed < SAMPLE_SECONDS) return;

    this.fps = this.frames / this.elapsed;
    this.frames = 0;
    this.elapsed = 0;
    if (!this.auto || this.locked) return;

    if (this.fps < LOW_FPS) {
      this.goodWindows = 0;
      this.badWindows += 1;
      if (this.badWindows >= PATIENCE_DOWN && this.levelIndex > 0) {
        this.badWindows = 0;
        this.levelIndex -= 1;
        this.apply();
        this.onChange?.(this.level, 'baja', Math.round(this.fps));
      }
    } else if (this.fps > HIGH_FPS) {
      this.badWindows = 0;
      this.goodWindows += 1;
      if (this.goodWindows >= PATIENCE_UP && this.levelIndex < LEVELS.length - 1) {
        this.goodWindows = 0;
        this.levelIndex += 1;
        this.apply();
        this.onChange?.(this.level, 'sube', Math.round(this.fps));
      }
    } else {
      this.badWindows = 0;
      this.goodWindows = 0;
    }
  }

  /** Lleva el preset actual a los sistemas vivos. */
  apply() {
    const preset = this.preset;
    this.settings.quality = this.level;

    this.renderer.setPixelRatio(
      clamp(Math.min(window.devicePixelRatio, 2) * preset.pixelRatio, 0.5, 2)
    );

    this.renderer.shadowMap.enabled = preset.shadows;
    if (this.sky?.sun) {
      const sun = this.sky.sun;
      sun.castShadow = preset.shadows;
      if (preset.shadows && sun.shadow.mapSize.width !== preset.shadowMapSize) {
        sun.shadow.mapSize.set(preset.shadowMapSize, preset.shadowMapSize);
        // Tirar el mapa fuerza a three a recrearlo con el tamaño nuevo.
        sun.shadow.map?.dispose();
        sun.shadow.map = null;
      }
    }

    const vegetation = this.vegetationRef?.();
    if (vegetation) {
      vegetation.viewDistance = preset.viewDistance;
      vegetation.tiles.forEach((mesh) => {
        mesh.userData.cullDistance = Math.min(mesh.userData.cullDistance, preset.viewDistance);
      });
    }
    const trees = this.treesRef?.();
    if (trees) {
      trees.nearDistance = Math.min(70, preset.viewDistance * 0.4);
      trees._lastRebuild.set(1e9, 0, 1e9);   // fuerza recalcular el LOD
    }
    this.grassRef?.()?.setBudget?.(preset.grassDensity);
    if (this.weather?.rain) {
      this.weather.rainCount = Math.min(this.weather.rainCount, preset.rainParticles);
    }
  }
}

/* ===== src/core/SaveSystem.js ===== */
/**
 * Persistencia en localStorage. Tolerante a partidas de versiones anteriores:
 * lo que ya no existe en los catálogos se descarta al cargar en vez de romper.
 */

const KEY = 'stillwaters.save.v1';
const VERSION = 1;

class SaveSystem {
  constructor(storage = globalThis.localStorage) {
    this.storage = storage;
  }

  save(payload) {
    try {
      this.storage.setItem(KEY, JSON.stringify({ version: VERSION, ...payload }));
      return true;
    } catch (err) {
      console.warn('[save] no se pudo guardar:', err.message);
      return false;
    }
  }

  load() {
    try {
      const raw = this.storage.getItem(KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || data.version !== VERSION) return null;
      return data;
    } catch (err) {
      console.warn('[save] partida ilegible, se empieza de cero:', err.message);
      return null;
    }
  }

  clear() {
    try { this.storage.removeItem(KEY); } catch { /* almacenamiento bloqueado */ }
  }
}

/* ===== src/core/Input.js ===== */
/**
 * Entrada unificada: teclado, ratón con pointer lock y rueda.
 * No decide nada de gameplay; sólo expone estado consultable y eventos.
 */

class Input {
  constructor(domElement) {
    this.dom = domElement;
    this.keys = new Set();
    this.mouse = { dx: 0, dy: 0, wheel: 0, left: false, right: false };
    this.locked = false;
    this.enabled = true;
    this._listeners = new Map();

    this._onKeyDown = (e) => {
      if (!this.enabled) return;
      this.keys.add(e.code);
      this._emit('keydown', e);
      if (['Space', 'Tab', 'KeyE'].includes(e.code)) e.preventDefault();
    };
    this._onKeyUp = (e) => { this.keys.delete(e.code); this._emit('keyup', e); };
    this._onMove = (e) => {
      if (!this.locked) return;
      this.mouse.dx += e.movementX || 0;
      this.mouse.dy += e.movementY || 0;
    };
    this._onDown = (e) => {
      if (e.button === 0) this.mouse.left = true;
      if (e.button === 2) this.mouse.right = true;
      this._emit('pointerdown', e);
    };
    this._onUp = (e) => {
      if (e.button === 0) this.mouse.left = false;
      if (e.button === 2) this.mouse.right = false;
      this._emit('pointerup', e);
    };
    this._onWheel = (e) => { this.mouse.wheel += Math.sign(e.deltaY); };
    this._onLockChange = () => {
      this.locked = document.pointerLockElement === this.dom;
      this._emit('lockchange', this.locked);
    };

    window.addEventListener('keydown', this._onKeyDown);
    window.addEventListener('keyup', this._onKeyUp);
    window.addEventListener('mousemove', this._onMove);
    window.addEventListener('mousedown', this._onDown);
    window.addEventListener('mouseup', this._onUp);
    window.addEventListener('wheel', this._onWheel, { passive: true });
    document.addEventListener('pointerlockchange', this._onLockChange);
    this.dom.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  on(event, fn) {
    if (!this._listeners.has(event)) this._listeners.set(event, new Set());
    this._listeners.get(event).add(fn);
    return () => this._listeners.get(event).delete(fn);
  }

  _emit(event, arg) {
    const set = this._listeners.get(event);
    if (set) set.forEach((fn) => fn(arg));
  }

  isDown(code) { return this.keys.has(code); }

  requestLock() { this.dom.requestPointerLock?.(); }
  releaseLock() { document.exitPointerLock?.(); }

  /** Consume el delta acumulado: llamar una vez por frame. */
  consumeMouseDelta() {
    const d = { dx: this.mouse.dx, dy: this.mouse.dy, wheel: this.mouse.wheel };
    this.mouse.dx = this.mouse.dy = this.mouse.wheel = 0;
    return d;
  }

  setEnabled(value) {
    this.enabled = value;
    if (!value) this.keys.clear();
  }
}

/* ===== src/world/Textures.js ===== */
/**
 * Fábrica de texturas procedurales.
 *
 * El juego no puede descargar imágenes (la página publicada bloquea cualquier
 * recurso externo que no sea un script), así que todos los mapas de color,
 * normal y rugosidad se generan por código sobre un canvas. Cada material
 * devuelve un juego completo de mapas para que el PBR de three responda bien
 * a la luz en vez de verse plano.
 *
 * Para sustituirlos más adelante por texturas reales basta con cambiar
 * `TextureLibrary.material()` por un cargador: el resto del juego sólo pide
 * materiales por nombre.
 */

function canvasOf(size) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  return canvas;
}

/** Convierte un campo de alturas en un mapa de normales tangenciales (sobel). */
function heightToNormal(height, size, strength = 2.2) {
  const canvas = canvasOf(size);
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  const at = (x, y) => height[((y + size) % size) * size + ((x + size) % size)];

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const dx = (at(x + 1, y) - at(x - 1, y)) * strength;
      const dy = (at(x, y + 1) - at(x, y - 1)) * strength;
      let nx = -dx, ny = -dy, nz = 1;
      const len = Math.hypot(nx, ny, nz);
      nx /= len; ny /= len; nz /= len;
      const i = (y * size + x) * 4;
      img.data[i] = (nx * 0.5 + 0.5) * 255;
      img.data[i + 1] = (ny * 0.5 + 0.5) * 255;
      img.data[i + 2] = (nz * 0.5 + 0.5) * 255;
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

/** Pinta un canvas evaluando `fn(x, y) -> [r,g,b] 0..1` por píxel. */
function paint(size, fn) {
  const canvas = canvasOf(size);
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const c = fn(x, y);
      const i = (y * size + x) * 4;
      img.data[i] = clamp(c[0], 0, 1) * 255;
      img.data[i + 1] = clamp(c[1], 0, 1) * 255;
      img.data[i + 2] = clamp(c[2], 0, 1) * 255;
      img.data[i + 3] = (c[3] === undefined ? 1 : clamp(c[3], 0, 1)) * 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

function textureFrom(canvas, { srgb = false, repeat = 1, aniso = 4 } = {}) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat, repeat);
  tex.anisotropy = aniso;
  if (srgb) tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

/** Definición de cada superficie: color base, veta y respuesta a la luz. */
const SURFACES = {
  // Base neutra: el terreno la tiñe por vértice (arena, hierba, limo, roca)
  // para pasar de un material a otro sin costuras ni draw calls extra.
  suelo: {

    base: [0.62, 0.6, 0.57],
    accent: [0.34, 0.33, 0.31],

    roughness: [0.78, 0.97],
    normalStrength: 1.9
  },
  tierra: {

    base: [0.28, 0.21, 0.14],
    accent: [0.16, 0.12, 0.08],

  },
  hierba: {

    accent: [0.11, 0.2, 0.08],
    grain: (noise, x, y) => fbm(noise, x * 0.09, y * 0.09, 5, 0.6),

  },
  roca: {
    size: 256,
    base: [0.42, 0.41, 0.39],
    accent: [0.2, 0.2, 0.21],
    grain: (noise, x, y) => {
      const base = fbm(noise, x * 0.035, y * 0.035, 5, 0.55);
      const cracks = Math.pow(1 - Math.abs(fbm(noise, x * 0.02, y * 0.02, 3, 0.5) - 0.5) * 2, 8);
      return clamp(base - cracks * 0.45, 0, 1);
    },
    roughness: [0.55, 0.88],
    normalStrength: 3.2
  },
  corteza: {
    size: 256,
    base: [0.3, 0.22, 0.16],
    accent: [0.13, 0.09, 0.06],
    grain: (noise, x, y) => {
      // Vetas verticales: mucha frecuencia en X, poca en Y.
      const v = fbm(noise, x * 0.28, y * 0.02, 4, 0.6);
      return clamp(v * 0.7 + fbm(noise, x * 0.06, y * 0.06, 3, 0.5) * 0.3, 0, 1);
    },
    roughness: [0.75, 0.98],
    normalStrength: 3
  },
  madera: {
    size: 256,
    base: [0.44, 0.32, 0.2],
    accent: [0.24, 0.16, 0.09],
    grain: (noise, x, y) => {
      const rings = Math.sin((y * 0.35 + fbm(noise, x * 0.02, y * 0.04, 3, 0.5) * 9)) * 0.5 + 0.5;
      const plank = (x % 64) < 2 ? 0.15 : 1;          // junta entre tablones
      return clamp(rings * 0.55 + 0.35, 0, 1) * plank;
    },
    roughness: [0.6, 0.9],
    normalStrength: 2
  }
};

class TextureLibrary {
  constructor() {
    this.cache = new Map();
    this.noise = makeValueNoise2D(1337);
  }

  /** Devuelve (y cachea) un MeshStandardMaterial completo para una superficie. */
  material(name, { repeat = 8, color = 0xffffff, ...extra } = {}) {
    const key = `${name}:${repeat}:${color}`;
    if (this.cache.has(key)) return this.cache.get(key);

    const def = SURFACES[name];
    if (!def) throw new Error(`Superficie desconocida: ${name}`);
    const { size } = def;

    const height = new Float32Array(size * size);
    const albedo = paint(size, (x, y) => {
      const g = def.grain(this.noise, x, y);
      height[y * size + x] = g;
      return [
        lerp(def.accent[0], def.base[0], g),
        lerp(def.accent[1], def.base[1], g),
        lerp(def.accent[2], def.base[2], g)
      ];
    });
    const rough = paint(size, (x, y) => {
      const g = height[y * size + x];
      const r = lerp(def.roughness[0], def.roughness[1], 1 - g);
      return [r, r, r];
    });

    const material = new THREE.MeshStandardMaterial({
      map: textureFrom(albedo, { srgb: true, repeat }),
      normalMap: textureFrom(heightToNormal(height, size, def.normalStrength), { repeat }),
      roughnessMap: textureFrom(rough, { repeat }),
      roughness: 1,
      metalness: 0,
      color,
      ...extra
    });
    material.normalScale.set(1, 1);
    // Compartido: lo entrega la biblioteca a varios sistemas y sólo ella lo
    // destruye. Sin esta marca, el primer sistema que se descarta al cambiar
    // de zona dejaba sin programa a los demás.
    material.userData.shared = true;
    this.cache.set(key, material);
    return material;
  }

  /** Normales de oleaje que teselan, para el shader de agua. */
  waterNormals(size = 512) {
    if (this.cache.has('waterNormals')) return this.cache.get('waterNormals');
    const height = new Float32Array(size * size);
    // Dos trenes de olas cruzados más ruido: evita el patrón repetido evidente.
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const u = (x / size) * Math.PI * 2;
        const v = (y / size) * Math.PI * 2;
        height[y * size + x] =
          Math.sin(u * 3 + Math.cos(v * 2) * 0.6) * 0.35 +
          Math.sin(v * 5 - u * 1.5) * 0.25 +
          fbm(this.noise, x * 0.05, y * 0.05, 4, 0.55) * 0.4;
      }
    }
    const tex = textureFrom(heightToNormal(height, size, 1.6), { repeat: 1, aniso: 8 });
    this.cache.set('waterNormals', tex);
    return tex;
  }

  /**
   * Profundidad del lago codificada en una textura (canal rojo, 0 en la
   * orilla y 1 en lo más hondo). El shader del agua la usa para decidir
   * cuánto se ve el fondo, sin necesidad de una segunda pasada de render.
   */
  depthMap(terrain, size = 512, cacheKey = 'depthMap') {
    if (this.cache.has(cacheKey)) return this.cache.get(cacheKey);
    const half = terrain.field.half;
    const maxDepth = terrain.field.maxDepth;
    const data = new Uint8Array(size * size * 4);
    for (let j = 0; j < size; j++) {
      for (let i = 0; i < size; i++) {
        const x = -half + (i / (size - 1)) * half * 2;
        const z = -half + (j / (size - 1)) * half * 2;
        const d = clamp(terrain.depthAt(x, z) / maxDepth, 0, 1);
        const k = (j * size + i) * 4;
        data[k] = data[k + 1] = data[k + 2] = Math.round(d * 255);
        data[k + 3] = 255;
      }
    }
    const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.minFilter = tex.magFilter = THREE.LinearFilter;
    tex.needsUpdate = true;
    this.cache.set(cacheKey, tex);
    return tex;
  }

  /** Sprite de mata de hierba con alfa, para la vegetación instanciada. */
  grassBlade(size = 128) {
    if (this.cache.has('grassBlade')) return this.cache.get('grassBlade');
    const canvas = canvasOf(size);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, size, size);
    const rng = createRandom(7);
    for (let i = 0; i < 14; i++) {
      const x = size * (0.1 + rng() * 0.8);
      const h = size * (0.45 + rng() * 0.5);
      const lean = (rng() - 0.5) * size * 0.28;
      const w = size * (0.018 + rng() * 0.022);
      const g = 0.35 + rng() * 0.4;
      const grad = ctx.createLinearGradient(x, size, x + lean, size - h);
      grad.addColorStop(0, `rgba(${Math.round(38 * g)},${Math.round(62 * g)},${Math.round(24 * g)},1)`);
      grad.addColorStop(1, `rgba(${Math.round(96 * g)},${Math.round(132 * g)},${Math.round(48 * g)},0.92)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(x - w, size);
      ctx.quadraticCurveTo(x + lean * 0.4, size - h * 0.55, x + lean, size - h);
      ctx.quadraticCurveTo(x + lean * 0.5 + w, size - h * 0.5, x + w, size);
      ctx.closePath();
      ctx.fill();
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    this.cache.set('grassBlade', tex);
    return tex;
  }

  /** Mancha de follaje con alfa suave, para las copas de los árboles. */
  foliage(size = 128) {
    if (this.cache.has('foliage')) return this.cache.get('foliage');
    const rng = createRandom(23);
    const canvas = canvasOf(size);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, size, size);
    for (let i = 0; i < 90; i++) {
      const a = rng() * Math.PI * 2;
      const r = Math.pow(rng(), 0.6) * size * 0.44;
      const x = size / 2 + Math.cos(a) * r;
      const y = size / 2 + Math.sin(a) * r;
      const rad = size * (0.04 + rng() * 0.07);
      const shade = 0.45 + rng() * 0.55;
      ctx.fillStyle = `rgba(${Math.round(88 * shade)},${Math.round(134 * shade)},${Math.round(60 * shade)},0.95)`;
      ctx.beginPath();
      ctx.ellipse(x, y, rad, rad * 0.72, a, 0, Math.PI * 2);
      ctx.fill();
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    this.cache.set('foliage', tex);
    return tex;
  }

  /** Textura de nubes con alfa para la cúpula celeste. */
  clouds(size = 512) {
    if (this.cache.has('clouds')) return this.cache.get('clouds');
    const noise = makeValueNoise2D(99);
    const canvas = paint(size, (x, y) => {
      // Coordenadas envolventes para que no se vea la costura.
      const u = x / size, v = y / size;
      const n = fbm(noise, u * 6, v * 6, 5, 0.55);
      const mask = clamp((n - 0.42) * 3.4, 0, 1);
      const density = Math.pow(mask, 1.3);
      return [1, 1, 1, density * 0.85];
    });
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    this.cache.set('clouds', tex);
    return tex;
  }

  /** Gota de lluvia alargada para el sistema de partículas. */
  raindrop(size = 32) {
    if (this.cache.has('raindrop')) return this.cache.get('raindrop');
    const canvas = canvasOf(size);
    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, size);
    grad.addColorStop(0, 'rgba(200,225,245,0)');
    grad.addColorStop(0.5, 'rgba(210,232,250,0.75)');
    grad.addColorStop(1, 'rgba(200,225,245,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(size * 0.42, 0, size * 0.16, size);
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    this.cache.set('raindrop', tex);
    return tex;
  }

  dispose() {
    this.cache.forEach((v) => v.dispose?.());
    this.cache.clear();
  }
}

/* ===== src/world/TerrainShape.js ===== */
/**
 * Campo de alturas del mapa. Módulo puro (sin three) para poder probarlo
 * y para que otros sistemas —IA de peces, colocación de vegetación, colisión
 * del jugador— consulten el relieve sin tocar la escena.
 *
 * Convenio: el nivel del agua es y = 0. Todo lo negativo está sumergido.
 */

const WATER_LEVEL = 0;

function createHeightField({
  size = 520,            // lado del mapa en metros
  resolution = 320,      // vértices por lado
  seed = 20260908,
  lakeRadius = 118,      // radio medio del lago
  maxDepth = 9.5,        // profundidad máxima en el centro
  hillHeight = 26
} = {}) {
  const noise = makeValueNoise2D(seed);
  const heights = new Float32Array(resolution * resolution);
  const step = size / (resolution - 1);
  const half = size / 2;

  /** Radio del lago para un ángulo dado: contorno irregular, no un círculo. */
  function shoreRadius(angle) {
    const wobble = fbm(noise, Math.cos(angle) * 2.4 + 40, Math.sin(angle) * 2.4 + 40, 3, 0.55);
    const lobe = Math.sin(angle * 2.0 + 0.7) * 0.09 + Math.sin(angle * 3.0 - 1.4) * 0.06;
    return lakeRadius * (0.78 + 0.42 * wobble + lobe);
  }

  function sample(x, z) {
    const dist = Math.hypot(x, z);
    const angle = Math.atan2(z, x);
    const shore = shoreRadius(angle);
    const t = dist / shore;
    const detail = (fbm(noise, x * 0.055, z * 0.055, 3, 0.5) - 0.5) * 0.9;

    if (t < 1) {
      // Cuenca: repisa poco profunda junto a la orilla y hoya en el centro.
      const bowl = Math.pow(1 - t * t, 1.45);
      const shelf = smoothstep(1, 0.86, t) * 0.75;   // bajío pegado a la orilla
      const bed = (fbm(noise, x * 0.021, z * 0.021, 4, 0.5) - 0.5) * 2.1 * (1 - t * 0.7);
      return -maxDepth * bowl + shelf + bed + detail * 0.35;
    }

    const rise = t - 1;
    const beach = smoothstep(0, 0.05, rise) * 0.9;
    const bank = smoothstep(0.03, 0.42, rise) * 5.5;
    const hills = fbm(noise, x * 0.0075 + 5, z * 0.0075 + 5, 5, 0.52) * hillHeight
      * smoothstep(0.12, 1.1, rise);
    return beach + bank + hills + detail;
  }

  for (let j = 0; j < resolution; j++) {
    for (let i = 0; i < resolution; i++) {
      heights[j * resolution + i] = sample(-half + i * step, -half + j * step);
    }
  }

  /** Altura interpolada bilinealmente en coordenadas de mundo. */
  function heightAt(x, z) {
    const fx = clamp((x + half) / step, 0, resolution - 1.001);
    const fz = clamp((z + half) / step, 0, resolution - 1.001);
    const i = Math.floor(fx), j = Math.floor(fz);
    const tx = fx - i, tz = fz - j;
    const h00 = heights[j * resolution + i];
    const h10 = heights[j * resolution + i + 1];
    const h01 = heights[(j + 1) * resolution + i];
    const h11 = heights[(j + 1) * resolution + i + 1];
    return lerp(lerp(h00, h10, tx), lerp(h01, h11, tx), tz);
  }

  /** Pendiente 0..1 (0 llano, 1 pared). Se usa para texturizar y para andar. */
  function slopeAt(x, z) {
    const d = step;
    const dx = heightAt(x + d, z) - heightAt(x - d, z);
    const dz = heightAt(x, z + d) - heightAt(x, z - d);
    return clamp(Math.hypot(dx, dz) / (2 * d) / 2.2, 0, 1);
  }

  const depthAt = (x, z) => Math.max(0, WATER_LEVEL - heightAt(x, z));
  const isSubmerged = (x, z) => heightAt(x, z) < WATER_LEVEL;

  return {
    heights, resolution, size, step, half,
    lakeRadius, maxDepth, waterLevel: WATER_LEVEL,
    heightAt, slopeAt, depthAt, isSubmerged, shoreRadius
  };
}

/* ===== src/world/Terrain.js ===== */
/**
 * Malla del terreno.
 *
 * Una sola geometría con colores por vértice: el material base es neutro y el
 * color decide si un punto se lee como limo, arena, hierba o roca. Así hay
 * transiciones suaves entre biomas con una única draw call, en vez de varias
 * capas de textura mezcladas en un shader.
 */

const COLORS = {
  limo:   new THREE.Color(0x403a26),
  fondo:  new THREE.Color(0x6b6141),
  arena:  new THREE.Color(0xbda97e),
  hierba: new THREE.Color(0x53703a),
  seca:   new THREE.Color(0x7b8248),
  roca:   new THREE.Color(0x8b8880)
};

class Terrain {
  constructor(textures, options = {}) {
    this.field = createHeightField(options);
    this.waterLevel = WATER_LEVEL;

    const { resolution, size } = this.field;
    const geometry = new THREE.PlaneGeometry(size, size, resolution - 1, resolution - 1);
    geometry.rotateX(-Math.PI / 2);

    const position = geometry.attributes.position;
    const colors = new Float32Array(position.count * 3);
    const tint = makeValueNoise2D(4242);
    const color = new THREE.Color();

    for (let i = 0; i < position.count; i++) {
      const x = position.getX(i);
      const z = position.getZ(i);
      const h = this.field.heightAt(x, z);
      position.setY(i, h);

      const slope = this.field.slopeAt(x, z);
      const variation = fbm(tint, x * 0.03, z * 0.03, 3, 0.5);

      if (h < -0.35) {
        // Fondo del lago: arena en el bajío, limo oscuro en lo hondo.
        color.copy(COLORS.fondo).lerp(COLORS.limo, smoothstep(-1.2, -5.5, h));
      } else if (h < 0.85) {
        color.copy(COLORS.arena).lerp(COLORS.fondo, smoothstep(0.85, -0.35, h) * 0.55);
      } else {
        const dry = smoothstep(6, 20, h) * 0.6 + variation * 0.25;
        color.copy(COLORS.hierba).lerp(COLORS.seca, clamp(dry, 0, 1));
      }
      // La roca asoma donde la pendiente no deja agarrar tierra.
      color.lerp(COLORS.roca, smoothstep(0.35, 0.75, slope));
      color.offsetHSL(0, 0, (variation - 0.5) * 0.06);

      colors[i * 3] = color.r;
      colors[i * 3 + 1] = color.g;
      colors[i * 3 + 2] = color.b;
    }

    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.computeVertexNormals();

    const material = textures.material('suelo', { repeat: 90 });
    material.vertexColors = true;

    this.mesh = new THREE.Mesh(geometry, material);
    this.mesh.receiveShadow = true;
    this.mesh.castShadow = false;
    this.mesh.name = 'terreno';
    this.mesh.matrixAutoUpdate = false;
    this.mesh.updateMatrix();
  }

  heightAt(x, z) { return this.field.heightAt(x, z); }
  slopeAt(x, z) { return this.field.slopeAt(x, z); }
  depthAt(x, z) { return this.field.depthAt(x, z); }
  isSubmerged(x, z) { return this.field.isSubmerged(x, z); }

  /** Normal del terreno, para orientar objetos apoyados en el suelo. */
  normalAt(x, z, out = new THREE.Vector3()) {
    const d = 0.75;
    const hx = this.heightAt(x + d, z) - this.heightAt(x - d, z);
    const hz = this.heightAt(x, z + d) - this.heightAt(x, z - d);
    return out.set(-hx, 2 * d, -hz).normalize();
  }

  dispose() {
    this.mesh.geometry.dispose();
  }
}

/* ===== src/world/WaterBody.js ===== */
/**
 * Superficie del lago.
 *
 * Usa el shader `Water` de three, que resuelve el reflejo con una cámara
 * espejo y un render target: el cielo, los árboles y el muelle se reflejan de
 * verdad. La refracción completa exigiría una segunda pasada; en su lugar la
 * superficie es translúcida y el color del agua se oscurece con la
 * profundidad, que da la lectura correcta a un coste mucho menor.
 *
 * Además gestiona las ondas circulares que deja el señuelo al caer.
 */

const RIPPLE_LIFETIME = 2.6;

class WaterBody {
  constructor(textures, { size = 620, reflectionSize = 512, sunDirection, level = 0, terrain = null, zoneId = 'zona' } = {}) {
    this.level = level;
    this.ripples = [];

    const geometry = new THREE.PlaneGeometry(size, size, 1, 1);
    this.water = new Water(geometry, {
      textureWidth: reflectionSize,
      textureHeight: reflectionSize,
      waterNormals: textures.waterNormals(),
      sunDirection: sunDirection ? sunDirection.clone() : new THREE.Vector3(0.7, 0.7, 0),
      sunColor: 0xffffff,
      waterColor: 0x0d2630,
      distortionScale: 3.4,
      alpha: 0.9,
      fog: true
    });
    this.water.rotation.x = -Math.PI / 2;
    this.water.position.y = level;
    this.water.material.transparent = true;
    // `size` escala las coordenadas de mundo dentro del mapa de normales: con
    // el valor por defecto (1) las olas son kilométricas y el lago se ve liso.
    this.water.material.uniforms.size.value = 28;
    if (terrain) this._addDepthTransparency(textures, terrain, zoneId);
    this.water.name = 'agua';

    // Grupo de ondas: anillos que crecen y se desvanecen.
    this.rippleGroup = new THREE.Group();
    this.rippleGroup.position.y = level + 0.02;
    this._rippleGeometry = new THREE.RingGeometry(0.06, 0.1, 24);
    this._rippleGeometry.rotateX(-Math.PI / 2);
    // Reserva fija de anillos. Antes cada salpicadura creaba y destruía su
    // material: cuarenta ondas eran cuarenta materiales y cuarenta programas.
    this._pool = [];
    for (let i = 0; i < 48; i++) {
      const ring = new THREE.Mesh(this._rippleGeometry, new THREE.MeshBasicMaterial({
        color: 0xdff0f5, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false
      }));
      ring.visible = false;
      this.rippleGroup.add(ring);
      this._pool.push(ring);
    }
  }

  /**
   * Hace que el agua deje ver el fondo donde cubre poco.
   *
   * La transparencia se modula además con el Fresnel del propio shader: a
   * rasante el lago sigue siendo un espejo (que es lo que se ve de verdad
   * desde la orilla), y sólo mirando hacia abajo se transparenta el bajío.
   */
  _addDepthTransparency(textures, terrain, zoneId) {
    const material = this.water.material;
    material.uniforms.uDepthMap = { value: textures.depthMap(terrain, 512, `depthMap:${zoneId}`) };
    material.uniforms.uWorldHalf = { value: terrain.field.half };
    material.uniforms.uMaxDepth = { value: terrain.field.maxDepth };

    material.onBeforeCompile = (shader) => {
      shader.uniforms.uDepthMap = material.uniforms.uDepthMap;
      shader.uniforms.uWorldHalf = material.uniforms.uWorldHalf;
      shader.uniforms.uMaxDepth = material.uniforms.uMaxDepth;
      shader.fragmentShader = shader.fragmentShader
        .replace('void main() {', `
          uniform sampler2D uDepthMap;
          uniform float uWorldHalf;
          uniform float uMaxDepth;
          void main() {
        `)
        .replace(
          'gl_FragColor = vec4( outgoingLight, alpha );',
          `
          vec2 depthUv = (worldPosition.xz + uWorldHalf) / (uWorldHalf * 2.0);
          float lakeDepth = texture2D(uDepthMap, depthUv).r * uMaxDepth;

          float body = smoothstep(0.05, 3.2, lakeDepth);
          float seeThrough = mix(0.06, alpha, body);
          // El Fresnel de este shader arranca en 0.3 incluso de frente, así que
          // se eleva a una potencia: sólo la reflexión rasante —la que de verdad
          // convierte el lago en espejo— vuelve opaca la lámina.
          float finalAlpha = mix(seeThrough, alpha, pow(reflectance, 2.2));

          // Franja clara justo en la orilla: la lámina fina moja la arena.
          float wetLine = 1.0 - smoothstep(0.0, 0.35, lakeDepth);
          vec3 tinted = mix(outgoingLight, outgoingLight + vec3(0.06, 0.07, 0.06), wetLine * 0.5);
          tinted = mix(tinted, tinted * 0.82 + waterColor * 0.4, body * 0.7);

          gl_FragColor = vec4( tinted, finalAlpha );
          `
        );
    };
    material.customProgramCacheKey = () => 'aguaProfundidad';
    material.needsUpdate = true;
  }

  addTo(scene) {
    scene.add(this.water);
    scene.add(this.rippleGroup);
  }

  /** Onda expansiva en la superficie: caída del señuelo, pez que colea... */
  splash(position, strength = 1) {
    // Se recicla el anillo más viejo si no queda ninguno libre.
    let ring = this._pool.find((r) => !r.visible);
    if (!ring) { ring = this.ripples[0]; this._retire(ring); ring = this._pool.find((r) => !r.visible); }
    if (!ring) return;
    ring.position.set(position.x, 0, position.z);
    ring.scale.setScalar(1);
    ring.visible = true;
    ring.material.opacity = 0.5;
    ring.userData = { age: 0, strength: clamp(strength, 0.2, 3) };
    this.ripples.push(ring);
  }

  _retire(ring) {
    const i = this.ripples.indexOf(ring);
    if (i >= 0) this.ripples.splice(i, 1);
    ring.visible = false;
    ring.material.opacity = 0;
  }

  update(dt, { sunDirection, sunColor, waterColor, choppiness = 1 } = {}) {
    const u = this.water.material.uniforms;
    u.time.value += dt * 0.55 * choppiness;
    u.distortionScale.value = 2.2 + choppiness * 2.6;
    u.size.value = 24 + choppiness * 8;
    if (sunDirection) u.sunDirection.value.copy(sunDirection).normalize();
    if (sunColor) u.sunColor.value.copy(sunColor);
    if (waterColor) u.waterColor.value.copy(waterColor);

    for (let i = this.ripples.length - 1; i >= 0; i--) {
      const ring = this.ripples[i];
      const data = ring.userData;
      data.age += dt;
      const t = data.age / RIPPLE_LIFETIME;
      if (t >= 1) { this._retire(ring); continue; }
      const scale = 1 + t * 34 * data.strength;
      ring.scale.setScalar(scale);
      ring.material.opacity = 0.5 * (1 - t) * (1 - t);
    }
  }

  /** Altura de la lámina de agua incluyendo el oleaje aproximado. */
  surfaceHeight(x, z, time) {
    return this.level +
      Math.sin(x * 0.28 + time * 1.1) * 0.035 +
      Math.sin(z * 0.21 - time * 0.9) * 0.03;
  }

  dispose() {
    this._pool.forEach((r) => r.material.dispose());
    this.water.geometry.dispose();
    this.water.material.dispose();
    this._rippleGeometry.dispose();
  }
}

/* ===== src/world/SkyDome.js ===== */
/**
 * Cielo e iluminación global.
 *
 * Reúne el cielo atmosférico de Preetham, el sol y la luna como luces
 * direccionales, un campo de estrellas y dos capas de nubes. La sombra sigue
 * al jugador: el volumen del mapa entero no cabría en un shadow map decente.
 */

const SKY_SCALE = 3000;
// Cuánto se atenúa el cielo para poder exponer el resto de la escena.
const SKY_DIM = 0.40;

class SkyDome {
  constructor(scene, textures, preset) {
    this.scene = scene;

    this.sky = new Sky();
    this.sky.scale.setScalar(SKY_SCALE);
    // El cielo de Preetham emite muchísima más luz que cualquier superficie del
    // lago. Con una sola exposición para todo había que bajarla tanto que el
    // resto de la escena salía casi negro: el arbolado era una silueta y la
    // orilla, una mancha marrón. Se atenúa el cielo en su propio shader y se
    // devuelve la exposición del render a un valor normal, así que el cielo
    // sigue igual de luminoso y todo lo demás recibe la luz que le toca.
    // Y con el sol bajo el horizonte, Preetham devuelve un pardo sucio en vez de
    // una noche: se mezcla con el azul nocturno de la paleta.
    this.sky.material.uniforms.uNight = { value: 0 };
    this.sky.material.uniforms.uNightColor = { value: new THREE.Color(0x0a1224) };
    this.sky.material.fragmentShader = this.sky.material.fragmentShader
      .replace('varying vec3 vSunDirection;',
        'varying vec3 vSunDirection;\nuniform float uNight;\nuniform vec3 uNightColor;')
      .replace('gl_FragColor = vec4( retColor, 1.0 );',
        `gl_FragColor = vec4( mix( retColor * ${SKY_DIM.toFixed(3)}, uNightColor, uNight ), 1.0 );`);
    this.sky.material.needsUpdate = true;
    this.sky.material.uniforms.turbidity.value = 2.2;
    this.sky.material.uniforms.rayleigh.value = 3.1;
    this.sky.material.uniforms.mieCoefficient.value = 0.0028;
    this.sky.material.uniforms.mieDirectionalG.value = 0.82;
    scene.add(this.sky);

    this.sun = new THREE.DirectionalLight(0xffffff, 2);
    this.sun.castShadow = preset.shadows;
    if (preset.shadows) {
      const s = this.sun.shadow;
      s.mapSize.set(preset.shadowMapSize, preset.shadowMapSize);
      s.camera.near = 1;
      s.camera.far = 460;
      s.camera.left = s.camera.bottom = -150;
      s.camera.right = s.camera.top = 150;
      s.bias = -0.0012;
      s.normalBias = 0.035;
    }
    scene.add(this.sun);
    scene.add(this.sun.target);

    this.moon = new THREE.DirectionalLight(0x9fb6de, 0);
    scene.add(this.moon);

    this.hemi = new THREE.HemisphereLight(0x9dc0e8, 0x40402c, 0.5);
    scene.add(this.hemi);

    this.ambient = new THREE.AmbientLight(0x404050, 0.35);
    scene.add(this.ambient);

    this._buildStars();
    this._buildClouds(textures);
  }

  _buildStars(count = 1400) {
    const rng = createRandom(88);
    const positions = new Float32Array(count * 3);
    const sizes = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      // Distribución uniforme en la media esfera superior.
      const u = rng() * 2 - 1;
      const theta = rng() * Math.PI * 2;
      const r = Math.sqrt(1 - u * u);
      const y = Math.abs(u);
      positions.set([r * Math.cos(theta) * 2400, y * 2400 + 60, r * Math.sin(theta) * 2400], i * 3);
      sizes[i] = 1 + Math.pow(rng(), 6) * 5;
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
    this.stars = new THREE.Points(geometry, new THREE.PointsMaterial({
      color: 0xdfe8ff, size: 3.2, sizeAttenuation: false,
      transparent: true, opacity: 0, depthWrite: false
    }));
    this.stars.frustumCulled = false;
    this.scene.add(this.stars);
  }

  _buildClouds(textures) {
    const texture = textures.clouds();
    this.cloudLayers = [];
    for (let i = 0; i < 2; i++) {
      const map = texture.clone();
      map.needsUpdate = true;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(16 + i * 6, 16 + i * 6);
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(5200, 5200),
        new THREE.MeshBasicMaterial({
          map, transparent: true, opacity: 0, depthWrite: false,
          side: THREE.DoubleSide, fog: false
        })
      );
      mesh.rotation.x = Math.PI / 2;
      mesh.position.y = 620 + i * 190;
      mesh.renderOrder = -1;
      this.cloudLayers.push(mesh);
      this.scene.add(mesh);
    }
  }

  /** `focus` es la posición del jugador: la sombra se encaja a su alrededor. */
  update(time, weather, dt, focus = null) {
    const sunDir = time.sunDirection;
    this.sky.material.uniforms.sunPosition.value.copy(sunDir).multiplyScalar(SKY_SCALE * 0.5);
    this.sky.material.uniforms.turbidity.value = lerp(2.2, 9, weather.cloudiness);
    this.sky.material.uniforms.rayleigh.value = lerp(3.1, 0.8, weather.cloudiness);

    const daylight = clamp(Math.sin(time.elevation) * 2.2, 0, 1);
    const overcast = 1 - weather.cloudiness * 0.62;

    if (focus) {
      this.sun.position.copy(focus).addScaledVector(sunDir, 210);
      this.sun.target.position.copy(focus);
      this.sun.target.updateMatrixWorld();
      this.sky.position.set(focus.x, 0, focus.z);
      this.stars.position.set(focus.x, 0, focus.z);
      this.cloudLayers.forEach((l) => l.position.set(focus.x, l.position.y, focus.z));
    } else {
      this.sun.position.copy(sunDir).multiplyScalar(140);
    }
    this.sun.color.copy(time.sunColor);
    this.sun.intensity = time.sunIntensity * overcast;
    this.sun.visible = this.sun.intensity > 0.01;

    this.moon.position.copy(focus || new THREE.Vector3()).addScaledVector(time.moonDirection, 140);
    this.moon.intensity = time.nightFactor * 0.5 * overcast;
    this.moon.visible = this.moon.intensity > 0.01;

    this.hemi.color.copy(time.skyColor);
    this.hemi.intensity = lerp(0.5, 3.2, daylight) * overcast;
    this.ambient.color.copy(time.ambientColor);
    this.ambient.intensity = lerp(1.2, 1.15, daylight);

    this.sky.material.uniforms.uNight.value = time.nightFactor * 0.88;
    this.sky.material.uniforms.uNightColor.value.copy(time.skyColor);

    this.stars.material.opacity = time.nightFactor * (1 - weather.cloudiness * 0.85);
    this.stars.visible = this.stars.material.opacity > 0.02;
    this.stars.rotation.y += dt * 0.0035;

    this.cloudLayers.forEach((layer, i) => {
      // Con el cielo despejado no debe quedar ni un velo: antes, una nubosidad
      // residual del 10 % se veía de noche como una capa de suciedad sobre las
      // estrellas. Y de noche las nubes no se iluminan solas.
      layer.material.opacity = clamp((weather.cloudiness - 0.16) * 1.15, 0, 0.9)
        * (i === 0 ? 1 : 0.6) * lerp(0.3, 1, daylight);
      layer.visible = layer.material.opacity > 0.02;
      layer.material.color.copy(time.skyColor).lerp(new THREE.Color(0xffffff), 0.55 - weather.cloudiness * 0.4);
      layer.material.map.offset.x += dt * weather.windSpeed * 0.0016 * (i + 1);
      layer.material.map.offset.y += dt * weather.windSpeed * 0.0007 * (i + 1);
    });
  }

  dispose() {
    this.stars.geometry.dispose();
    this.stars.material.dispose();
    this.cloudLayers.forEach((c) => { c.geometry.dispose(); c.material.dispose(); });
  }
}

/* ===== src/world/Vegetation.js ===== */
/**
 * Vegetación instanciada.
 *
 * Todo lo que se repite (hierba, juncos, arbustos, árboles, rocas) va en
 * InstancedMesh, así que miles de elementos cuestan un puñado de draw calls.
 * La hierba y los juncos se mueven con el viento en el vertex shader, sin
 * coste de CPU.
 *
 * El culling es por celdas: las instancias se agrupan en tiles y cada tile se
 * apaga entero cuando queda lejos, que es mucho más barato que ocultar
 * instancias sueltas.
 */

const TILE_SIZE = 64;

/** Inyecta ondulación de viento en un material estándar. */
function addWind(material, uniforms, { bendScale = 1 } = {}) {
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = uniforms.uTime;
    shader.uniforms.uWind = uniforms.uWind;
    shader.uniforms.uBend = { value: bendScale };
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `
        #include <common>
        uniform float uTime;
        uniform vec3 uWind;
        uniform float uBend;
      `)
      .replace('#include <begin_vertex>', `
        #include <begin_vertex>
        // Sólo se dobla la parte alta: la base queda clavada en el suelo.
        float bendFactor = clamp(position.y, 0.0, 4.0) * uBend;
        vec3 worldOrigin = (modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
        float phase = worldOrigin.x * 0.35 + worldOrigin.z * 0.28;
        float gust = sin(uTime * 1.7 + phase) * 0.6 + sin(uTime * 3.1 + phase * 1.7) * 0.4;
        transformed.xz += uWind.xz * gust * bendFactor * 0.14;
      `);
  };
  material.customProgramCacheKey = () => 'wind' + bendScale;
}

/** Roca irregular: icosaedro con los vértices desplazados por ruido. */
function rockGeometry(rng, detail = 1) {
  const geo = new THREE.IcosahedronGeometry(1, detail);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = 0.72 + rng() * 0.5;
    v.multiplyScalar(n);
    v.y *= 0.72;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

class Vegetation {
  constructor(scene, terrain, textures, preset, { seed = 4321, density = 1 } = {}) {
    this.scene = scene;
    this.terrain = terrain;
    this.group = new THREE.Group();
    this.group.name = 'vegetación';
    scene.add(this.group);

    this.uniforms = {
      uTime: { value: 0 },
      uWind: { value: new THREE.Vector3(1, 0, 0.3) }
    };
    this.tiles = new Map();
    this.viewDistance = preset.viewDistance;
    this.densityScale = density;
    this.rng = createRandom(seed);

    this._buildGrass(textures, preset);
    this._buildReeds(preset);
    this._buildBushes(preset);
    this._buildRocks(textures, preset);
  }

  /** Reparte `count` intentos de colocación y acepta los que cumplan `accept`. */
  _scatter(count, accept) {
    const spots = [];
    const half = this.terrain.field.half - 8;
    for (let i = 0; i < count; i++) {
      const x = (this.rng() * 2 - 1) * half;
      const z = (this.rng() * 2 - 1) * half;
      const h = this.terrain.heightAt(x, z);
      const slope = this.terrain.slopeAt(x, z);
      if (accept(x, z, h, slope)) spots.push({ x, y: h, z });
    }
    return spots;
  }

  _addInstanced(name, geometry, material, spots, transform) {
    if (!spots.length) return null;
    const mesh = new THREE.InstancedMesh(geometry, material, spots.length);
    mesh.name = name;
    const dummy = new THREE.Object3D();
    spots.forEach((spot, i) => {
      transform(dummy, spot, i, this.rng);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    });
    mesh.instanceMatrix.needsUpdate = true;
    mesh.frustumCulled = true;
    this.group.add(mesh);
    return mesh;
  }

  _buildGrass(textures, preset) {
    const density = preset.grassDensity * this.densityScale;
    if (density <= 0) return;
    const spots = this._scatter(Math.floor(26000 * density), (x, z, h, slope) =>
      h > 0.15 && h < 16 && slope < 0.42);

    const material = new THREE.MeshStandardMaterial({
      map: textures.grassBlade(),
      alphaTest: 0.36,
      side: THREE.DoubleSide,
      roughness: 0.92,
      metalness: 0
    });
    addWind(material, this.uniforms, { bendScale: 1 });

    const geometry = crossPlanes(0.7, 0.75);
    this.grass = this._addInstanced('hierba', geometry, material, spots, (d, s, i, rng) => {
      d.position.set(s.x, s.y - 0.05, s.z);
      d.rotation.set(0, rng() * Math.PI, 0);
      const k = 0.7 + rng() * 0.8;
      d.scale.set(k, k * (0.8 + rng() * 0.7), k);
    });
    this._tileify(this.grass, spots, 78);
  }

  _buildReeds(preset) {
    // Juncos: sólo en el bajío, entre 5 cm y 1 m de profundidad.
    const spots = this._scatter(Math.floor(7000 * Math.max(0.35, preset.grassDensity * this.densityScale)),
      (x, z, h) => h < -0.05 && h > -1.05);

    const material = new THREE.MeshStandardMaterial({
      color: 0x6c7a3a, roughness: 0.9, side: THREE.DoubleSide
    });
    addWind(material, this.uniforms, { bendScale: 0.55 });

    const geometry = crossPlanes(0.12, 1.9);
    this.reeds = this._addInstanced('juncos', geometry, material, spots, (d, s, i, rng) => {
      d.position.set(s.x, s.y, s.z);
      d.rotation.set(0, rng() * Math.PI, 0);
      const k = 0.75 + rng() * 0.9;
      d.scale.set(1, k, 1);
    });
    this._tileify(this.reeds, spots, 110);
  }

  _buildBushes(preset) {
    const spots = this._scatter(Math.floor(900 * Math.max(0.4, preset.grassDensity * this.densityScale)),
      (x, z, h, slope) => h > 0.9 && h < 20 && slope < 0.5);
    const geometry = new THREE.IcosahedronGeometry(1, 1);
    const material = new THREE.MeshStandardMaterial({ color: 0x40592c, roughness: 0.95, flatShading: true });
    addWind(material, this.uniforms, { bendScale: 0.18 });
    this.bushes = this._addInstanced('arbustos', geometry, material, spots, (d, s, i, rng) => {
      d.position.set(s.x, s.y + 0.35, s.z);
      d.rotation.set(rng() * 0.4, rng() * Math.PI, rng() * 0.4);
      d.scale.set(0.7 + rng() * 0.9, 0.55 + rng() * 0.6, 0.7 + rng() * 0.9);
    });
    this._tileify(this.bushes, spots, 150);
  }

  _buildRocks(textures, preset) {
    const spots = this._scatter(1200, (x, z, h, slope) =>
      (h > -1.6 && h < 22) && (slope > 0.18 || this.rng() < 0.35)).slice(0, 320);
    const geometry = rockGeometry(this.rng, 1);
    const material = textures.material('roca', { repeat: 1.4 });
    this.rocks = this._addInstanced('rocas', geometry, material, spots, (d, s, i, rng) => {
      d.position.set(s.x, s.y - 0.15, s.z);
      d.rotation.set(rng() * Math.PI, rng() * Math.PI, rng() * Math.PI);
      const k = 0.35 + Math.pow(rng(), 2.2) * 2.4;
      d.scale.set(k, k * (0.6 + rng() * 0.5), k);
    });
    this.rocks.castShadow = preset.shadows;
    this.rocks.receiveShadow = preset.shadows;
    this._tileify(this.rocks, spots, this.viewDistance);
  }

  /** Registra la celda y la distancia a la que deja de dibujarse. */
  _tileify(mesh, spots, distance) {
    if (!mesh) return;
    let cx = 0, cz = 0;
    spots.forEach((s) => { cx += s.x; cz += s.z; });
    mesh.userData.center = new THREE.Vector3(cx / spots.length, 0, cz / spots.length);
    mesh.userData.cullDistance = distance;
    this.tiles.set(mesh.name, mesh);
  }

  update(dt, wind, playerPosition) {
    this.uniforms.uTime.value += dt;
    this.uniforms.uWind.value.set(wind.x, 0, wind.z);

    // Las instancias cubren todo el mapa, así que el corte por distancia se
    // hace contra el radio real de cada grupo, no contra su centro.
    this.tiles.forEach((mesh) => {
      const d = mesh.userData.center.distanceTo(playerPosition);
      mesh.visible = d < mesh.userData.cullDistance + 320;
    });
  }

  dispose() {
    this.group.traverse((o) => {
      if (!o.isInstancedMesh) return;
      o.geometry.dispose();
      if (!o.material.userData.shared) o.material.dispose();
    });
    this.scene.remove(this.group);
  }
}

/* ===== src/world/GrassBlades.js ===== */
/**
 * Césped de briznas reales alrededor del jugador.
 *
 * La hierba lejana son cartas cruzadas (`Vegetation`), que a distancia se leen
 * perfectamente y cuestan poco. De cerca eso canta, así que aquí hay briznas
 * de verdad: cintas curvadas de cuatro segmentos, instanciadas.
 *
 * El truco para que salga barato es que el conjunto de briznas es fijo y
 * *acompaña* al jugador: cuando se aleja lo suficiente, sus posiciones se
 * recalculan sobre el terreno del sitio nuevo. Así hay césped denso en todo el
 * mapa con un número de instancias acotado y una sola draw call.
 */

const PATCH_RADIUS = 9.5;     // metros de césped denso alrededor del jugador
const GRASS_STEP = 2.5;           // el césped se recoloca cuando el jugador anda esto

/** Una brizna: cinta que se estrecha hacia la punta y se curva hacia atrás. */
function bladeGeometry({ segments = 4, height = 1, width = 0.032, bend = 0.3 } = {}) {
  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const w = width * (1 - Math.pow(t, 1.4)) * 0.5;
    const y = t * height;
    const z = Math.pow(t, 2) * bend;          // se dobla hacia atrás
    positions.push(-w, y, z, w, y, z);
    normals.push(0, 0, 1, 0, 0, 1);
    uvs.push(0, t, 1, t);
  }
  for (let i = 0; i < segments; i++) {
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    indices.push(a, c, b, b, c, d);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  return geo;
}

class GrassBlades {
  constructor(scene, terrain, preset, { seed = 5150, density = 1 } = {}) {
    this.scene = scene;
    this.terrain = terrain;
    this.rng = createRandom(seed);
    this.count = Math.floor(9000 * preset.grassDensity * density);
    this.enabled = this.count > 0;
    if (!this.enabled) return;

    this.uniforms = {
      uTime: { value: 0 },
      uWind: { value: new THREE.Vector3(1, 0, 0.3) }
    };

    const material = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      // Sin `vertexColors`: el color va por instancia y la geometría de la
      // brizna no tiene atributo de color — activarlo la pintaba de negro.
      roughness: 0.92,
      metalness: 0,
      side: THREE.DoubleSide
    });
    this._addWind(material);

    this.mesh = new THREE.InstancedMesh(bladeGeometry(), material, this.count);
    this.mesh.name = 'cesped';
    this.mesh.frustumCulled = false;
    this.mesh.castShadow = false;
    this.mesh.receiveShadow = false;
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(this.count * 3), 3);
    scene.add(this.mesh);

    // Reparto fijo dentro del disco: sólo cambia el centro al moverse.
    this.offsets = [];
    for (let i = 0; i < this.count; i++) {
      const angle = this.rng() * Math.PI * 2;
      // Raíz cuadrada para que la densidad sea uniforme en área, no en radio.
      const radius = Math.sqrt(this.rng()) * PATCH_RADIUS;
      // Las briznas del borde se acortan: sin esto el disco de césped se
      // corta en un círculo perfectamente visible alrededor del jugador.
      const edgeFade = 1 - Math.pow(clamp(radius / PATCH_RADIUS, 0, 1), 3.5);
      this.offsets.push({
        dx: Math.cos(angle) * radius,
        dz: Math.sin(angle) * radius,
        edgeFade,
        rotation: this.rng() * Math.PI * 2,
        height: 0.24 + this.rng() * 0.4,
        lean: (this.rng() - 0.5) * 0.35,
        tint: this.rng()
      });
    }

    this._dummy = new THREE.Object3D();
    this._color = new THREE.Color();
    this._last = new THREE.Vector3(1e9, 0, 1e9);
    this.budget = this.count;
  }

  _addWind(material) {
    material.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = this.uniforms.uTime;
      shader.uniforms.uWind = this.uniforms.uWind;
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', `
          #include <common>
          uniform float uTime;
          uniform vec3 uWind;
        `)
        .replace('#include <begin_vertex>', `
          #include <begin_vertex>
          // La punta se dobla; la base no se mueve del suelo.
          float blade = clamp(position.y * 2.2, 0.0, 1.6);
          vec3 root = (modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
          float phase = root.x * 0.7 + root.z * 0.55;
          float gust = sin(uTime * 2.1 + phase) * 0.6 + sin(uTime * 3.7 + phase * 1.6) * 0.4;
          transformed.xz += uWind.xz * gust * blade * 0.055;
        `);
    };
    material.customProgramCacheKey = () => 'cespedViento';
  }

  /** Recoloca el disco de césped alrededor del jugador. */
  _rebuild(center) {
    const d = this._dummy;
    const water = this.terrain.waterLevel;
    let placed = 0;

    for (let i = 0; i < this.offsets.length && placed < this.budget; i++) {
      const o = this.offsets[i];
      const x = center.x + o.dx;
      const z = center.z + o.dz;
      const y = this.terrain.heightAt(x, z);

      // Ni dentro del agua, ni en pendientes donde no agarra tierra.
      if (y < water + 0.08 || y > 22 || this.terrain.slopeAt(x, z) > 0.45) continue;

      d.position.set(x, y - 0.02, z);
      d.rotation.set(o.lean * 0.4, o.rotation, o.lean);
      d.scale.set(1, o.height * o.edgeFade, 1);
      d.updateMatrix();
      this.mesh.setMatrixAt(placed, d.matrix);

      // Verdes distintos por brizna: sin esto el césped se ve como fieltro.
      this._color.setHSL(0.23 + o.tint * 0.06, 0.32 + o.tint * 0.22, 0.26 + o.tint * 0.2);
      this.mesh.setColorAt(placed, this._color);
      placed++;
    }

    this.mesh.count = placed;
    this.mesh.instanceMatrix.needsUpdate = true;
    if (this.mesh.instanceColor) this.mesh.instanceColor.needsUpdate = true;
  }

  update(dt, wind, playerPosition) {
    if (!this.enabled) return;
    this.uniforms.uTime.value += dt;
    this.uniforms.uWind.value.set(wind.x, 0, wind.z);

    if (this._last.distanceToSquared(playerPosition) < GRASS_STEP * GRASS_STEP) return;
    this._last.copy(playerPosition);
    this._rebuild(playerPosition);
  }

  /** Reduce o restaura la cantidad de briznas sin reconstruir nada. */
  setBudget(fraction) {
    this.budget = Math.floor(this.count * clamp(fraction, 0.1, 1));
    this._last.set(1e9, 0, 1e9);
  }

  get stats() { return { pobladas: this.mesh?.count ?? 0, total: this.count, presupuesto: this.budget }; }

  dispose() {
    if (!this.enabled) return;
    this.mesh.geometry.dispose();
    this.mesh.material.dispose();
    this.scene.remove(this.mesh);
  }
}

/* ===== src/world/Trees.js ===== */
/**
 * Arbolado con geometría real y LOD por instancia.
 *
 * Cerca, cada árbol es un tronco con ramas y una copa de varios volúmenes;
 * lejos, un cartel con la mancha de follaje. El intercambio se hace escalando
 * a cero las instancias del nivel que no toca —la técnica habitual con
 * InstancedMesh— y sólo se recalcula cuando el jugador se ha movido de verdad,
 * no cada fotograma.
 */

const NEAR_DISTANCE = 70;     // metros hasta los que se dibuja el árbol completo
const REBUILD_STEP = 6;       // el LOD se revisa cuando el jugador anda esto

/** Tronco cónico con tres o cuatro ramas. */
function trunkGeometry(rng, { height = 5.4, radius = 0.24 } = {}) {
  const parts = [];
  const trunk = new THREE.CylinderGeometry(radius * 0.42, radius, height, 7, 1);
  trunk.translate(0, height / 2, 0);
  parts.push(trunk);

  const branches = 3 + Math.floor(rng() * 2);
  for (let i = 0; i < branches; i++) {
    const t = 0.55 + rng() * 0.35;
    const length = height * (0.22 + rng() * 0.2);
    const branch = new THREE.CylinderGeometry(radius * 0.1, radius * 0.28, length, 5, 1);
    branch.translate(0, length / 2, 0);
    branch.rotateZ((rng() * 0.5 + 0.5) * (rng() < 0.5 ? 1 : -1));
    branch.rotateY((i / branches) * Math.PI * 2 + rng());
    branch.translate(0, height * t, 0);
    parts.push(branch);
  }
  const merged = mergeGeometries(parts);
  parts.forEach((p) => p.dispose());
  return merged;
}

/** Copa de hoja ancha: varios volúmenes solapados. */
function canopyBlobs(rng, { height = 5.4 } = {}) {
  const parts = [];
  const blobs = 5 + Math.floor(rng() * 3);
  for (let i = 0; i < blobs; i++) {
    const r = 1.1 + rng() * 0.9;
    const blob = new THREE.IcosahedronGeometry(r, 0);
    const angle = (i / blobs) * Math.PI * 2 + rng() * 0.6;
    const spread = 0.9 + rng() * 1.1;
    blob.translate(
      Math.cos(angle) * spread,
      height * (0.9 + rng() * 0.35),
      Math.sin(angle) * spread
    );
    parts.push(blob);
  }
  const merged = mergeGeometries(parts);
  parts.forEach((p) => p.dispose());
  return merged;
}

/** Copa de conífera: conos apilados. */
function canopyCone(rng, { height = 6.2 } = {}) {
  const parts = [];
  const tiers = 3 + Math.floor(rng() * 2);
  for (let i = 0; i < tiers; i++) {
    const t = i / tiers;
    const radius = 2.3 * (1 - t * 0.62);
    const cone = new THREE.ConeGeometry(radius, 2.1, 8, 1);
    cone.translate(0, height * 0.68 + i * 1.35, 0);
    parts.push(cone);
  }
  const merged = mergeGeometries(parts);
  parts.forEach((p) => p.dispose());
  return merged;
}

class Trees {
  constructor(scene, terrain, textures, preset, { seed = 8080, count = 420, conifer = 0.38 } = {}) {
    this.scene = scene;
    this.terrain = terrain;
    this.rng = createRandom(seed);
    this.group = new THREE.Group();
    this.group.name = 'arbolado';
    scene.add(this.group);

    this.nearDistance = Math.min(NEAR_DISTANCE, preset.viewDistance * 0.4);
    this.coniferRatio = conifer;
    this.spots = this._scatter(count);
    this._lastRebuild = new THREE.Vector3(1e9, 0, 1e9);
    this._dummy = new THREE.Object3D();

    this._buildMeshes(textures, preset);
  }

  _scatter(count) {
    const spots = [];
    const half = this.terrain.field.half - 10;
    let attempts = 0;
    while (spots.length < count && attempts < count * 30) {
      attempts++;
      const x = (this.rng() * 2 - 1) * half;
      const z = (this.rng() * 2 - 1) * half;
      const h = this.terrain.heightAt(x, z);
      if (h < 1.8 || h > 24) continue;
      if (this.terrain.slopeAt(x, z) > 0.42) continue;
      spots.push({
        x, y: h, z,
        conifer: this.rng() < this.coniferRatio,
        scale: 0.75 + this.rng() * 0.7,
        rotation: this.rng() * Math.PI * 2,
        tilt: (this.rng() - 0.5) * 0.1
      });
    }
    return spots;
  }

  _buildMeshes(textures, preset) {
    const rng = this.rng;
    const barkMaterial = textures.material('corteza', { repeat: 2 });
    const leafMaterial = new THREE.MeshStandardMaterial({
      color: 0x5f7f3c, roughness: 0.9, metalness: 0, flatShading: true
    });
    const coniferMaterial = new THREE.MeshStandardMaterial({
      color: 0x40603a, roughness: 0.92, metalness: 0, flatShading: true
    });

    const count = this.spots.length;
    this.near = {
      trunk: new THREE.InstancedMesh(trunkGeometry(rng), barkMaterial, count),
      broad: new THREE.InstancedMesh(canopyBlobs(rng), leafMaterial, count),
      conifer: new THREE.InstancedMesh(canopyCone(rng), coniferMaterial, count)
    };

    const billboardGeometry = crossPlanes(5.6, 6.4, 0.62);
    const billboardMaterial = new THREE.MeshStandardMaterial({
      map: textures.foliage(), alphaTest: 0.42, side: THREE.DoubleSide, roughness: 0.9
    });
    this.far = new THREE.InstancedMesh(billboardGeometry, billboardMaterial, count);

    [this.near.trunk, this.near.broad, this.near.conifer, this.far].forEach((mesh) => {
      mesh.castShadow = preset.shadows;
      mesh.receiveShadow = preset.shadows;
      mesh.frustumCulled = false;      // el LOD ya decide qué se dibuja
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      this.group.add(mesh);
    });

    this._applyLOD(new THREE.Vector3(0, 0, 0));
  }

  /** Escribe las matrices: escala 0 en el nivel que no corresponde. */
  _applyLOD(playerPosition) {
    const d = this._dummy;
    const near = this.near;
    const hidden = new THREE.Matrix4().makeScale(0, 0, 0);

    let trunkCount = 0, broadCount = 0, coniferCount = 0, farCount = 0;

    for (let i = 0; i < this.spots.length; i++) {
      const spot = this.spots[i];
      const dx = spot.x - playerPosition.x;
      const dz = spot.z - playerPosition.z;
      const distance = Math.hypot(dx, dz);
      const isNear = distance < this.nearDistance;

      d.position.set(spot.x, spot.y, spot.z);
      d.rotation.set(spot.tilt, spot.rotation, spot.tilt * 0.6);
      d.scale.setScalar(spot.scale);
      d.updateMatrix();

      if (isNear) {
        near.trunk.setMatrixAt(trunkCount++, d.matrix);
        if (spot.conifer) near.conifer.setMatrixAt(coniferCount++, d.matrix);
        else near.broad.setMatrixAt(broadCount++, d.matrix);
        this.far.setMatrixAt(i, hidden);
      } else {
        // El cartel se planta un poco más alto: sustituye a copa y tronco.
        d.position.y = spot.y + 2.4 * spot.scale;
        d.rotation.set(0, spot.rotation, 0);
        d.updateMatrix();
        this.far.setMatrixAt(farCount++, d.matrix);
      }
    }

    near.trunk.count = trunkCount;
    near.broad.count = broadCount;
    near.conifer.count = coniferCount;
    this.far.count = farCount;

    near.trunk.instanceMatrix.needsUpdate = true;
    near.broad.instanceMatrix.needsUpdate = true;
    near.conifer.instanceMatrix.needsUpdate = true;
    this.far.instanceMatrix.needsUpdate = true;
  }

  update(playerPosition) {
    if (this._lastRebuild.distanceToSquared(playerPosition) < REBUILD_STEP * REBUILD_STEP) return;
    this._lastRebuild.copy(playerPosition);
    this._applyLOD(playerPosition);
  }

  get stats() {
    return {
      total: this.spots.length,
      cerca: this.near.trunk.count,
      lejos: this.far.count
    };
  }

  dispose() {
    [this.near.trunk, this.near.broad, this.near.conifer, this.far].forEach((m) => {
      m.geometry.dispose();
      if (!m.material.userData.shared) m.material.dispose();
    });
    this.scene.remove(this.group);
  }
}

/* ===== src/world/InteractionSystem.js ===== */
/**
 * Interacción por mirada.
 *
 * Los objetos se registran con su malla, un alcance y una acción. Cada
 * fotograma se busca cuál está mirando el jugador: primero por rayo desde la
 * cámara, y si no acierta de lleno, por ángulo respecto a la vista, para que
 * no haya que apuntar con precisión de francotirador.
 *
 * El elegido se resalta —sube su emisivo— y publica su rótulo. Así el jugador
 * ve a qué va a afectar el botón antes de pulsarlo, en vez de adivinarlo por
 * cercanía.
 */

const MAX_ANGLE = Math.cos(THREE.MathUtils.degToRad(32));

class InteractionSystem {
  constructor(camera) {
    this.camera = camera;
    this.targets = [];
    this.current = null;
    this.raycaster = new THREE.Raycaster();
    this._origin = new THREE.Vector3();
    this._forward = new THREE.Vector3();
    this._toTarget = new THREE.Vector3();
    this._point = new THREE.Vector3();
  }

  /**
   * @param target.object   malla o grupo al que mirar
   * @param target.anchor   punto alternativo si no hay malla
   * @param target.range    distancia máxima en metros
   * @param target.label    texto del aviso; puede ser función
   * @param target.action   qué ocurre al interactuar
   * @param target.enabled  condición opcional
   */
  register(target) {
    this.targets.push({ range: 3.5, ...target });
    return () => this.unregister(target);
  }

  unregister(target) {
    const i = this.targets.findIndex((t) => t === target || t.object === target);
    if (i >= 0) this.targets.splice(i, 1);
  }

  clear() {
    this._highlight(null);
    this.targets.length = 0;
  }

  _anchorOf(target, out) {
    if (target.anchor) return out.copy(target.anchor);
    if (target.object) return target.object.getWorldPosition(out);
    return out.set(0, 0, 0);
  }

  /** Resalta el objeto apuntado y apaga el anterior. */
  _highlight(target) {
    if (this._lit === target) return;
    const paint = (t, on) => {
      t?.object?.traverse?.((o) => {
        if (!o.isMesh || !o.material?.emissive) return;
        if (on) {
          o.userData._emissive ??= o.material.emissive.getHex();
          o.material.emissive.setHex(0x1c3a3a);
        } else if (o.userData._emissive !== undefined) {
          o.material.emissive.setHex(o.userData._emissive);
        }
      });
    };
    paint(this._lit, false);
    paint(target, true);
    this._lit = target;
  }

  update(playerPosition) {
    this.camera.getWorldPosition(this._origin);
    this.camera.getWorldDirection(this._forward);

    let best = null;
    let bestScore = -Infinity;

    for (const target of this.targets) {
      if (target.enabled && !target.enabled()) continue;
      this._anchorOf(target, this._point);
      const distance = playerPosition.distanceTo(this._point);
      if (distance > target.range) continue;

      this._toTarget.copy(this._point).sub(this._origin);
      const length = this._toTarget.length();
      if (length < 1e-3) continue;
      this._toTarget.divideScalar(length);
      const facing = this._forward.dot(this._toTarget);
      if (facing < MAX_ANGLE) continue;          // está a la espalda o muy de lado

      // Se prefiere lo que está más centrado en la vista, y a igualdad, lo más cerca.
      const score = facing * 2 - distance / target.range;
      if (score > bestScore) { bestScore = score; best = target; }
    }

    this.current = best;
    this._highlight(best);
    return best;
  }

  get label() {
    const t = this.current;
    if (!t) return '';
    return typeof t.label === 'function' ? t.label() : t.label;
  }

  /** Ejecuta la acción del objeto apuntado. Devuelve si hizo algo. */
  interact() {
    if (!this.current) return false;
    this.current.action?.();
    return true;
  }
}

/* ===== src/world/AmbientLife.js ===== */
/**
 * Vida ambiental: lo que ocurre en el lago sin que el jugador haga nada.
 *
 * Peces que saltan a lo lejos, bandos de pájaros cruzando, rachas de viento
 * que recorren la vegetación y anillos sueltos en la superficie. Nada de esto
 * afecta a la partida; está para que el sitio no parezca una maqueta.
 *
 * Todos los eventos se reparten en el tiempo con esperas aleatorias y se
 * modulan con la hora y el tiempo atmosférico: al amanecer salta más pescado,
 * con tormenta no hay pájaros.
 */

const JUMP_POOL = 4;
const BIRD_POOL = 6;

class AmbientLife {
  constructor(scene, terrain, water, { seed = 606, audio = null } = {}) {
    this.scene = scene;
    this.terrain = terrain;
    this.water = water;
    this.audio = audio;
    this.rng = createRandom(seed);

    this.group = new THREE.Group();
    this.group.name = 'ambiente';
    scene.add(this.group);

    this.jumpTimer = 6 + this.rng() * 10;
    this.birdTimer = 12 + this.rng() * 20;
    this.gustTimer = 8 + this.rng() * 14;
    this.rippleTimer = 3 + this.rng() * 5;
    this.gust = 0;

    this._buildJumpers();
    this._buildBirds();
  }

  _buildJumpers() {
    const geometry = new THREE.SphereGeometry(0.5, 8, 6);
    const pos = geometry.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const taper = 1 - Math.pow(Math.abs(v.z / 0.5), 2) * 0.8;
      v.x *= 0.3 * taper; v.y *= 0.5 * taper; v.z *= 2.1;
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    geometry.computeVertexNormals();

    this.jumpers = [];
    for (let i = 0; i < JUMP_POOL; i++) {
      const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
        color: 0x8d9aa2, roughness: 0.3, metalness: 0.35
      }));
      mesh.visible = false;
      this.group.add(mesh);
      this.jumpers.push({ mesh, active: false, t: 0, duration: 1, from: new THREE.Vector3(), to: new THREE.Vector3(), height: 1 });
    }
  }

  _buildBirds() {
    // Un pájaro: dos alas en uve que baten. Barato y se lee a distancia.
    const wing = new THREE.PlaneGeometry(0.9, 0.26);
    wing.translate(0.45, 0, 0);
    const material = new THREE.MeshBasicMaterial({ color: 0x2a2f36, side: THREE.DoubleSide, fog: true });

    this.birds = [];
    for (let i = 0; i < BIRD_POOL; i++) {
      const bird = new THREE.Group();
      const left = new THREE.Mesh(wing, material);
      const right = new THREE.Mesh(wing, material);
      right.rotation.y = Math.PI;
      bird.add(left); bird.add(right);
      bird.visible = false;
      this.group.add(bird);
      this.birds.push({ group: bird, left, right, active: false, t: 0, speed: 1, phase: 0, from: new THREE.Vector3(), to: new THREE.Vector3() });
    }
  }

  /** Punto de agua al azar dentro de un anillo alrededor del jugador. */
  _waterPointNear(center, min = 14, max = 55) {
    for (let i = 0; i < 24; i++) {
      const angle = this.rng() * Math.PI * 2;
      const radius = lerp(min, max, this.rng());
      const x = center.x + Math.cos(angle) * radius;
      const z = center.z + Math.sin(angle) * radius;
      if (this.terrain.depthAt(x, z) > 1.2) return new THREE.Vector3(x, this.terrain.waterLevel, z);
    }
    return null;
  }

  _startJump(center, energy) {
    const spot = this._waterPointNear(center);
    if (!spot) return;
    const jumper = this.jumpers.find((j) => !j.active);
    if (!jumper) return;

    const angle = this.rng() * Math.PI * 2;
    const distance = 0.8 + this.rng() * 2.2;
    jumper.from.copy(spot);
    jumper.to.set(spot.x + Math.cos(angle) * distance, spot.y, spot.z + Math.sin(angle) * distance);
    jumper.height = 0.5 + this.rng() * 1.1 * energy;
    jumper.duration = 0.55 + this.rng() * 0.4;
    jumper.t = 0;
    jumper.size = 0.18 + this.rng() * 0.4;
    jumper.active = true;
    jumper.mesh.visible = true;
    jumper.mesh.scale.setScalar(jumper.size);

    this.water.splash(spot, 0.5);
    this.audio?.distantSplash?.(clamp(1 - center.distanceTo(spot) / 70, 0.15, 1));
  }

  _startFlock(center, count) {
    const height = 40 + this.rng() * 60;
    const angle = this.rng() * Math.PI * 2;
    const across = 260;
    const from = new THREE.Vector3(
      center.x + Math.cos(angle) * across, height, center.z + Math.sin(angle) * across
    );
    const to = new THREE.Vector3(
      center.x - Math.cos(angle) * across, height + (this.rng() - 0.5) * 20, center.z - Math.sin(angle) * across
    );
    for (let i = 0; i < count; i++) {
      const bird = this.birds.find((x) => !x.active);
      if (!bird) return;
      const spread = new THREE.Vector3((this.rng() - 0.5) * 26, (this.rng() - 0.5) * 8, (this.rng() - 0.5) * 26);
      bird.from.copy(from).add(spread);
      bird.to.copy(to).add(spread);
      bird.t = -i * 0.12;                       // el bando se escalona
      bird.speed = 0.028 + this.rng() * 0.014;
      bird.phase = this.rng() * 6.28;
      bird.active = true;
      bird.group.visible = true;
      bird.group.scale.setScalar(1.6 + this.rng() * 1.2);
    }
  }

  /** Racha de viento en curso, que Game suma al viento base. */
  get gustStrength() { return this.gust; }

  update(dt, { player, time, weather }) {
    const feeding = time.feedingFactor;
    const calm = 1 - clamp(weather.rainAmount, 0, 1);

    // --- peces saltando -------------------------------------------------
    this.jumpTimer -= dt * (0.35 + feeding * 0.5);
    if (this.jumpTimer <= 0) {
      this.jumpTimer = 14 + this.rng() * 38 / Math.max(0.4, feeding);
      this._startJump(player, 0.6 + feeding * 0.6);
    }
    for (const j of this.jumpers) {
      if (!j.active) continue;
      j.t += dt;
      const k = j.t / j.duration;
      if (k >= 1) {
        j.active = false;
        j.mesh.visible = false;
        this.water.splash(j.to, 0.75);
        continue;
      }
      // Parábola entre entrada y salida del agua.
      j.mesh.position.lerpVectors(j.from, j.to, k);
      j.mesh.position.y = j.from.y + Math.sin(k * Math.PI) * j.height;
      const dir = j.to.clone().sub(j.from).normalize();
      j.mesh.rotation.set(lerp(-0.9, 0.9, k), Math.atan2(dir.x, dir.z) + Math.PI / 2, Math.sin(k * 6) * 0.2);
    }

    // --- pájaros ---------------------------------------------------------
    this.birdTimer -= dt * calm;
    if (this.birdTimer <= 0) {
      this.birdTimer = 25 + this.rng() * 55;
      if (time.nightFactor < 0.6) this._startFlock(player, 2 + Math.floor(this.rng() * 4));
    }
    for (const bird of this.birds) {
      if (!bird.active) continue;
      bird.t += dt * bird.speed;
      if (bird.t >= 1) { bird.active = false; bird.group.visible = false; continue; }
      if (bird.t < 0) continue;
      bird.group.position.lerpVectors(bird.from, bird.to, bird.t);
      const dir = bird.to.clone().sub(bird.from).normalize();
      bird.group.rotation.y = Math.atan2(dir.x, dir.z) - Math.PI / 2;
      const flap = Math.sin(bird.phase + performance.now() * 0.006) * 0.7;
      bird.left.rotation.z = flap;
      bird.right.rotation.z = -flap;
    }

    // --- rachas de viento -------------------------------------------------
    this.gustTimer -= dt;
    if (this.gustTimer <= 0) {
      this.gustTimer = 9 + this.rng() * 22;
