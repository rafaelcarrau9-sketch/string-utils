<script type="module">
import * as THREE from 'three';
import { Water } from 'three/addons/objects/Water.js';
import { Sky } from 'three/addons/objects/Sky.js';

/* ===== src/core/MathUtils.js ===== */
/** Utilidades numéricas compartidas. Sin dependencias de three. */

const clamp = (v, min, max) => (v < min ? min : v > max ? max : v);

const lerp = (a, b, t) => a + (b - a) * t;

const smoothstep = (edge0, edge1, x) => {
  const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
  return t * t * (3 - 2 * t);
};

/** Interpolación exponencial independiente del framerate. */
const damp = (current, target, lambda, dt) =>
  lerp(current, target, 1 - Math.exp(-lambda * dt));

const randRange = (rng, min, max) => min + rng() * (max - min);

/** Distribución sesgada hacia el extremo bajo: los ejemplares grandes son raros. */
function skewedRandom(rng, min, max, bias = 2.2) {
  return min + (max - min) * Math.pow(rng(), bias);
}

/** Mulberry32: PRNG determinista y rápido, para mundos reproducibles. */
function createRandom(seed = 1) {
  let a = seed >>> 0;
  return function random() {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Ruido de valor 2D con interpolación suave. Base de todo el terreno. */
function makeValueNoise2D(seed = 1) {
  const perm = new Uint8Array(512);
  const rng = createRandom(seed);
  for (let i = 0; i < 256; i++) perm[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [perm[i], perm[j]] = [perm[j], perm[i]];
  }
  for (let i = 0; i < 256; i++) perm[i + 256] = perm[i];

  const hash = (x, y) => perm[(perm[x & 255] + y) & 255] / 255;

  return function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi), b = hash(xi + 1, yi);
    const c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  };
}

/** Suma de octavas. amplitude/frequency por octava con lacunaridad 2. */
function fbm(noise, x, y, octaves = 4, persistence = 0.5) {
  let total = 0, amplitude = 1, frequency = 1, max = 0;
  for (let i = 0; i < octaves; i++) {
    total += noise(x * frequency, y * frequency) * amplitude;
    max += amplitude;
    amplitude *= persistence;
    frequency *= 2;
  }
  return total / max;
}

/* ===== src/core/GeometryUtils.js ===== */
/** Fusiona geometrías indexadas con los mismos atributos (position/normal/uv). */
function mergeGeometries(geometries) {
  const result = new THREE.BufferGeometry();
  const names = ['position', 'normal', 'uv'];
  const total = geometries.reduce((n, g) => n + g.attributes.position.count, 0);
  const buffers = {};
  names.forEach((name) => {
    const size = geometries[0].attributes[name].itemSize;
    buffers[name] = { array: new Float32Array(total * size), size, offset: 0 };
  });

  const indices = [];
  let vertexOffset = 0;
  for (const g of geometries) {
    const indexed = g.index ? g : g.toNonIndexed();
    const src = indexed.index ? indexed : indexed;
    names.forEach((name) => {
      const data = src.attributes[name].array;
      buffers[name].array.set(data, buffers[name].offset);
      buffers[name].offset += data.length;
    });
    if (src.index) {
      const idx = src.index.array;
      for (let i = 0; i < idx.length; i++) indices.push(idx[i] + vertexOffset);
    } else {
      const count = src.attributes.position.count;
      for (let i = 0; i < count; i++) indices.push(i + vertexOffset);
    }
    vertexOffset += src.attributes.position.count;
  }

  names.forEach((name) => {
    result.setAttribute(name, new THREE.BufferAttribute(buffers[name].array, buffers[name].size));
  });
  result.setIndex(indices);
  return result;
}

/** Dos planos cruzados en X, con el pivote en la base. Para hierba y follaje. */
function crossPlanes(width, height) {
  const a = new THREE.PlaneGeometry(width, height, 1, 2);
  a.translate(0, height / 2, 0);
  const b = a.clone();
  b.rotateY(Math.PI / 2);
  const merged = mergeGeometries([a, b]);
  a.dispose();
  b.dispose();
  return merged;
}

/* ===== src/core/SaveSystem.js ===== */
/**
 * Persistencia en localStorage. Tolerante a partidas de versiones anteriores:
 * lo que ya no existe en los catálogos se descarta al cargar en vez de romper.
 */

const KEY = 'stillwaters.save.v1';
const VERSION = 1;

class SaveSystem {
  constructor(storage = globalThis.localStorage) {
    this.storage = storage;
  }

  save(payload) {
    try {
      this.storage.setItem(KEY, JSON.stringify({ version: VERSION, ...payload }));
      return true;
    } catch (err) {
      console.warn('[save] no se pudo guardar:', err.message);
      return false;
    }
  }

  load() {
    try {
      const raw = this.storage.getItem(KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || data.version !== VERSION) return null;
      return data;
    } catch (err) {
      console.warn('[save] partida ilegible, se empieza de cero:', err.message);
      return null;
    }
  }

  clear() {
    try { this.storage.removeItem(KEY); } catch { /* almacenamiento bloqueado */ }
  }
}

/* ===== src/core/Input.js ===== */
/**
 * Entrada unificada: teclado, ratón con pointer lock y rueda.
 * No decide nada de gameplay; sólo expone estado consultable y eventos.
 */

class Input {
  constructor(domElement) {
    this.dom = domElement;
    this.keys = new Set();
    this.mouse = { dx: 0, dy: 0, wheel: 0, left: false, right: false };
    this.locked = false;
    this.enabled = true;
    this._listeners = new Map();

    this._onKeyDown = (e) => {
      if (!this.enabled) return;
      this.keys.add(e.code);
      this._emit('keydown', e);
      if (['Space', 'Tab', 'KeyE'].includes(e.code)) e.preventDefault();
    };
    this._onKeyUp = (e) => { this.keys.delete(e.code); this._emit('keyup', e); };
    this._onMove = (e) => {
      if (!this.locked) return;
      this.mouse.dx += e.movementX || 0;
      this.mouse.dy += e.movementY || 0;
    };
    this._onDown = (e) => {
      if (e.button === 0) this.mouse.left = true;
      if (e.button === 2) this.mouse.right = true;
      this._emit('pointerdown', e);
    };
    this._onUp = (e) => {
      if (e.button === 0) this.mouse.left = false;
      if (e.button === 2) this.mouse.right = false;
      this._emit('pointerup', e);
    };
    this._onWheel = (e) => { this.mouse.wheel += Math.sign(e.deltaY); };
    this._onLockChange = () => {
      this.locked = document.pointerLockElement === this.dom;
      this._emit('lockchange', this.locked);
    };

    window.addEventListener('keydown', this._onKeyDown);
    window.addEventListener('keyup', this._onKeyUp);
    window.addEventListener('mousemove', this._onMove);
    window.addEventListener('mousedown', this._onDown);
    window.addEventListener('mouseup', this._onUp);
    window.addEventListener('wheel', this._onWheel, { passive: true });
    document.addEventListener('pointerlockchange', this._onLockChange);
    this.dom.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  on(event, fn) {
    if (!this._listeners.has(event)) this._listeners.set(event, new Set());
    this._listeners.get(event).add(fn);
    return () => this._listeners.get(event).delete(fn);
  }

  _emit(event, arg) {
    const set = this._listeners.get(event);
    if (set) set.forEach((fn) => fn(arg));
  }

  isDown(code) { return this.keys.has(code); }

  requestLock() { this.dom.requestPointerLock?.(); }
  releaseLock() { document.exitPointerLock?.(); }

  /** Consume el delta acumulado: llamar una vez por frame. */
  consumeMouseDelta() {
    const d = { dx: this.mouse.dx, dy: this.mouse.dy, wheel: this.mouse.wheel };
    this.mouse.dx = this.mouse.dy = this.mouse.wheel = 0;
    return d;
  }

  setEnabled(value) {
    this.enabled = value;
    if (!value) this.keys.clear();
  }
}

/* ===== src/world/Textures.js ===== */
/**
 * Fábrica de texturas procedurales.
 *
 * El juego no puede descargar imágenes (la página publicada bloquea cualquier
 * recurso externo que no sea un script), así que todos los mapas de color,
 * normal y rugosidad se generan por código sobre un canvas. Cada material
 * devuelve un juego completo de mapas para que el PBR de three responda bien
 * a la luz en vez de verse plano.
 *
 * Para sustituirlos más adelante por texturas reales basta con cambiar
 * `TextureLibrary.material()` por un cargador: el resto del juego sólo pide
 * materiales por nombre.
 */

function canvasOf(size) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  return canvas;
}

/** Convierte un campo de alturas en un mapa de normales tangenciales (sobel). */
function heightToNormal(height, size, strength = 2.2) {
  const canvas = canvasOf(size);
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  const at = (x, y) => height[((y + size) % size) * size + ((x + size) % size)];

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const dx = (at(x + 1, y) - at(x - 1, y)) * strength;
      const dy = (at(x, y + 1) - at(x, y - 1)) * strength;
      let nx = -dx, ny = -dy, nz = 1;
      const len = Math.hypot(nx, ny, nz);
      nx /= len; ny /= len; nz /= len;
      const i = (y * size + x) * 4;
      img.data[i] = (nx * 0.5 + 0.5) * 255;
      img.data[i + 1] = (ny * 0.5 + 0.5) * 255;
      img.data[i + 2] = (nz * 0.5 + 0.5) * 255;
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

/** Pinta un canvas evaluando `fn(x, y) -> [r,g,b] 0..1` por píxel. */
function paint(size, fn) {
  const canvas = canvasOf(size);
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const c = fn(x, y);
      const i = (y * size + x) * 4;
      img.data[i] = clamp(c[0], 0, 1) * 255;
      img.data[i + 1] = clamp(c[1], 0, 1) * 255;
      img.data[i + 2] = clamp(c[2], 0, 1) * 255;
      img.data[i + 3] = (c[3] === undefined ? 1 : clamp(c[3], 0, 1)) * 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

function textureFrom(canvas, { srgb = false, repeat = 1, aniso = 4 } = {}) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat, repeat);
  tex.anisotropy = aniso;
  if (srgb) tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

/** Definición de cada superficie: color base, veta y respuesta a la luz. */
const SURFACES = {
  // Base neutra: el terreno la tiñe por vértice (arena, hierba, limo, roca)
  // para pasar de un material a otro sin costuras ni draw calls extra.
  suelo: {
    size: 256,
    base: [0.62, 0.6, 0.57],
    accent: [0.34, 0.33, 0.31],
    grain: (noise, x, y) =>
      fbm(noise, x * 0.07, y * 0.07, 5, 0.55) * 0.75 + fbm(noise, x * 0.3, y * 0.3, 2, 0.5) * 0.25,
    roughness: [0.78, 0.97],
    normalStrength: 1.9
  },
  tierra: {
    size: 256,
    base: [0.28, 0.21, 0.14],
    accent: [0.16, 0.12, 0.08],
    grain: (noise, x, y) => fbm(noise, x * 0.05, y * 0.05, 5, 0.55),
    roughness: [0.82, 0.98],
    normalStrength: 2.4
  },
  arena: {
    size: 256,
    base: [0.62, 0.55, 0.42],
    accent: [0.48, 0.42, 0.32],
    grain: (noise, x, y) => fbm(noise, x * 0.14, y * 0.14, 4, 0.5),
    roughness: [0.7, 0.92],
    normalStrength: 1.1
  },
  hierba: {
    size: 256,
    base: [0.19, 0.31, 0.13],
    accent: [0.11, 0.2, 0.08],
    grain: (noise, x, y) => fbm(noise, x * 0.09, y * 0.09, 5, 0.6),
    roughness: [0.78, 0.96],
    normalStrength: 1.8
  },
  roca: {
    size: 256,
    base: [0.42, 0.41, 0.39],
    accent: [0.2, 0.2, 0.21],
    grain: (noise, x, y) => {
      const base = fbm(noise, x * 0.035, y * 0.035, 5, 0.55);
      const cracks = Math.pow(1 - Math.abs(fbm(noise, x * 0.02, y * 0.02, 3, 0.5) - 0.5) * 2, 8);
      return clamp(base - cracks * 0.45, 0, 1);
    },
    roughness: [0.55, 0.88],
    normalStrength: 3.2
  },
  corteza: {
    size: 256,
    base: [0.3, 0.22, 0.16],
    accent: [0.13, 0.09, 0.06],
    grain: (noise, x, y) => {
      // Vetas verticales: mucha frecuencia en X, poca en Y.
      const v = fbm(noise, x * 0.28, y * 0.02, 4, 0.6);
      return clamp(v * 0.7 + fbm(noise, x * 0.06, y * 0.06, 3, 0.5) * 0.3, 0, 1);
    },
    roughness: [0.75, 0.98],
    normalStrength: 3
  },
  madera: {
    size: 256,
    base: [0.44, 0.32, 0.2],
    accent: [0.24, 0.16, 0.09],
    grain: (noise, x, y) => {
      const rings = Math.sin((y * 0.35 + fbm(noise, x * 0.02, y * 0.04, 3, 0.5) * 9)) * 0.5 + 0.5;
      const plank = (x % 64) < 2 ? 0.15 : 1;          // junta entre tablones
      return clamp(rings * 0.55 + 0.35, 0, 1) * plank;
    },
    roughness: [0.6, 0.9],
    normalStrength: 2
  }
};

class TextureLibrary {
  constructor() {
    this.cache = new Map();
    this.noise = makeValueNoise2D(1337);
  }

  /** Devuelve (y cachea) un MeshStandardMaterial completo para una superficie. */
  material(name, { repeat = 8, color = 0xffffff, ...extra } = {}) {
    const key = `${name}:${repeat}:${color}`;
    if (this.cache.has(key)) return this.cache.get(key);

    const def = SURFACES[name];
    if (!def) throw new Error(`Superficie desconocida: ${name}`);
    const { size } = def;

    const height = new Float32Array(size * size);
    const albedo = paint(size, (x, y) => {
      const g = def.grain(this.noise, x, y);
      height[y * size + x] = g;
      return [
        lerp(def.accent[0], def.base[0], g),
        lerp(def.accent[1], def.base[1], g),
        lerp(def.accent[2], def.base[2], g)
      ];
    });
    const rough = paint(size, (x, y) => {
      const g = height[y * size + x];
      const r = lerp(def.roughness[0], def.roughness[1], 1 - g);
      return [r, r, r];
    });

    const material = new THREE.MeshStandardMaterial({
      map: textureFrom(albedo, { srgb: true, repeat }),
      normalMap: textureFrom(heightToNormal(height, size, def.normalStrength), { repeat }),
      roughnessMap: textureFrom(rough, { repeat }),
      roughness: 1,
      metalness: 0,
      color,
      ...extra
    });
    material.normalScale.set(1, 1);
    this.cache.set(key, material);
    return material;
  }

  /** Normales de oleaje que teselan, para el shader de agua. */
  waterNormals(size = 512) {
    if (this.cache.has('waterNormals')) return this.cache.get('waterNormals');
    const height = new Float32Array(size * size);
    // Dos trenes de olas cruzados más ruido: evita el patrón repetido evidente.
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const u = (x / size) * Math.PI * 2;
        const v = (y / size) * Math.PI * 2;
        height[y * size + x] =
          Math.sin(u * 3 + Math.cos(v * 2) * 0.6) * 0.35 +
          Math.sin(v * 5 - u * 1.5) * 0.25 +
          fbm(this.noise, x * 0.05, y * 0.05, 4, 0.55) * 0.4;
      }
    }
    const tex = textureFrom(heightToNormal(height, size, 1.6), { repeat: 1, aniso: 8 });
    this.cache.set('waterNormals', tex);
    return tex;
  }

  /** Sprite de mata de hierba con alfa, para la vegetación instanciada. */
  grassBlade(size = 128) {
    if (this.cache.has('grassBlade')) return this.cache.get('grassBlade');
    const canvas = canvasOf(size);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, size, size);
    const rng = createRandom(7);
    for (let i = 0; i < 14; i++) {
      const x = size * (0.1 + rng() * 0.8);
      const h = size * (0.45 + rng() * 0.5);
      const lean = (rng() - 0.5) * size * 0.28;
      const w = size * (0.018 + rng() * 0.022);
      const g = 0.35 + rng() * 0.4;
      const grad = ctx.createLinearGradient(x, size, x + lean, size - h);
      grad.addColorStop(0, `rgba(${Math.round(38 * g)},${Math.round(62 * g)},${Math.round(24 * g)},1)`);
      grad.addColorStop(1, `rgba(${Math.round(96 * g)},${Math.round(132 * g)},${Math.round(48 * g)},0.92)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(x - w, size);
      ctx.quadraticCurveTo(x + lean * 0.4, size - h * 0.55, x + lean, size - h);
      ctx.quadraticCurveTo(x + lean * 0.5 + w, size - h * 0.5, x + w, size);
      ctx.closePath();
      ctx.fill();
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    this.cache.set('grassBlade', tex);
    return tex;
  }

  /** Mancha de follaje con alfa suave, para las copas de los árboles. */
  foliage(size = 128) {
    if (this.cache.has('foliage')) return this.cache.get('foliage');
    const rng = createRandom(23);
    const canvas = canvasOf(size);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, size, size);
    for (let i = 0; i < 90; i++) {
      const a = rng() * Math.PI * 2;
      const r = Math.pow(rng(), 0.6) * size * 0.44;
      const x = size / 2 + Math.cos(a) * r;
      const y = size / 2 + Math.sin(a) * r;
      const rad = size * (0.04 + rng() * 0.07);
      const shade = 0.45 + rng() * 0.55;
      ctx.fillStyle = `rgba(${Math.round(48 * shade)},${Math.round(84 * shade)},${Math.round(34 * shade)},0.95)`;
      ctx.beginPath();
      ctx.ellipse(x, y, rad, rad * 0.72, a, 0, Math.PI * 2);
      ctx.fill();
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    this.cache.set('foliage', tex);
    return tex;
  }

  /** Textura de nubes con alfa para la cúpula celeste. */
  clouds(size = 512) {
    if (this.cache.has('clouds')) return this.cache.get('clouds');
    const noise = makeValueNoise2D(99);
    const canvas = paint(size, (x, y) => {
      // Coordenadas envolventes para que no se vea la costura.
      const u = x / size, v = y / size;
      const n = fbm(noise, u * 6, v * 6, 5, 0.55);
      const mask = clamp((n - 0.42) * 3.4, 0, 1);
      const density = Math.pow(mask, 1.3);
      return [1, 1, 1, density * 0.85];
    });
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    this.cache.set('clouds', tex);
    return tex;
  }

  /** Gota de lluvia alargada para el sistema de partículas. */
  raindrop(size = 32) {
    if (this.cache.has('raindrop')) return this.cache.get('raindrop');
    const canvas = canvasOf(size);
    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, size);
    grad.addColorStop(0, 'rgba(200,225,245,0)');
    grad.addColorStop(0.5, 'rgba(210,232,250,0.75)');
    grad.addColorStop(1, 'rgba(200,225,245,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(size * 0.42, 0, size * 0.16, size);
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    this.cache.set('raindrop', tex);
    return tex;
  }

  dispose() {
    this.cache.forEach((v) => v.dispose?.());
    this.cache.clear();
  }
}

/* ===== src/world/TerrainShape.js ===== */
/**
 * Campo de alturas del mapa. Módulo puro (sin three) para poder probarlo
 * y para que otros sistemas —IA de peces, colocación de vegetación, colisión
 * del jugador— consulten el relieve sin tocar la escena.
 *
 * Convenio: el nivel del agua es y = 0. Todo lo negativo está sumergido.
 */

const WATER_LEVEL = 0;

function createHeightField({
  size = 520,            // lado del mapa en metros
  resolution = 320,      // vértices por lado
  seed = 20260908,
  lakeRadius = 118,      // radio medio del lago
  maxDepth = 9.5,        // profundidad máxima en el centro
  hillHeight = 26
} = {}) {
  const noise = makeValueNoise2D(seed);
  const heights = new Float32Array(resolution * resolution);
  const step = size / (resolution - 1);
  const half = size / 2;

  /** Radio del lago para un ángulo dado: contorno irregular, no un círculo. */
  function shoreRadius(angle) {
    const wobble = fbm(noise, Math.cos(angle) * 2.4 + 40, Math.sin(angle) * 2.4 + 40, 3, 0.55);
    const lobe = Math.sin(angle * 2.0 + 0.7) * 0.09 + Math.sin(angle * 3.0 - 1.4) * 0.06;
    return lakeRadius * (0.78 + 0.42 * wobble + lobe);
  }

  function sample(x, z) {
    const dist = Math.hypot(x, z);
    const angle = Math.atan2(z, x);
    const shore = shoreRadius(angle);
    const t = dist / shore;
    const detail = (fbm(noise, x * 0.055, z * 0.055, 3, 0.5) - 0.5) * 0.9;

    if (t < 1) {
      // Cuenca: repisa poco profunda junto a la orilla y hoya en el centro.
      const bowl = Math.pow(1 - t * t, 1.45);
      const shelf = smoothstep(1, 0.86, t) * 0.75;   // bajío pegado a la orilla
      const bed = (fbm(noise, x * 0.021, z * 0.021, 4, 0.5) - 0.5) * 2.1 * (1 - t * 0.7);
      return -maxDepth * bowl + shelf + bed + detail * 0.35;
    }

    const rise = t - 1;
    const beach = smoothstep(0, 0.05, rise) * 0.9;
    const bank = smoothstep(0.03, 0.42, rise) * 5.5;
    const hills = fbm(noise, x * 0.0075 + 5, z * 0.0075 + 5, 5, 0.52) * hillHeight
      * smoothstep(0.12, 1.1, rise);
    return beach + bank + hills + detail;
  }

  for (let j = 0; j < resolution; j++) {
    for (let i = 0; i < resolution; i++) {
      heights[j * resolution + i] = sample(-half + i * step, -half + j * step);
    }
  }

  /** Altura interpolada bilinealmente en coordenadas de mundo. */
  function heightAt(x, z) {
    const fx = clamp((x + half) / step, 0, resolution - 1.001);
    const fz = clamp((z + half) / step, 0, resolution - 1.001);
    const i = Math.floor(fx), j = Math.floor(fz);
    const tx = fx - i, tz = fz - j;
    const h00 = heights[j * resolution + i];
    const h10 = heights[j * resolution + i + 1];
    const h01 = heights[(j + 1) * resolution + i];
    const h11 = heights[(j + 1) * resolution + i + 1];
    return lerp(lerp(h00, h10, tx), lerp(h01, h11, tx), tz);
  }

  /** Pendiente 0..1 (0 llano, 1 pared). Se usa para texturizar y para andar. */
  function slopeAt(x, z) {
    const d = step;
    const dx = heightAt(x + d, z) - heightAt(x - d, z);
    const dz = heightAt(x, z + d) - heightAt(x, z - d);
    return clamp(Math.hypot(dx, dz) / (2 * d) / 2.2, 0, 1);
  }

  const depthAt = (x, z) => Math.max(0, WATER_LEVEL - heightAt(x, z));
  const isSubmerged = (x, z) => heightAt(x, z) < WATER_LEVEL;

  return {
    heights, resolution, size, step, half,
    lakeRadius, maxDepth, waterLevel: WATER_LEVEL,
    heightAt, slopeAt, depthAt, isSubmerged, shoreRadius
  };
}

/* ===== src/world/Terrain.js ===== */
/**
 * Malla del terreno.
 *
 * Una sola geometría con colores por vértice: el material base es neutro y el
 * color decide si un punto se lee como limo, arena, hierba o roca. Así hay
 * transiciones suaves entre biomas con una única draw call, en vez de varias
 * capas de textura mezcladas en un shader.
 */

const COLORS = {
  limo:   new THREE.Color(0x403a26),
  fondo:  new THREE.Color(0x6b6141),
  arena:  new THREE.Color(0xbda97e),
  hierba: new THREE.Color(0x53703a),
  seca:   new THREE.Color(0x7b8248),
  roca:   new THREE.Color(0x8b8880)
};

class Terrain {
  constructor(textures, options = {}) {
    this.field = createHeightField(options);
    this.waterLevel = WATER_LEVEL;

    const { resolution, size } = this.field;
    const geometry = new THREE.PlaneGeometry(size, size, resolution - 1, resolution - 1);
    geometry.rotateX(-Math.PI / 2);

    const position = geometry.attributes.position;
    const colors = new Float32Array(position.count * 3);
    const tint = makeValueNoise2D(4242);
    const color = new THREE.Color();

    for (let i = 0; i < position.count; i++) {
      const x = position.getX(i);
      const z = position.getZ(i);
      const h = this.field.heightAt(x, z);
      position.setY(i, h);

      const slope = this.field.slopeAt(x, z);
      const variation = fbm(tint, x * 0.03, z * 0.03, 3, 0.5);

      if (h < -0.35) {
        // Fondo del lago: arena en el bajío, limo oscuro en lo hondo.
        color.copy(COLORS.fondo).lerp(COLORS.limo, smoothstep(-1.2, -5.5, h));
      } else if (h < 0.85) {
        color.copy(COLORS.arena).lerp(COLORS.fondo, smoothstep(0.85, -0.35, h) * 0.55);
      } else {
        const dry = smoothstep(6, 20, h) * 0.6 + variation * 0.25;
        color.copy(COLORS.hierba).lerp(COLORS.seca, clamp(dry, 0, 1));
      }
      // La roca asoma donde la pendiente no deja agarrar tierra.
      color.lerp(COLORS.roca, smoothstep(0.35, 0.75, slope));
      color.offsetHSL(0, 0, (variation - 0.5) * 0.06);

      colors[i * 3] = color.r;
      colors[i * 3 + 1] = color.g;
      colors[i * 3 + 2] = color.b;
    }

    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.computeVertexNormals();

    const material = textures.material('suelo', { repeat: 90 });
    material.vertexColors = true;

    this.mesh = new THREE.Mesh(geometry, material);
    this.mesh.receiveShadow = true;
    this.mesh.castShadow = false;
    this.mesh.name = 'terreno';
    this.mesh.matrixAutoUpdate = false;
    this.mesh.updateMatrix();
  }

  heightAt(x, z) { return this.field.heightAt(x, z); }
  slopeAt(x, z) { return this.field.slopeAt(x, z); }
  depthAt(x, z) { return this.field.depthAt(x, z); }
  isSubmerged(x, z) { return this.field.isSubmerged(x, z); }

  /** Normal del terreno, para orientar objetos apoyados en el suelo. */
  normalAt(x, z, out = new THREE.Vector3()) {
    const d = 0.75;
    const hx = this.heightAt(x + d, z) - this.heightAt(x - d, z);
    const hz = this.heightAt(x, z + d) - this.heightAt(x, z - d);
    return out.set(-hx, 2 * d, -hz).normalize();
  }

  dispose() {
    this.mesh.geometry.dispose();
  }
}

/* ===== src/world/WaterBody.js ===== */
/**
 * Superficie del lago.
 *
 * Usa el shader `Water` de three, que resuelve el reflejo con una cámara
 * espejo y un render target: el cielo, los árboles y el muelle se reflejan de
 * verdad. La refracción completa exigiría una segunda pasada; en su lugar la
 * superficie es translúcida y el color del agua se oscurece con la
 * profundidad, que da la lectura correcta a un coste mucho menor.
 *
 * Además gestiona las ondas circulares que deja el señuelo al caer.
 */

const RIPPLE_LIFETIME = 2.6;

class WaterBody {
  constructor(textures, { size = 620, reflectionSize = 512, sunDirection, level = 0 } = {}) {
    this.level = level;
    this.ripples = [];

    const geometry = new THREE.PlaneGeometry(size, size, 1, 1);
    this.water = new Water(geometry, {
      textureWidth: reflectionSize,
      textureHeight: reflectionSize,
      waterNormals: textures.waterNormals(),
      sunDirection: sunDirection ? sunDirection.clone() : new THREE.Vector3(0.7, 0.7, 0),
      sunColor: 0xffffff,
      waterColor: 0x0d2630,
      distortionScale: 3.4,
      alpha: 0.9,
      fog: true
    });
    this.water.rotation.x = -Math.PI / 2;
    this.water.position.y = level;
    this.water.material.transparent = true;
    // `size` escala las coordenadas de mundo dentro del mapa de normales: con
    // el valor por defecto (1) las olas son kilométricas y el lago se ve liso.
    this.water.material.uniforms.size.value = 28;
    this.water.name = 'agua';

    // Grupo de ondas: anillos que crecen y se desvanecen.
    this.rippleGroup = new THREE.Group();
    this.rippleGroup.position.y = level + 0.02;
    this._rippleGeometry = new THREE.RingGeometry(0.06, 0.1, 24);
    this._rippleGeometry.rotateX(-Math.PI / 2);
  }

  addTo(scene) {
    scene.add(this.water);
    scene.add(this.rippleGroup);
  }

  /** Onda expansiva en la superficie: caída del señuelo, pez que colea... */
  splash(position, strength = 1) {
    const material = new THREE.MeshBasicMaterial({
      color: 0xdff0f5, transparent: true, opacity: 0.5, side: THREE.DoubleSide, depthWrite: false
    });
    const ring = new THREE.Mesh(this._rippleGeometry, material);
    ring.position.set(position.x, 0, position.z);
    ring.userData = { age: 0, strength: clamp(strength, 0.2, 3) };
    this.rippleGroup.add(ring);
    this.ripples.push(ring);
    if (this.ripples.length > 40) this._retire(this.ripples[0]);
  }

  _retire(ring) {
    const i = this.ripples.indexOf(ring);
    if (i >= 0) this.ripples.splice(i, 1);
    this.rippleGroup.remove(ring);
    ring.material.dispose();
  }

  update(dt, { sunDirection, sunColor, waterColor, choppiness = 1 } = {}) {
    const u = this.water.material.uniforms;
    u.time.value += dt * 0.55 * choppiness;
    u.distortionScale.value = 2.2 + choppiness * 2.6;
    u.size.value = 24 + choppiness * 8;
    if (sunDirection) u.sunDirection.value.copy(sunDirection).normalize();
    if (sunColor) u.sunColor.value.copy(sunColor);
    if (waterColor) u.waterColor.value.copy(waterColor);

    for (let i = this.ripples.length - 1; i >= 0; i--) {
      const ring = this.ripples[i];
      const data = ring.userData;
      data.age += dt;
      const t = data.age / RIPPLE_LIFETIME;
      if (t >= 1) { this._retire(ring); continue; }
      const scale = 1 + t * 34 * data.strength;
      ring.scale.setScalar(scale);
      ring.material.opacity = 0.5 * (1 - t) * (1 - t);
    }
  }

  /** Altura de la lámina de agua incluyendo el oleaje aproximado. */
  surfaceHeight(x, z, time) {
    return this.level +
      Math.sin(x * 0.28 + time * 1.1) * 0.035 +
      Math.sin(z * 0.21 - time * 0.9) * 0.03;
  }

  dispose() {
    this.water.geometry.dispose();
    this.water.material.dispose();
    this._rippleGeometry.dispose();
  }
}

/* ===== src/world/SkyDome.js ===== */
/**
 * Cielo e iluminación global.
 *
 * Reúne el cielo atmosférico de Preetham, el sol y la luna como luces
 * direccionales, un campo de estrellas y dos capas de nubes. La sombra sigue
 * al jugador: el volumen del mapa entero no cabría en un shadow map decente.
 */

const SKY_SCALE = 3000;

class SkyDome {
  constructor(scene, textures, preset) {
    this.scene = scene;

    this.sky = new Sky();
    this.sky.scale.setScalar(SKY_SCALE);
    this.sky.material.uniforms.turbidity.value = 2.2;
    this.sky.material.uniforms.rayleigh.value = 3.1;
    this.sky.material.uniforms.mieCoefficient.value = 0.0028;
    this.sky.material.uniforms.mieDirectionalG.value = 0.82;
    scene.add(this.sky);

    this.sun = new THREE.DirectionalLight(0xffffff, 2);
    this.sun.castShadow = preset.shadows;
    if (preset.shadows) {
      const s = this.sun.shadow;
      s.mapSize.set(preset.shadowMapSize, preset.shadowMapSize);
      s.camera.near = 1;
      s.camera.far = 460;
      s.camera.left = s.camera.bottom = -150;
      s.camera.right = s.camera.top = 150;
      s.bias = -0.0012;
      s.normalBias = 0.035;
    }
    scene.add(this.sun);
    scene.add(this.sun.target);

    this.moon = new THREE.DirectionalLight(0x9fb6de, 0);
    scene.add(this.moon);

    this.hemi = new THREE.HemisphereLight(0x9dc0e8, 0x40402c, 0.5);
    scene.add(this.hemi);

    this.ambient = new THREE.AmbientLight(0x404050, 0.35);
    scene.add(this.ambient);

    this._buildStars();
    this._buildClouds(textures);
  }

  _buildStars(count = 1400) {
    const rng = createRandom(88);
    const positions = new Float32Array(count * 3);
    const sizes = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      // Distribución uniforme en la media esfera superior.
      const u = rng() * 2 - 1;
      const theta = rng() * Math.PI * 2;
      const r = Math.sqrt(1 - u * u);
      const y = Math.abs(u);
      positions.set([r * Math.cos(theta) * 2400, y * 2400 + 60, r * Math.sin(theta) * 2400], i * 3);
      sizes[i] = 1 + Math.pow(rng(), 6) * 5;
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
    this.stars = new THREE.Points(geometry, new THREE.PointsMaterial({
      color: 0xdfe8ff, size: 3.2, sizeAttenuation: false,
      transparent: true, opacity: 0, depthWrite: false
    }));
    this.stars.frustumCulled = false;
    this.scene.add(this.stars);
  }

  _buildClouds(textures) {
    const texture = textures.clouds();
    this.cloudLayers = [];
    for (let i = 0; i < 2; i++) {
      const map = texture.clone();
      map.needsUpdate = true;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(16 + i * 6, 16 + i * 6);
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(5200, 5200),
        new THREE.MeshBasicMaterial({
          map, transparent: true, opacity: 0, depthWrite: false,
          side: THREE.DoubleSide, fog: false
        })
      );
      mesh.rotation.x = Math.PI / 2;
      mesh.position.y = 620 + i * 190;
      mesh.renderOrder = -1;
      this.cloudLayers.push(mesh);
      this.scene.add(mesh);
    }
  }

  /** `focus` es la posición del jugador: la sombra se encaja a su alrededor. */
  update(time, weather, dt, focus = null) {
    const sunDir = time.sunDirection;
    this.sky.material.uniforms.sunPosition.value.copy(sunDir).multiplyScalar(SKY_SCALE * 0.5);
    this.sky.material.uniforms.turbidity.value = lerp(2.2, 9, weather.cloudiness);
    this.sky.material.uniforms.rayleigh.value = lerp(3.1, 0.8, weather.cloudiness);

    const daylight = clamp(Math.sin(time.elevation) * 2.2, 0, 1);
    const overcast = 1 - weather.cloudiness * 0.62;

    if (focus) {
      this.sun.position.copy(focus).addScaledVector(sunDir, 210);
      this.sun.target.position.copy(focus);
      this.sun.target.updateMatrixWorld();
      this.sky.position.set(focus.x, 0, focus.z);
      this.stars.position.set(focus.x, 0, focus.z);
      this.cloudLayers.forEach((l) => l.position.set(focus.x, l.position.y, focus.z));
    } else {
      this.sun.position.copy(sunDir).multiplyScalar(140);
    }
    this.sun.color.copy(time.sunColor);
    this.sun.intensity = time.sunIntensity * overcast;
    this.sun.visible = this.sun.intensity > 0.01;

    this.moon.position.copy(focus || new THREE.Vector3()).addScaledVector(time.moonDirection, 140);
    this.moon.intensity = time.nightFactor * 0.5 * overcast;
    this.moon.visible = this.moon.intensity > 0.01;

    this.hemi.color.copy(time.skyColor);
    this.hemi.intensity = lerp(0.5, 3.2, daylight) * overcast;
    this.ambient.color.copy(time.ambientColor);
    this.ambient.intensity = lerp(1.2, 1.15, daylight);

    this.stars.material.opacity = time.nightFactor * (1 - weather.cloudiness * 0.85);
    this.stars.visible = this.stars.material.opacity > 0.02;
    this.stars.rotation.y += dt * 0.0035;

    this.cloudLayers.forEach((layer, i) => {
      layer.material.opacity = clamp(weather.cloudiness * 0.85, 0, 0.9) * (i === 0 ? 1 : 0.6);
      layer.visible = layer.material.opacity > 0.02;
      layer.material.color.copy(time.skyColor).lerp(new THREE.Color(0xffffff), 0.55 - weather.cloudiness * 0.4);
      layer.material.map.offset.x += dt * weather.windSpeed * 0.0016 * (i + 1);
      layer.material.map.offset.y += dt * weather.windSpeed * 0.0007 * (i + 1);
    });
  }

  dispose() {
    this.stars.geometry.dispose();
    this.stars.material.dispose();
    this.cloudLayers.forEach((c) => { c.geometry.dispose(); c.material.dispose(); });
  }
}

/* ===== src/world/Vegetation.js ===== */
/**
 * Vegetación instanciada.
 *
 * Todo lo que se repite (hierba, juncos, arbustos, árboles, rocas) va en
 * InstancedMesh, así que miles de elementos cuestan un puñado de draw calls.
 * La hierba y los juncos se mueven con el viento en el vertex shader, sin
 * coste de CPU.
 *
 * El culling es por celdas: las instancias se agrupan en tiles y cada tile se
 * apaga entero cuando queda lejos, que es mucho más barato que ocultar
 * instancias sueltas.
 */

const TILE_SIZE = 64;

/** Inyecta ondulación de viento en un material estándar. */
function addWind(material, uniforms, { bendScale = 1 } = {}) {
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = uniforms.uTime;
    shader.uniforms.uWind = uniforms.uWind;
    shader.uniforms.uBend = { value: bendScale };
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `
        #include <common>
        uniform float uTime;
        uniform vec3 uWind;
        uniform float uBend;
      `)
      .replace('#include <begin_vertex>', `
        #include <begin_vertex>
        // Sólo se dobla la parte alta: la base queda clavada en el suelo.
        float bendFactor = clamp(position.y, 0.0, 4.0) * uBend;
        vec3 worldOrigin = (modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
        float phase = worldOrigin.x * 0.35 + worldOrigin.z * 0.28;
        float gust = sin(uTime * 1.7 + phase) * 0.6 + sin(uTime * 3.1 + phase * 1.7) * 0.4;
        transformed.xz += uWind.xz * gust * bendFactor * 0.14;
      `);
  };
  material.customProgramCacheKey = () => 'wind' + bendScale;
}

/** Roca irregular: icosaedro con los vértices desplazados por ruido. */
function rockGeometry(rng, detail = 1) {
  const geo = new THREE.IcosahedronGeometry(1, detail);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = 0.72 + rng() * 0.5;
    v.multiplyScalar(n);
    v.y *= 0.72;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

class Vegetation {
  constructor(scene, terrain, textures, preset, { seed = 4321 } = {}) {
    this.scene = scene;
    this.terrain = terrain;
    this.group = new THREE.Group();
    this.group.name = 'vegetación';
    scene.add(this.group);

    this.uniforms = {
      uTime: { value: 0 },
      uWind: { value: new THREE.Vector3(1, 0, 0.3) }
    };
    this.tiles = new Map();
    this.viewDistance = preset.viewDistance;
    this.rng = createRandom(seed);

    this._buildGrass(textures, preset);
    this._buildReeds(preset);
    this._buildBushes(preset);
    this._buildTrees(textures, preset);
    this._buildRocks(textures, preset);
  }

  /** Reparte `count` intentos de colocación y acepta los que cumplan `accept`. */
  _scatter(count, accept) {
    const spots = [];
    const half = this.terrain.field.half - 8;
    for (let i = 0; i < count; i++) {
      const x = (this.rng() * 2 - 1) * half;
      const z = (this.rng() * 2 - 1) * half;
      const h = this.terrain.heightAt(x, z);
      const slope = this.terrain.slopeAt(x, z);
      if (accept(x, z, h, slope)) spots.push({ x, y: h, z });
    }
    return spots;
  }

  _addInstanced(name, geometry, material, spots, transform) {
    if (!spots.length) return null;
    const mesh = new THREE.InstancedMesh(geometry, material, spots.length);
    mesh.name = name;
    const dummy = new THREE.Object3D();
    spots.forEach((spot, i) => {
      transform(dummy, spot, i, this.rng);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    });
    mesh.instanceMatrix.needsUpdate = true;
    mesh.frustumCulled = true;
    this.group.add(mesh);
    return mesh;
  }

  _buildGrass(textures, preset) {
    const density = preset.grassDensity;
    if (density <= 0) return;
    const spots = this._scatter(Math.floor(26000 * density), (x, z, h, slope) =>
      h > 0.15 && h < 16 && slope < 0.42);

    const material = new THREE.MeshStandardMaterial({
      map: textures.grassBlade(),
      alphaTest: 0.36,
      side: THREE.DoubleSide,
      roughness: 0.92,
      metalness: 0
    });
    addWind(material, this.uniforms, { bendScale: 1 });

    const geometry = crossPlanes(0.7, 0.75);
    this.grass = this._addInstanced('hierba', geometry, material, spots, (d, s, i, rng) => {
      d.position.set(s.x, s.y - 0.05, s.z);
      d.rotation.set(0, rng() * Math.PI, 0);
      const k = 0.7 + rng() * 0.8;
      d.scale.set(k, k * (0.8 + rng() * 0.7), k);
    });
    this._tileify(this.grass, spots, 78);
  }

  _buildReeds(preset) {
    // Juncos: sólo en el bajío, entre 5 cm y 1 m de profundidad.
    const spots = this._scatter(Math.floor(7000 * Math.max(0.35, preset.grassDensity)),
      (x, z, h) => h < -0.05 && h > -1.05);

    const material = new THREE.MeshStandardMaterial({
      color: 0x6c7a3a, roughness: 0.9, side: THREE.DoubleSide
    });
    addWind(material, this.uniforms, { bendScale: 0.55 });

    const geometry = crossPlanes(0.12, 1.9);
    this.reeds = this._addInstanced('juncos', geometry, material, spots, (d, s, i, rng) => {
      d.position.set(s.x, s.y, s.z);
      d.rotation.set(0, rng() * Math.PI, 0);
      const k = 0.75 + rng() * 0.9;
      d.scale.set(1, k, 1);
    });
    this._tileify(this.reeds, spots, 110);
  }

  _buildBushes(preset) {
    const spots = this._scatter(Math.floor(900 * Math.max(0.4, preset.grassDensity)),
      (x, z, h, slope) => h > 0.9 && h < 20 && slope < 0.5);
    const geometry = new THREE.IcosahedronGeometry(1, 1);
    const material = new THREE.MeshStandardMaterial({ color: 0x40592c, roughness: 0.95, flatShading: true });
    addWind(material, this.uniforms, { bendScale: 0.18 });
    this.bushes = this._addInstanced('arbustos', geometry, material, spots, (d, s, i, rng) => {
      d.position.set(s.x, s.y + 0.35, s.z);
      d.rotation.set(rng() * 0.4, rng() * Math.PI, rng() * 0.4);
      d.scale.set(0.7 + rng() * 0.9, 0.55 + rng() * 0.6, 0.7 + rng() * 0.9);
    });
    this._tileify(this.bushes, spots, 150);
  }

  _buildTrees(textures, preset) {
    const spots = this._scatter(1500, (x, z, h, slope) =>
      h > 2.2 && h < 24 && slope < 0.4).slice(0, 420);

    const trunkGeo = new THREE.CylinderGeometry(0.16, 0.28, 5.2, 6, 1);
    trunkGeo.translate(0, 2.6, 0);
    const trunkMat = textures.material('corteza', { repeat: 2 });

    this.trunks = this._addInstanced('troncos', trunkGeo, trunkMat, spots, (d, s, i, rng) => {
      d.position.set(s.x, s.y, s.z);
      d.rotation.set((rng() - 0.5) * 0.12, rng() * Math.PI, (rng() - 0.5) * 0.12);
      const k = 0.75 + rng() * 0.85;
      d.scale.set(k, k, k);
    });
    this.trunks.castShadow = preset.shadows;
    this.trunks.receiveShadow = preset.shadows;

    // Copa: dos planos cruzados con la mancha de follaje, mucho más barato
    // que una esfera de hojas y se lee bien a distancia.
    const canopyGeo = crossPlanes(5.4, 5.4);
    canopyGeo.translate(0, 1.4, 0);
    const canopyMat = new THREE.MeshStandardMaterial({
      map: textures.foliage(), alphaTest: 0.4, side: THREE.DoubleSide, roughness: 0.9
    });
    addWind(canopyMat, this.uniforms, { bendScale: 0.1 });

    this.canopies = this._addInstanced('copas', canopyGeo, canopyMat, spots, (d, s, i, rng) => {
      d.position.set(s.x, s.y + 3.1, s.z);
      d.rotation.set(0, rng() * Math.PI, 0);
      const k = 0.8 + rng() * 0.8;
      d.scale.set(k, k, k);
    });
    this.canopies.castShadow = preset.shadows;
    this._tileify(this.canopies, spots, this.viewDistance);
    this._tileify(this.trunks, spots, this.viewDistance);
  }

  _buildRocks(textures, preset) {
    const spots = this._scatter(1200, (x, z, h, slope) =>
      (h > -1.6 && h < 22) && (slope > 0.18 || this.rng() < 0.35)).slice(0, 320);
    const geometry = rockGeometry(this.rng, 1);
    const material = textures.material('roca', { repeat: 1.4 });
    this.rocks = this._addInstanced('rocas', geometry, material, spots, (d, s, i, rng) => {
      d.position.set(s.x, s.y - 0.15, s.z);
      d.rotation.set(rng() * Math.PI, rng() * Math.PI, rng() * Math.PI);
      const k = 0.35 + Math.pow(rng(), 2.2) * 2.4;
      d.scale.set(k, k * (0.6 + rng() * 0.5), k);
    });
    this.rocks.castShadow = preset.shadows;
    this.rocks.receiveShadow = preset.shadows;
    this._tileify(this.rocks, spots, this.viewDistance);
  }

  /** Registra la celda y la distancia a la que deja de dibujarse. */
  _tileify(mesh, spots, distance) {
    if (!mesh) return;
    let cx = 0, cz = 0;
    spots.forEach((s) => { cx += s.x; cz += s.z; });
    mesh.userData.center = new THREE.Vector3(cx / spots.length, 0, cz / spots.length);
    mesh.userData.cullDistance = distance;
    this.tiles.set(mesh.name, mesh);
  }

  update(dt, wind, playerPosition) {
    this.uniforms.uTime.value += dt;
    this.uniforms.uWind.value.set(wind.x, 0, wind.z);

    // Las instancias cubren todo el mapa, así que el corte por distancia se
    // hace contra el radio real de cada grupo, no contra su centro.
    this.tiles.forEach((mesh) => {
      const d = mesh.userData.center.distanceTo(playerPosition);
      mesh.visible = d < mesh.userData.cullDistance + 320;
    });
  }

  dispose() {
    this.group.traverse((o) => {
      if (o.isInstancedMesh) { o.geometry.dispose(); o.material.dispose(); }
    });
    this.scene.remove(this.group);
  }
}

/* ===== src/world/Props.js ===== */
/**
 * Elementos construidos del escenario: muelle, barca, banco, fogata, cartel.
 *
 * Se colocan buscando la orilla real sobre el campo de alturas, no con
 * coordenadas fijas, para que sigan encajando si se cambia la semilla o la
 * forma del lago.
 */

class Props {
  constructor(scene, terrain, textures, preset) {
    this.scene = scene;
    this.terrain = terrain;
    this.group = new THREE.Group();
    this.group.name = 'construcciones';
    scene.add(this.group);
    this.rng = createRandom(909);
    this.fishingSpots = [];

    const wood = textures.material('madera', { repeat: 2 });
    const plank = textures.material('madera', { repeat: 1 });

    this.dock = this._buildDock(Math.PI * 0.18, wood, plank, preset);
    this._buildBoat(Math.PI * 0.62, wood, preset);
    this._buildCamp(Math.PI * -0.35, wood, textures, preset);
  }

  /** Punto de la orilla en un ángulo dado (altura ≈ `targetHeight`). */
  shorePoint(angle, targetHeight = 0.35) {
    const dir = new THREE.Vector2(Math.cos(angle), Math.sin(angle));
    let lo = 0, hi = this.terrain.field.half - 10;
    for (let i = 0; i < 40; i++) {
      const mid = (lo + hi) / 2;
      const h = this.terrain.heightAt(dir.x * mid, dir.y * mid);
      if (h < targetHeight) lo = mid; else hi = mid;
    }
    const r = (lo + hi) / 2;
    return new THREE.Vector3(dir.x * r, this.terrain.heightAt(dir.x * r, dir.y * r), dir.y * r);
  }

  _buildDock(angle, wood, plankMat, preset) {
    const shore = this.shorePoint(angle, 0.55);
    const inward = new THREE.Vector3(-Math.cos(angle), 0, -Math.sin(angle));  // hacia el agua
    const dock = new THREE.Group();
    dock.position.copy(shore);
    dock.lookAt(shore.clone().add(inward));

    const length = 15;
    const width = 2.6;
    const deckY = 1.15;

    // Tablones cruzados
    const plankGeo = new THREE.BoxGeometry(width, 0.09, 0.42);
    const planks = new THREE.InstancedMesh(plankGeo, plankMat, Math.floor(length / 0.5));
    const dummy = new THREE.Object3D();
    for (let i = 0; i < planks.count; i++) {
      dummy.position.set(0, deckY, 0.6 + i * 0.5);
      dummy.rotation.set(0, 0, (this.rng() - 0.5) * 0.01);
      dummy.updateMatrix();
      planks.setMatrixAt(i, dummy.matrix);
    }
    planks.castShadow = preset.shadows;
    planks.receiveShadow = preset.shadows;
    dock.add(planks);

    // Vigas longitudinales
    const beamGeo = new THREE.BoxGeometry(0.16, 0.2, length);
    [-width / 2 + 0.2, width / 2 - 0.2].forEach((x) => {
      const beam = new THREE.Mesh(beamGeo, wood);
      beam.position.set(x, deckY - 0.15, length / 2 + 0.4);
      beam.castShadow = preset.shadows;
      dock.add(beam);
    });

    // Pilotes hasta el fondo
    const pileGeo = new THREE.CylinderGeometry(0.14, 0.16, 1, 7);
    for (let i = 0; i < 5; i++) {
      const t = 0.7 + i * 3.4;
      [-width / 2 + 0.2, width / 2 - 0.2].forEach((x) => {
        const world = dock.localToWorld(new THREE.Vector3(x, 0, t));
        const bed = this.terrain.heightAt(world.x, world.z);
        const height = deckY + shore.y - bed + 0.3;
        const pile = new THREE.Mesh(pileGeo, wood);
        pile.scale.y = height;
        pile.position.set(x, deckY - height / 2, t);
        pile.castShadow = preset.shadows;
        dock.add(pile);
      });
    }

    // Barandilla parcial en el extremo
    const railGeo = new THREE.BoxGeometry(0.08, 0.08, 3);
    [-width / 2 + 0.2, width / 2 - 0.2].forEach((x) => {
      const rail = new THREE.Mesh(railGeo, wood);
      rail.position.set(x, deckY + 0.85, length - 1.2);
      dock.add(rail);
      for (let k = 0; k < 2; k++) {
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.9, 0.1), wood);
        post.position.set(x, deckY + 0.45, length - 2.6 + k * 2.6);
        dock.add(post);
      }
    });

    this.group.add(dock);

    // Puntos de pesca recomendados en la punta del muelle.
    const tip = dock.localToWorld(new THREE.Vector3(0, deckY, length - 1.5));
    this.fishingSpots.push({ name: 'Punta del muelle', position: tip });
    this.dockDeckY = shore.y + deckY;
    this.dockObject = dock;
    return dock;
  }

  _buildBoat(angle, wood, preset) {
    const shore = this.shorePoint(angle, -0.25);
    const boat = new THREE.Group();
    boat.position.set(shore.x, 0.02, shore.z);
    boat.rotation.y = angle + Math.PI / 2 + 0.3;

    // Casco: caja estrechada a proa y popa mediante escalado de vértices.
    const hull = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.55, 4.2, 2, 1, 6), wood);
    const pos = hull.geometry.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const taper = 1 - Math.pow(Math.abs(v.z) / 2.1, 2) * 0.75;
      v.x *= taper;
      if (v.y > 0) v.x *= 1.12;
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    hull.geometry.computeVertexNormals();
    hull.castShadow = preset.shadows;
    boat.add(hull);

    const bench = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.08, 0.35), wood);
    bench.position.y = 0.22;
    boat.add(bench);

    this.group.add(boat);
    this.boat = boat;
    this.fishingSpots.push({ name: 'La barca', position: boat.position.clone().setY(0.5) });
  }

  _buildCamp(angle, wood, textures, preset) {
    const spot = this.shorePoint(angle, 1.4);
    const camp = new THREE.Group();
    camp.position.copy(spot);

    // Círculo de piedras
    const stone = textures.material('roca', { repeat: 1 });
    const stoneGeo = new THREE.DodecahedronGeometry(0.22, 0);
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * Math.PI * 2;
      const s = new THREE.Mesh(stoneGeo, stone);
      s.position.set(Math.cos(a) * 0.75, 0.08, Math.sin(a) * 0.75);
      s.rotation.set(this.rng(), this.rng(), this.rng());
      s.scale.setScalar(0.7 + this.rng() * 0.6);
      s.castShadow = preset.shadows;
      camp.add(s);
    }
    // Leña
    for (let i = 0; i < 4; i++) {
      const log = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.8, 5), wood);
      log.rotation.set(Math.PI / 2.2, (i / 4) * Math.PI, 0);
      log.position.y = 0.12;
      camp.add(log);
    }
    // Banco de tronco
    const seat = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 2.2, 8), wood);
    seat.rotation.z = Math.PI / 2;
    seat.position.set(1.8, 0.24, 0.4);
    seat.castShadow = preset.shadows;
    camp.add(seat);

    this.group.add(camp);
    this.camp = camp;
    this.fishingSpots.push({ name: 'Cala del campamento', position: spot.clone() });
  }

  dispose() {
    this.group.traverse((o) => {
      if (o.isMesh || o.isInstancedMesh) o.geometry.dispose();
    });
    this.scene.remove(this.group);
  }
}

/* ===== src/weather/TimeOfDay.js ===== */
/**
 * Reloj del mundo y paleta de luz.
 *
 * Convierte una hora (0..24) en la posición del sol y en los colores de luz,
 * cielo y niebla. Es la única fuente de verdad sobre "qué hora es": el cielo,
 * la iluminación, la IA de los peces y el audio la consultan.
 */

const MAX_ELEVATION = THREE.MathUtils.degToRad(62);

// Paradas de color a lo largo del día. Se interpolan según la altura del sol.
const PALETTE = [
  { key: 'noche',    sun: 0x2a3f6b, sky: 0x0a1224, fog: 0x0d1526, ambient: 0x1b2740, intensity: 0.25 },
  { key: 'alba',     sun: 0xffa062, sky: 0x35486e, fog: 0x5b6884, ambient: 0x4b5470, intensity: 2.2 },
  { key: 'mañana',   sun: 0xffe0b8, sky: 0x6ea3d8, fog: 0x9db6cf, ambient: 0x7d90a8, intensity: 4.6 },
  { key: 'mediodía', sun: 0xfff6ea, sky: 0x74a9e2, fog: 0xa9c2d8, ambient: 0x93a7bd, intensity: 5.6 },
  { key: 'ocaso',    sun: 0xff7a3c, sky: 0x3d4a72, fog: 0x6b5f70, ambient: 0x4a4560, intensity: 1.9 }
];

class TimeOfDay {
  constructor({ hour = 7.5, speed = 1 / 90 } = {}) {
    this.hour = hour;
    this.speed = speed;              // horas por segundo real (1/90 ≈ 36 min/día)
    this.paused = false;

    this.sunDirection = new THREE.Vector3();
    this.moonDirection = new THREE.Vector3();
    this.sunColor = new THREE.Color();
    this.skyColor = new THREE.Color();
    this.fogColor = new THREE.Color();
    this.ambientColor = new THREE.Color();
    this.sunIntensity = 1;
    this.elevation = 0;
    this._update();
  }

  update(dt) {
    if (!this.paused) {
      this.hour = (this.hour + dt * this.speed * 24) % 24;
    }
    this._update();
  }

  setHour(hour) {
    this.hour = ((hour % 24) + 24) % 24;
    this._update();
  }

  /** 0 de día, 1 de noche cerrada. */
  get nightFactor() {
    return 1 - smoothstep(-0.12, 0.16, Math.sin(this.elevation));
  }

  /** Los peces comen al amanecer y al atardecer: 1 en la mejor franja. */
  get feedingFactor() {
    const h = this.hour;
    const dawn = Math.exp(-Math.pow((h - 6.5) / 1.8, 2));
    const dusk = Math.exp(-Math.pow((h - 19.5) / 1.8, 2));
    const night = h < 4.5 || h > 21.5 ? 0.45 : 0;
    return clamp(0.45 + dawn * 0.75 + dusk * 0.7 + night * 0.2, 0.3, 1.4);
  }

  get label() {
    const h = Math.floor(this.hour);
    const m = Math.floor((this.hour - h) * 60);
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  }

  _update() {
    // 6h amanece, 12h cenit, 18h anochece. Fuera de esa franja el sol está bajo el horizonte.
    const dayAngle = ((this.hour - 6) / 12) * Math.PI;
    this.elevation = Math.sin(dayAngle) * MAX_ELEVATION;
    const azimuth = THREE.MathUtils.degToRad(-40) + (this.hour / 24) * Math.PI * 2;

    this.sunDirection.set(
      Math.cos(this.elevation) * Math.cos(azimuth),
      Math.sin(this.elevation),
      Math.cos(this.elevation) * Math.sin(azimuth)
    ).normalize();
    this.moonDirection.copy(this.sunDirection).negate();

    const stops = this._blendStops();
    this.sunColor.copy(stops.sun);
    this.skyColor.copy(stops.sky);
    this.fogColor.copy(stops.fog);
    this.ambientColor.copy(stops.ambient);
    this.sunIntensity = stops.intensity;
  }

  _blendStops() {
    const s = Math.sin(this.elevation);
    let a, b, t;
    if (s < -0.05) { a = PALETTE[0]; b = PALETTE[0]; t = 0; }
    else if (s < 0.12) { a = PALETTE[0]; b = this.hour < 12 ? PALETTE[1] : PALETTE[4]; t = smoothstep(-0.05, 0.12, s); }
    else if (s < 0.42) { a = this.hour < 12 ? PALETTE[1] : PALETTE[4]; b = PALETTE[2]; t = smoothstep(0.12, 0.42, s); }
    else { a = PALETTE[2]; b = PALETTE[3]; t = smoothstep(0.42, 0.85, s); }

    return {
      sun: new THREE.Color(a.sun).lerp(new THREE.Color(b.sun), t),
      sky: new THREE.Color(a.sky).lerp(new THREE.Color(b.sky), t),
      fog: new THREE.Color(a.fog).lerp(new THREE.Color(b.fog), t),
      ambient: new THREE.Color(a.ambient).lerp(new THREE.Color(b.ambient), t),
      intensity: lerp(a.intensity, b.intensity, t)
    };
  }
}

/* ===== src/weather/Weather.js ===== */
/**
 * Meteorología: estados, transiciones suaves y lluvia.
 *
 * Cada preset no es sólo estético — la nubosidad y el viento entran en el
 * cálculo de actividad de los peces, en el oleaje del agua y en la mezcla del
 * audio ambiente.
 */

const WEATHER_PRESETS = {
  despejado: { label: 'Despejado', cloudiness: 0.1, fogDensity: 0.00055, rain: 0, wind: 1.6, biteModifier: 1.0 },
  nubes:     { label: 'Nublado',   cloudiness: 0.6, fogDensity: 0.0016, rain: 0, wind: 3.2, biteModifier: 1.15 },
  niebla:    { label: 'Niebla',    cloudiness: 0.7,  fogDensity: 0.016,  rain: 0, wind: 0.6, biteModifier: 0.9 },
  lluvia:    { label: 'Lluvia',    cloudiness: 0.88, fogDensity: 0.0075, rain: 0.6, wind: 5.5, biteModifier: 1.3 },
  tormenta:  { label: 'Tormenta',  cloudiness: 1.0,  fogDensity: 0.012,  rain: 1, wind: 9, biteModifier: 0.75 }
};

const ORDER = Object.keys(WEATHER_PRESETS);

class Weather {
  constructor(scene, textures, preset, { initial = 'despejado', seed = 5 } = {}) {
    this.scene = scene;
    this.rng = createRandom(seed);
    this.current = initial;
    this.target = WEATHER_PRESETS[initial];

    this.cloudiness = this.target.cloudiness;
    this.fogDensity = this.target.fogDensity;
    this.rainAmount = this.target.rain;
    this.windSpeed = this.target.wind;
    this.windDirection = new THREE.Vector2(1, 0.35).normalize();
    this.timeToChange = 120 + this.rng() * 180;

    this.fog = new THREE.FogExp2(0xa8bdd2, this.fogDensity);
    scene.fog = this.fog;

    this._buildRain(textures, preset.rainParticles);
  }

  _buildRain(textures, count) {
    this.rainCount = count;
    const positions = new Float32Array(count * 3);
    const speeds = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      positions.set([
        (this.rng() - 0.5) * 140,
        this.rng() * 60,
        (this.rng() - 0.5) * 140
      ], i * 3);
      speeds[i] = 26 + this.rng() * 22;
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    this.rainSpeeds = speeds;

    this.rain = new THREE.Points(geometry, new THREE.PointsMaterial({
      map: textures.raindrop(),
      color: 0xc9dcec,
      size: 0.42,
      transparent: true,
      opacity: 0,
      depthWrite: false,
      sizeAttenuation: true
    }));
    this.rain.frustumCulled = false;
    this.rain.visible = false;
    this.scene.add(this.rain);
  }

  setWeather(key) {
    if (!WEATHER_PRESETS[key]) return;
    this.current = key;
    this.target = WEATHER_PRESETS[key];
    this.timeToChange = 150 + this.rng() * 200;
  }

  cycle() {
    const i = ORDER.indexOf(this.current);
    this.setWeather(ORDER[(i + 1) % ORDER.length]);
    return this.target.label;
  }

  get label() { return this.target.label; }
  get biteModifier() { return this.target.biteModifier; }
  /** Cuánto pica la superficie del agua: alimenta el shader del lago. */
  get choppiness() { return clamp(0.5 + this.windSpeed / 9, 0.5, 2.4); }

  update(dt, playerPosition, fogColor) {
    this.timeToChange -= dt;
    if (this.timeToChange <= 0) {
      // Transición a un estado vecino: nunca se pasa de despejado a tormenta de golpe.
      const i = ORDER.indexOf(this.current);
      const next = ORDER[clamp(i + (this.rng() < 0.5 ? -1 : 1), 0, ORDER.length - 1)];
      this.setWeather(next);
    }

    this.cloudiness = damp(this.cloudiness, this.target.cloudiness, 0.35, dt);
    this.fogDensity = damp(this.fogDensity, this.target.fogDensity, 0.35, dt);
    this.rainAmount = damp(this.rainAmount, this.target.rain, 0.5, dt);
    this.windSpeed = damp(this.windSpeed, this.target.wind, 0.4, dt);

    this.fog.density = this.fogDensity;
    if (fogColor) this.fog.color.copy(fogColor);

    this._updateRain(dt, playerPosition);
  }

  _updateRain(dt, center) {
    const visible = this.rainAmount > 0.02;
    this.rain.visible = visible;
    if (!visible) return;

    this.rain.material.opacity = clamp(this.rainAmount * 0.75, 0, 1);
    const active = Math.floor(this.rainCount * clamp(this.rainAmount, 0, 1));
    this.rain.geometry.setDrawRange(0, active);

    const pos = this.rain.geometry.attributes.position;
    const arr = pos.array;
    const driftX = this.windDirection.x * this.windSpeed * dt;
    const driftZ = this.windDirection.y * this.windSpeed * dt;

    for (let i = 0; i < active; i++) {
      const i3 = i * 3;
      arr[i3 + 1] -= this.rainSpeeds[i] * dt;
      arr[i3] += driftX;
      arr[i3 + 2] += driftZ;
      // Reciclado en una caja alrededor del jugador: la lluvia le acompaña.
      if (arr[i3 + 1] < center.y - 6) {
        arr[i3] = center.x + (this.rng() - 0.5) * 140;
        arr[i3 + 1] = center.y + 45 + this.rng() * 20;
        arr[i3 + 2] = center.z + (this.rng() - 0.5) * 140;
      }
    }
    pos.needsUpdate = true;
  }

  dispose() {
    this.rain.geometry.dispose();
    this.rain.material.dispose();
  }
}

/** Franja horaria para las tablas de actividad. */
function timeBand(hour) {
  if (hour < 6) return 'madrugada';
  if (hour < 12) return 'manana';
  if (hour < 20) return 'tarde';
  return 'noche';
}

/** Peso realista a partir de la longitud (relación cúbica típica). */
function weightFor(species, lengthCm) {
  return species.weightPerLength * Math.pow(lengthCm, 3);
}

function valueFor(species, weightKg) {
  return Math.max(1, Math.round(species.price * weightKg * 1.6));
}

/* ===== src/fish/Fish.js ===== */
/**
 * Un pez: cuerpo, animación de nado y máquina de estados.
 *
 * Estados: IDLE → SWIMMING → SEARCHING → INVESTIGATING → BITING → HOOKED →
 * FIGHTING → ESCAPING → CAUGHT. Cada especie modula tiempos y probabilidades
 * desde `FishData`, así que el comportamiento sale de los datos y no de
 * condicionales repartidos por el código.
 */

const FishState = {
  IDLE: 'idle',
  SWIMMING: 'swimming',
  SEARCHING: 'searching',
  INVESTIGATING: 'investigating',
  BITING: 'biting',
  HOOKED: 'hooked',
  FIGHTING: 'fighting',
  ESCAPING: 'escaping',
  CAUGHT: 'caught'
};

const geometryCache = new Map();

/** Cuerpo de pez: elipsoide afilado + caudal + dorsal, fusionados. */
function fishGeometry(speciesId) {
  if (geometryCache.has(speciesId)) return geometryCache.get(speciesId);

  const body = new THREE.SphereGeometry(0.5, 14, 10);
  const pos = body.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const t = v.z / 0.5;                       // -1 cola, +1 morro
    const taper = 1 - Math.pow(Math.abs(t), 2.1) * 0.85;
    v.x *= 0.42 * taper;
    v.y *= 0.62 * taper;
    v.z *= 2.0;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  body.computeVertexNormals();

  const caudal = new THREE.PlaneGeometry(0.55, 0.7, 1, 1);
  caudal.rotateY(Math.PI / 2);
  caudal.translate(0, 0, -1.15);

  const dorsal = new THREE.PlaneGeometry(0.7, 0.3, 1, 1);
  dorsal.rotateY(Math.PI / 2);
  dorsal.translate(0, 0.3, 0.05);

  const geo = mergeGeometries([body, caudal, dorsal]);
  body.dispose(); caudal.dispose(); dorsal.dispose();
  geometryCache.set(speciesId, geo);
  return geo;
}

function fishMaterial(species) {
  const material = new THREE.MeshStandardMaterial({
    color: species.color,
    roughness: 0.42,
    metalness: 0.22,
    side: THREE.DoubleSide,
    flatShading: false
  });

  // Ondulación de nado en el vertex shader: la cola bate y el cuerpo serpentea.
  material.userData.uniforms = { uTime: { value: 0 }, uSwim: { value: 1 } };
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = material.userData.uniforms.uTime;
    shader.uniforms.uSwim = material.userData.uniforms.uSwim;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `
        #include <common>
        uniform float uTime;
        uniform float uSwim;
      `)
      .replace('#include <begin_vertex>', `
        #include <begin_vertex>
        float tailFactor = clamp(-transformed.z * 0.9 + 0.35, 0.0, 1.6);
        transformed.x += sin(uTime * 7.0 + transformed.z * 2.4) * 0.09 * tailFactor * uSwim;
      `);
  };
  return material;
}

class Fish {
  constructor(speciesId, { rng, position }) {
    this.species = SPECIES_BY_ID[speciesId];
    this.rng = rng;

    this.length = skewedRandom(rng, this.species.lengthRange[0], this.species.lengthRange[1], 2.4);
    this.weight = weightFor(this.species, this.length);
    this.trophy = (this.length - this.species.lengthRange[0]) /
      (this.species.lengthRange[1] - this.species.lengthRange[0]);

    this.state = FishState.SWIMMING;
    this.stateTime = 0;
    this.interest = 0;
    this.energy = 1;

    this.position = position.clone();
    this.velocity = new THREE.Vector3();
    this.heading = rng() * Math.PI * 2;
    this.wanderTarget = position.clone();
    this.wanderTimer = 0;

    const scale = this.length / 100;          // cm → m
    this.material = fishMaterial(this.species);
    this.mesh = new THREE.Mesh(fishGeometry(this.species.id), this.material);
    this.mesh.scale.setScalar(scale);
    this.mesh.position.copy(this.position);
    this.mesh.castShadow = false;
    this.mesh.visible = false;                // se enciende al acercarse
    this.mesh.userData.fish = this;
  }

  get displayName() { return this.species.name; }
  get isBusy() {
    return this.state === FishState.HOOKED || this.state === FishState.FIGHTING;
  }

  setState(state) {
    if (this.state === state) return;
    this.state = state;
    this.stateTime = 0;
  }

  /** Ganas de morder este señuelo, ahora, aquí. 0 = ni mirarlo. */
  appetite(lure, hour, weatherModifier, depth) {
    const s = this.species;
    const affinity = s.lures[lure.id] ?? 0.8;
    const band = s.activity[timeBand(hour)] ?? 1;
    const depthFit = 1 - clamp(
      Math.abs(depth - (s.depth[0] + s.depth[1]) / 2) / ((s.depth[1] - s.depth[0]) / 2 + 1.2),
      0, 1
    ) * 0.75;
    // Los ejemplares grandes son más desconfiados.
    const caution = 1 - this.trophy * 0.35;
    return affinity * band * depthFit * caution * weatherModifier * lure.attraction;
  }

  update(dt, context) {
    this.stateTime += dt;
    this.material.userData.uniforms.uTime.value += dt * (0.6 + this.velocity.length() * 0.5);

    switch (this.state) {
      case FishState.SWIMMING: this._wander(dt, context); break;
      case FishState.SEARCHING: this._search(dt, context); break;
      case FishState.INVESTIGATING: this._investigate(dt, context); break;
      case FishState.BITING: this._biting(dt, context); break;
      case FishState.ESCAPING: this._escape(dt, context); break;
      case FishState.HOOKED:
      case FishState.FIGHTING: break;   // los conduce FishingSystem
      default: break;
    }

    if (!this.isBusy) {
      this.position.addScaledVector(this.velocity, dt);
      this._clampToWater(context.terrain);
    }
    this._applyTransform(dt);
  }

  _applyTransform(dt) {
    this.mesh.position.copy(this.position);
    const speed = this.velocity.length();
    if (speed > 0.02) {
      const look = this.position.clone().addScaledVector(this.velocity, 1 / Math.max(speed, 0.001));
      this.mesh.lookAt(look);
    }
    this.material.userData.uniforms.uSwim.value = clamp(0.35 + speed * 0.5, 0.3, 2.2);
  }

  /** No sale del agua ni atraviesa el fondo. */
  _clampToWater(terrain) {
    const bed = terrain.heightAt(this.position.x, this.position.z);
    const minY = bed + 0.18;
    const maxY = terrain.waterLevel - 0.15;
    if (minY >= maxY) {
      // Ha llegado a un bajío sin calado: da media vuelta hacia el centro.
      this.velocity.set(-this.position.x, 0, -this.position.z).normalize().multiplyScalar(this.species.speed * 0.4);
      this.position.y = Math.min(maxY, minY);
      return;
    }
    if (this.position.y < minY) { this.position.y = minY; this.velocity.y = Math.abs(this.velocity.y) * 0.4; }
    if (this.position.y > maxY) { this.position.y = maxY; this.velocity.y = -Math.abs(this.velocity.y) * 0.4; }
  }

  _wander(dt, { terrain }) {
    this.wanderTimer -= dt;
    if (this.wanderTimer <= 0) {
      this.wanderTimer = 3 + this.rng() * 6;
      const s = this.species;
      const preferredDepth = lerp(s.depth[0], s.depth[1], this.rng());
      const angle = this.heading + (this.rng() - 0.5) * 2.2;
      const dist = 6 + this.rng() * 16;
      const nx = this.position.x + Math.cos(angle) * dist;
      const nz = this.position.z + Math.sin(angle) * dist;
      const depthThere = terrain.depthAt(nx, nz);
      if (depthThere > s.depth[0] * 0.6) {
        this.heading = angle;
        this.wanderTarget.set(nx, terrain.waterLevel - clamp(preferredDepth, 0.4, depthThere - 0.3), nz);
      } else {
        this.heading += Math.PI * (0.6 + this.rng() * 0.8);   // hacia aguas con calado
      }
    }
    this._steerTo(this.wanderTarget, this.species.speed * 0.28, dt);
  }

  _search(dt, context) {
    const lure = context.lurePosition;
    if (!lure) { this.setState(FishState.SWIMMING); return; }
    this._steerTo(lure, this.species.speed * 0.55, dt);
    if (this.position.distanceTo(lure) < 2.4) this.setState(FishState.INVESTIGATING);
    if (this.stateTime > 14) this.setState(FishState.ESCAPING);
  }

  _investigate(dt, context) {
    const lure = context.lurePosition;
    if (!lure) { this.setState(FishState.SWIMMING); return; }

    // Rodea el señuelo mientras se decide.
    const toLure = lure.clone().sub(this.position);
    const dist = toLure.length();
    const tangent = new THREE.Vector3(-toLure.z, 0, toLure.x).normalize();
    const desired = lure.clone()
      .addScaledVector(tangent, 0.9)
      .addScaledVector(toLure.normalize(), -0.7);
    this._steerTo(desired, this.species.speed * 0.4, dt);

    // El movimiento del señuelo despierta el ataque; quieto, desconfía.
    const action = context.lureAction || 0;
    const chance = this.interest * (0.25 + action * 0.9) * dt;
    if (this.rng() < chance && dist < 1.8) {
      this.setState(FishState.BITING);
      this.biteStrength = clamp(0.35 + this.interest * 0.5 + this.trophy * 0.4, 0.25, 1.6);
      context.onBite?.(this);
    } else if (this.stateTime > 6 + this.interest * 5) {
      this.setState(FishState.ESCAPING);
    }
  }

  _biting(dt, context) {
    const lure = context.lurePosition;
    if (lure) this._steerTo(lure, this.species.speed * 0.5, dt);
    // Ventana para clavar: si el jugador no reacciona, lo suelta.
    if (this.stateTime > 1.15 + this.species.stamina * 0.35) {
      context.onSpit?.(this);
      this.setState(FishState.ESCAPING);
    }
  }

  _escape(dt, { terrain }) {
    const away = this.position.clone().setY(0).normalize().negate().multiplyScalar(-1);
    this.velocity.lerp(away.multiplyScalar(this.species.speed * 0.6), 1 - Math.exp(-2 * dt));
    if (this.stateTime > 5) { this.interest = 0; this.setState(FishState.SWIMMING); }
  }

  _steerTo(target, speed, dt) {
    const desired = target.clone().sub(this.position);
    const d = desired.length();
    if (d < 0.001) return;
    desired.multiplyScalar(speed / d);
    this.velocity.x = damp(this.velocity.x, desired.x, 1.8, dt);
    this.velocity.y = damp(this.velocity.y, desired.y, 1.4, dt);
    this.velocity.z = damp(this.velocity.z, desired.z, 1.8, dt);
  }

  dispose() {
    this.material.dispose();
  }
}

/* ===== src/fish/FishManager.js ===== */
/**
 * Población del lago.
 *
 * Los peces existen antes de que el jugador lance: nacen en el hábitat que les
 * corresponde por profundidad y se mueven por el lago. Cuando hay un señuelo en
 * el agua, este gestor evalúa qué peces cercanos se interesan y los pasa a
 * SEARCHING; nunca se genera un pez "a medida" delante del jugador.
 */

const MAX_VISIBLE_DISTANCE = 45;

class FishManager {
  constructor(scene, terrain, { population = 72, seed = 71 } = {}) {
    this.scene = scene;
    this.terrain = terrain;
    this.rng = createRandom(seed);
    this.fishes = [];
    this.group = new THREE.Group();
    this.group.name = 'peces';
    scene.add(this.group);

    for (let i = 0; i < population; i++) this._spawn();
  }

  _randomSpotFor(species) {
    // Busca un punto con la profundidad que esa especie prefiere.
    for (let attempt = 0; attempt < 60; attempt++) {
      const angle = this.rng() * Math.PI * 2;
      const radius = this.rng() * this.terrain.field.lakeRadius * 1.05;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      const depth = this.terrain.depthAt(x, z);
      if (depth < species.depth[0] * 0.7 || depth > species.depth[1] * 1.6) continue;
      const y = this.terrain.waterLevel - clamp(
        species.depth[0] + this.rng() * (species.depth[1] - species.depth[0]),
        0.4, depth - 0.25
      );
      return new THREE.Vector3(x, y, z);
    }
    return null;
  }

  _spawn() {
    // Las especies raras aparecen menos.
    const pool = SPECIES.filter((s) => s.rarity !== 'raro' || this.rng() < 0.35);
    const species = pool[Math.floor(this.rng() * pool.length)] || SPECIES[0];
    const position = this._randomSpotFor(species);
    if (!position) return null;

    const fish = new Fish(species.id, { rng: this.rng, position });
    this.fishes.push(fish);
    this.group.add(fish.mesh);
    return fish;
  }

  /** Pez que está mordiendo ahora mismo, si lo hay. */
  get biting() {
    return this.fishes.find((f) => f.state === FishState.BITING) || null;
  }

  /**
   * Reparte interés entre los peces cercanos al señuelo.
   * `lureAction` (0..1) es cuánto se está moviendo el señuelo al recoger.
   */
  evaluate(context) {
    const { lurePosition, lure, hour, weatherModifier, lureAction, feeding } = context;
    if (!lurePosition || !lure) {
      this.fishes.forEach((f) => {
        if (f.state === FishState.SEARCHING || f.state === FishState.INVESTIGATING) {
          f.interest = 0;
          f.setState(FishState.SWIMMING);
        }
      });
      return;
    }

    const depth = this.terrain.depthAt(lurePosition.x, lurePosition.z);
    for (const fish of this.fishes) {
      if (fish.isBusy || fish.state === FishState.ESCAPING || fish.state === FishState.BITING) continue;

      const distance = fish.position.distanceTo(lurePosition);
      const detection = 9 + fish.species.speed * 2.4;
      if (distance > detection) {
        if (fish.state === FishState.SEARCHING) fish.setState(FishState.SWIMMING);
        continue;
      }

      const appetite = fish.appetite(lure, hour, weatherModifier, depth) * feeding;
      // Se enfría con la distancia: el señuelo tiene que estar en su zona.
      fish.interest = clamp(appetite * (1 - distance / detection), 0, 2);

      if (fish.state === FishState.SWIMMING && fish.interest > 0.35 && this.rng() < fish.interest * 0.02) {
        fish.setState(FishState.SEARCHING);
      }
    }
  }

  update(dt, context) {
    const camera = context.cameraPosition;
    for (const fish of this.fishes) {
      fish.update(dt, context);
      // Sólo se dibujan los peces cercanos: el resto sigue simulándose barato.
      fish.mesh.visible = !!camera && fish.position.distanceTo(camera) < MAX_VISIBLE_DISTANCE;
    }
  }

  /** Retira un pez capturado y repone la población en otro punto del lago. */
  remove(fish) {
    const i = this.fishes.indexOf(fish);
    if (i >= 0) this.fishes.splice(i, 1);
    this.group.remove(fish.mesh);
    fish.dispose();
    this._spawn();
  }

  /** Devuelve un pez al agua tras soltarlo o perderlo. */
  release(fish) {
    fish.interest = 0;
    fish.setState(FishState.ESCAPING);
  }

  get counts() {
    const byState = {};
    this.fishes.forEach((f) => { byState[f.state] = (byState[f.state] || 0) + 1; });
    return { total: this.fishes.length, byState };
  }

  dispose() {
    this.fishes.forEach((f) => f.dispose());
    this.scene.remove(this.group);
  }
}

/* ===== src/gear/GearData.js ===== */
/**
 * Catálogo de equipo. Datos puros: la caña, el carrete, la línea y el señuelo
 * son cuatro ejes independientes y sus estadísticas se combinan en
 * `Equipment.stats`.

/* ===== src/gear/Inventory.js ===== */
/** Qué posee el jugador. No sabe nada de estadísticas: sólo de propiedad. */
class Inventory {
  constructor(initial = null) {
    this.owned = initial || {
      rods: ['cana_iniciacion'],
      reels: ['carrete_basico'],
      lines: ['nylon_022'],
      lures: ['cucharilla']
    };
  }

  has(category, id) {
    return (this.owned[category] || []).includes(id);
  }

  add(category, id) {
    if (!CATALOG[category] || !findItem(category, id)) return false;
    if (this.has(category, id)) return false;
    this.owned[category].push(id);
    return true;
  }

  list(category) {
    return (this.owned[category] || []).map((id) => findItem(category, id)).filter(Boolean);
  }

  toJSON() { return { owned: this.owned }; }

  static fromJSON(data) {
    if (!data?.owned) return new Inventory();
    const clean = {};
    for (const category of Object.keys(CATALOG)) {
      clean[category] = (data.owned[category] || []).filter((id) => findItem(category, id));
      if (!clean[category].length) clean[category] = [CATALOG[category][0].id];
    }
    return new Inventory(clean);
  }
}

/* ===== src/gear/Equipment.js ===== */
/**
 * Montaje equipado y estadísticas derivadas.
 *
 * Aquí es donde caña + carrete + línea + señuelo se convierten en los números
 * que usa el sistema de pesca: cuánto se lanza, cuánto aguanta la línea, a qué
 * velocidad se recoge y cuánto freno se puede aplicar.
 */
class Equipment {
  constructor(inventory, equipped = null) {
    this.inventory = inventory;
    this.equipped = equipped || {
      rods: 'cana_iniciacion',
      reels: 'carrete_basico',
      lines: 'nylon_022',
      lures: 'cucharilla'
    };
  }

  get rod() { return findItem('rods', this.equipped.rods) || CATALOG.rods[0]; }
  get reel() { return findItem('reels', this.equipped.reels) || CATALOG.reels[0]; }
  get line() { return findItem('lines', this.equipped.lines) || CATALOG.lines[0]; }
  get lure() { return findItem('lures', this.equipped.lures) || CATALOG.lures[0]; }

  equip(category, id) {
    if (!this.inventory.has(category, id)) return false;
    this.equipped[category] = id;
    return true;
  }

  get stats() {
    const { rod, reel, line, lure } = this;

    // Un señuelo con peso vuela más; una línea gruesa frena el lanzamiento.
    const lureFactor = clamp(0.62 + lure.weightG / 26, 0.62, 1.4);
    const lineFactor = clamp(1.2 - line.diameter * 1.35, 0.72, 1.16);
    const castDistance = 17 * rod.power * lureFactor * lineFactor * (0.85 + reel.retrieve * 0.35);

    return {
      castDistance,                                   // metros a máxima potencia
      lineStrength: line.strength,                    // kg antes de romper
      // El freno nunca puede superar lo que aguanta la línea.
      maxDrag: Math.min(reel.maxDrag, line.strength * 0.82),
      retrieveSpeed: 0.85 + reel.retrieve * 1.5,      // m/s de recogida
      sensitivity: rod.sensitivity,
      elasticity: line.elasticity,                    // amortigua los picos de tensión
      rodStrength: rod.strength,                      // tensión que aguanta la caña
      workingDepth: lure.workingDepth,
      lureAction: lure.action,
      capacity: reel.capacity                         // metros de línea disponibles
    };
  }

  toJSON() { return { equipped: this.equipped }; }

  static fromJSON(inventory, data) {
    const equipment = new Equipment(inventory);
    if (data?.equipped) {
      for (const [category, id] of Object.entries(data.equipped)) {
        if (inventory.has(category, id)) equipment.equipped[category] = id;
      }
    }
    return equipment;
  }
}

/* ===== src/economy/Economy.js ===== */
/**
 * Dinero, ventas y registro de capturas.
 *
 * El registro guarda récords por especie: es a la vez "pantalla de peces
 * capturados" y base de la progresión futura (logros, licencias, zonas).
 */
class Economy {
  constructor(data = null) {
    this.money = data?.money ?? 60;
    this.records = data?.records ?? {};      // id → { count, bestLength, bestWeight }
    this.stats = data?.stats ?? {
      casts: 0, hooked: 0, landed: 0, lost: 0, lineBreaks: 0, totalWeight: 0, biggest: 0
    };
    this.unlockedZones = data?.unlockedZones ?? ['lago_niebla'];
  }

  /** Registra una captura y devuelve lo que vale. */
  registerCatch(fish) {
    const id = fish.species.id;
    const record = this.records[id] || { count: 0, bestLength: 0, bestWeight: 0 };
    const isRecord = fish.length > record.bestLength;
    record.count += 1;
    record.bestLength = Math.max(record.bestLength, fish.length);
    record.bestWeight = Math.max(record.bestWeight, fish.weight);
    this.records[id] = record;

    this.stats.landed += 1;
