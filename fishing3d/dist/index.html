/* ===== src/gear/Inventory.js ===== */
/** Qué posee el jugador. No sabe nada de estadísticas: sólo de propiedad. */
class Inventory {
  constructor(initial = null) {
    this.owned = initial || {
      rods: ['cana_iniciacion'],
      reels: ['carrete_basico'],
      lines: ['nylon_022'],
      lures: ['cucharilla']
    };
  }

  has(category, id) {
    return (this.owned[category] || []).includes(id);
  }

  add(category, id) {
    if (!CATALOG[category] || !findItem(category, id)) return false;
    if (this.has(category, id)) return false;
    this.owned[category].push(id);
    return true;
  }

  list(category) {
    return (this.owned[category] || []).map((id) => findItem(category, id)).filter(Boolean);
  }

  toJSON() { return { owned: this.owned }; }

  static fromJSON(data) {
    if (!data?.owned) return new Inventory();
    const clean = {};
    for (const category of Object.keys(CATALOG)) {
      clean[category] = (data.owned[category] || []).filter((id) => findItem(category, id));
      if (!clean[category].length) clean[category] = [CATALOG[category][0].id];
    }
    return new Inventory(clean);
  }
}

/* ===== src/gear/Equipment.js ===== */
/**
 * Montaje equipado y estadísticas derivadas.
 *
 * Aquí es donde caña + carrete + línea + señuelo se convierten en los números
 * que usa el sistema de pesca: cuánto se lanza, cuánto aguanta la línea, a qué
 * velocidad se recoge y cuánto freno se puede aplicar.
 */
class Equipment {
  constructor(inventory, equipped = null) {
    this.inventory = inventory;
    this.equipped = equipped || {
      rods: 'cana_iniciacion',
      reels: 'carrete_basico',
      lines: 'nylon_022',
      lures: 'cucharilla'
    };
  }

  get rod() { return findItem('rods', this.equipped.rods) || CATALOG.rods[0]; }
  get reel() { return findItem('reels', this.equipped.reels) || CATALOG.reels[0]; }
  get line() { return findItem('lines', this.equipped.lines) || CATALOG.lines[0]; }
  get lure() { return findItem('lures', this.equipped.lures) || CATALOG.lures[0]; }

  /**
   * Equipar. `guard` permite a la pesca vetar el cambio: no se cambia de
   * línea con un pez colgando, ni de señuelo con el aparejo en el agua.
   * Devuelve `true`, o el motivo del rechazo.
   */
  equip(category, id) {
    if (!this.inventory.has(category, id)) return false;
    const veto = this.guard?.(category);
    if (veto) return veto;
    this.equipped[category] = id;
    return true;
  }

  get stats() {
    const { rod, reel, line, lure } = this;

    // Un señuelo con peso vuela más; una línea gruesa frena el lanzamiento.
    const lureFactor = clamp(0.62 + lure.weightG / 26, 0.62, 1.4);
    const lineFactor = clamp(1.2 - line.diameter * 1.35, 0.72, 1.16);
    const castDistance = 17 * rod.power * lureFactor * lineFactor * (0.85 + reel.retrieve * 0.35);

    return {
      castDistance,                                   // metros a máxima potencia
      lineStrength: line.strength,                    // kg antes de romper
      // El freno nunca puede superar lo que aguanta la línea.
      maxDrag: Math.min(reel.maxDrag, line.strength * 0.82),
      retrieveSpeed: 0.85 + reel.retrieve * 1.5,      // m/s de recogida
      sensitivity: rod.sensitivity,
      elasticity: line.elasticity,                    // amortigua los picos de tensión
      rodStrength: rod.strength,                      // tensión que aguanta la caña
      workingDepth: lure.workingDepth,
      lureAction: lure.action,
      capacity: reel.capacity                         // metros de línea disponibles
    };
  }

  toJSON() { return { equipped: this.equipped }; }

  static fromJSON(inventory, data) {
    const equipment = new Equipment(inventory);
    if (data?.equipped) {
      for (const [category, id] of Object.entries(data.equipped)) {
        if (inventory.has(category, id)) equipment.equipped[category] = id;
      }
    }
    return equipment;
  }
}

/* ===== src/economy/Economy.js ===== */
/**
 * Dinero, ventas y registro de capturas.
 *
 * El registro guarda récords por especie: es a la vez "pantalla de peces
 * capturados" y base de la progresión futura (logros, licencias, zonas).
 */
class Economy {
  constructor(data = null) {
    this.money = data?.money ?? 60;
    this.records = data?.records ?? {};      // id → { count, bestLength, bestWeight }
    this.stats = data?.stats ?? {
      casts: 0, hooked: 0, landed: 0, lost: 0, lineBreaks: 0, totalWeight: 0, biggest: 0
    };
    this.unlockedZones = data?.unlockedZones ?? ['lago_niebla'];
    this.currentZone = data?.currentZone ?? 'lago_niebla';
  }

  /** Registra una captura y devuelve lo que vale. */
  registerCatch(fish) {
    const id = fish.species.id;
    const record = this.records[id] || { count: 0, bestLength: 0, bestWeight: 0 };
    const isRecord = fish.length > record.bestLength;
    record.count += 1;
    record.bestLength = Math.max(record.bestLength, fish.length);
    record.bestWeight = Math.max(record.bestWeight, fish.weight);
    this.records[id] = record;

    this.stats.landed += 1;
    this.stats.totalWeight += fish.weight;
    this.stats.biggest = Math.max(this.stats.biggest, fish.weight);

    const value = valueFor(fish.species, fish.weight);
    return { value, isRecord, isNew: record.count === 1 };
  }

  sell(amount) {
    this.money += amount;
    return this.money;
  }

  canAfford(price) { return this.money >= price; }

  buy(category, id) {
    const item = findItem(category, id);
    if (!item || !this.canAfford(item.price)) return false;
    this.money -= item.price;
    return true;
  }

  get discovered() {
    return Object.keys(this.records).filter((id) => this.records[id].count > 0).length;
  }

  get speciesTotal() { return Object.keys(SPECIES_BY_ID).length; }

  toJSON() {
    return {
      money: this.money,
      records: this.records,
      stats: this.stats,
      unlockedZones: this.unlockedZones,
      currentZone: this.currentZone
    };
  }
}

/* ===== src/fishing/Line.js ===== */
/**
 * Línea de pesca: cuerda de Verlet entre la puntera y el señuelo.
 *
 * La simulación es puramente visual —la tensión de juego la calcula
 * `FishingSystem` a partir de fuerzas— pero comparte con ella el mismo dato:
 * `lineOut`, los metros de hilo soltados. Si hay más hilo que distancia, la
 * cuerda cuelga; si hay menos, se tensa en línea recta. Por eso lo que se ve
 * coincide siempre con lo que se siente.
 */

const SEGMENTS = 22;
const LINE_GRAVITY = new THREE.Vector3(0, -9.81, 0);

class FishingLine {
  constructor(scene, { color = 0xe8f1f5 } = {}) {
    this.points = [];
    for (let i = 0; i < SEGMENTS; i++) {
      this.points.push({
        position: new THREE.Vector3(),
        previous: new THREE.Vector3()
      });
    }

    const positions = new Float32Array(SEGMENTS * 3);
    this.geometry = new THREE.BufferGeometry();
    this.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    this.material = new THREE.LineBasicMaterial({
      color, transparent: true, opacity: 0.75, depthWrite: false
    });
    this.mesh = new THREE.Line(this.geometry, this.material);
    this.mesh.frustumCulled = false;
    this.mesh.visible = false;
    this.mesh.name = 'linea';
    scene.add(this.mesh);
  }

  /** Coloca la cuerda recta entre dos puntos (al lanzar). */
  reset(start, end) {
    for (let i = 0; i < SEGMENTS; i++) {
      const t = i / (SEGMENTS - 1);
      const p = start.clone().lerp(end, t);
      this.points[i].position.copy(p);
      this.points[i].previous.copy(p);
    }
  }

  /**
   * @param start   puntera de la caña
   * @param end     posición del señuelo
   * @param lineOut metros de hilo fuera del carrete
   * @param wind    viento, que curva el hilo suelto
   */
  update(dt, start, end, lineOut, wind) {
    const step = Math.min(dt, 0.033);
    const restLength = Math.max(0.05, lineOut / (SEGMENTS - 1));

    // Integración de Verlet con amortiguación.
    for (let i = 1; i < SEGMENTS - 1; i++) {
      const p = this.points[i];
      const velocity = p.position.clone().sub(p.previous).multiplyScalar(0.94);
      p.previous.copy(p.position);
      p.position.add(velocity);
      p.position.addScaledVector(LINE_GRAVITY, step * step * 0.55);
      if (wind) p.position.addScaledVector(wind, step * step * 0.35);
    }

    // Extremos fijos: puntera y señuelo.
    this.points[0].position.copy(start);
    this.points[SEGMENTS - 1].position.copy(end);

    // Relajación de distancias. Varias pasadas dan una cuerda estable.
    for (let iteration = 0; iteration < 6; iteration++) {
      for (let i = 0; i < SEGMENTS - 1; i++) {
        const a = this.points[i].position;
        const b = this.points[i + 1].position;
        const delta = b.clone().sub(a);
        const distance = delta.length();
        if (distance < 1e-5) continue;
        // Sólo tira si está estirado: una cuerda no empuja.
        const difference = (distance - restLength) / distance;
        if (difference <= 0) continue;
        const correction = delta.multiplyScalar(difference * 0.5);
        if (i > 0) a.add(correction);
        if (i + 1 < SEGMENTS - 1) b.sub(correction);
      }
      this.points[0].position.copy(start);
      this.points[SEGMENTS - 1].position.copy(end);
    }

    const array = this.geometry.attributes.position.array;
    for (let i = 0; i < SEGMENTS; i++) {
      const p = this.points[i].position;
      array[i * 3] = p.x;
      array[i * 3 + 1] = p.y;
      array[i * 3 + 2] = p.z;
    }
    this.geometry.attributes.position.needsUpdate = true;
    this.geometry.computeBoundingSphere();
  }

  /** La línea muy tensa se ve más fina y clara. */
  setTension(ratio) {
    this.material.opacity = clamp(0.5 + ratio * 0.45, 0.5, 0.98);
    this.material.color.setHSL(0.55 - ratio * 0.55, ratio * 0.7, 0.85);
  }

  setVisible(value) { this.mesh.visible = value; }

  dispose() {
    this.geometry.dispose();
    this.material.dispose();
  }
}

/* ===== src/fishing/Lure.js ===== */
/**
 * Señuelo/flotador: vuelo balístico, entrada en el agua y trabajo sumergido.
 *
 * Cada señuelo del catálogo tiene su profundidad de trabajo: la cucharilla
 * pesada baja al fondo, el popper se queda en superficie. Al recoger, sube
 * hacia su profundidad y genera "acción", que es lo que despierta a los peces.
 */

const LureState = {
  STOWED: 'stowed',
  FLYING: 'flying',
  WATER: 'water',
  LANDED: 'landed'      // en tierra: lanzamiento fallido
};

const AIR_DRAG = 0.16;
const GRAVITY_Y = -9.81;

class Lure {
  constructor(scene) {
    this.state = LureState.STOWED;
    this.position = new THREE.Vector3();
    this.velocity = new THREE.Vector3();
    this.depthTarget = 0;
    this.action = 0;          // 0..1, cuánto se está moviendo bajo el agua
    this.submergedTime = 0;

    const group = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.SphereGeometry(0.055, 10, 8),
      new THREE.MeshStandardMaterial({ color: 0xd8402c, roughness: 0.35, metalness: 0.45 })
    );
    body.scale.set(1, 1, 1.7);
    group.add(body);
    const blade = new THREE.Mesh(
      new THREE.SphereGeometry(0.04, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0xd9d2b0, roughness: 0.2, metalness: 0.9 })
    );
    blade.scale.set(0.4, 1.2, 0.9);
    blade.position.z = 0.08;
    group.add(blade);

    this.object = group;
    this.object.visible = false;
    scene.add(this.object);

    this.rig = 'senuelo';
    this.biting = false;
    this.floatDip = 0;
    this.floatObject = this._buildFloat();
    this.floatObject.visible = false;
    scene.add(this.floatObject);
  }

  /** Boya de pesca: cuerpo rojo y blanco con antena. */
  _buildFloat() {
    const group = new THREE.Group();
    const red = new THREE.MeshStandardMaterial({ color: 0xd23c28, roughness: 0.45 });
    const white = new THREE.MeshStandardMaterial({ color: 0xf0efe6, roughness: 0.5 });

    const body = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 10), red);
    body.scale.set(1, 1.5, 1);
    group.add(body);
    const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.077, 0.077, 0.05, 12), white);
    collar.position.y = 0.03;
    group.add(collar);
    const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.012, 0.3, 6), red);
    antenna.position.y = 0.24;
    group.add(antenna);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.016, 8, 6), white);
    tip.position.y = 0.39;
    group.add(tip);
    const keel = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.22, 5), white);
    keel.position.y = -0.2;
    group.add(keel);
    return group;
  }

  /** Cambia de montaje según el señuelo equipado. */
  setRig(lureItem) {
    this.rig = lureItem?.rig === 'flotador' ? 'flotador' : 'senuelo';
  }

  /** Punto del que cuelga la línea: la boya si hay montaje de flotador. */
  get lineAnchor() {
    return this.rig === 'flotador' && this.state === LureState.WATER
      ? this.floatObject.position
      : this.position;
  }

  cast(origin, direction, speed, lure) {
    this.setRig(lure);
    this.biting = false;
    this.floatDip = 0;
    this.position.copy(origin);
    this.velocity.copy(direction).normalize().multiplyScalar(speed);
    this.state = LureState.FLYING;
    this.depthTarget = lure.workingDepth;
    this.submergedTime = 0;
    this.action = 0;
    this.object.visible = true;
  }

  stow() {
    this.state = LureState.STOWED;
    this.object.visible = false;
    this.floatObject.visible = false;
    this.biting = false;
    this.floatDip = 0;
    this.action = 0;
  }

  /** El pez tiene el cebo en la boca: la boya se hunde. */
  setBiting(value) { this.biting = value; }

  get isFishable() { return this.state === LureState.WATER; }

  /**
   * @param retrieve  0..1 cuánto está recogiendo el jugador
   * @returns evento de entrada en el agua, para salpicadura y sonido
   */
  update(dt, { terrain, waterLevel, retrieve = 0, rodTip, retrieveSpeed = 1.5, wind }) {
    let event = null;

    if (this.state === LureState.FLYING) {
      this.velocity.y += GRAVITY_Y * dt;
      this.velocity.addScaledVector(this.velocity.clone().normalize(), -AIR_DRAG * this.velocity.length() * dt);
      if (wind) this.velocity.addScaledVector(wind, dt * 0.06);
      this.position.addScaledVector(this.velocity, dt);

      const bed = terrain.heightAt(this.position.x, this.position.z);
      if (this.position.y <= waterLevel && bed < waterLevel) {
        this.position.y = waterLevel;
        this.state = LureState.WATER;
        this.velocity.set(0, 0, 0);
        this.submergedTime = 0;
        event = { type: 'splash', position: this.position.clone(), strength: 1 };
      } else if (this.position.y <= bed) {
        this.position.y = bed;
        this.state = LureState.LANDED;
        this.velocity.set(0, 0, 0);
        event = { type: 'ground', position: this.position.clone() };
      }
    } else if (this.state === LureState.WATER) {
      this.submergedTime += dt;
      const bed = terrain.heightAt(this.position.x, this.position.z);
      const maxDepth = Math.max(0.15, waterLevel - bed - 0.08);

      // Hundimiento hasta su profundidad de trabajo; al recoger, sube.
      const sinkTarget = waterLevel - clamp(this.depthTarget, 0, maxDepth);
      const workTarget = waterLevel - clamp(this.depthTarget * (1 - retrieve * 0.55), 0, maxDepth);
      const target = retrieve > 0.05 ? workTarget : sinkTarget;
      const sinkRate = retrieve > 0.05 ? 3.2 : 0.55;
      this.position.y = damp(this.position.y, target, sinkRate, dt);

      if (retrieve > 0.05 && rodTip) {
        const toRod = rodTip.clone().setY(this.position.y).sub(this.position);
        const distance = toRod.length();
        if (distance > 0.01) {
          const step = Math.min(distance, retrieveSpeed * retrieve * dt);
          this.position.addScaledVector(toRod.divideScalar(distance), step);
        }
      }

      // Un señuelo se trabaja recogiendo; un cebo bajo flotador atrae quieto,
      // así que conserva una acción de fondo en vez de apagarse del todo.
      const actionTarget = this.rig === 'flotador' ? Math.max(0.4, retrieve) : retrieve;
      this.action = damp(this.action, actionTarget, 6, dt);
      this.object.rotation.z += this.action * dt * 6;
    }

    this.object.position.copy(this.position);
    if (this.state === LureState.FLYING && this.velocity.lengthSq() > 0.01) {
      this.object.lookAt(this.position.clone().add(this.velocity));
    }

    this._updateFloat(dt, waterLevel);
    return event;
  }

  /**
   * La boya flota justo encima del cebo y cabecea con el oleaje. Al picar se
   * hunde: ese es el aviso, mucho antes que cualquier texto en pantalla.
   */
  _updateFloat(dt, waterLevel) {
    const showFloat = this.rig === 'flotador' && this.state === LureState.WATER;
    this.floatObject.visible = showFloat;
    if (!showFloat) return;

    this.floatDip = damp(this.floatDip, this.biting ? 1 : 0, this.biting ? 9 : 3.5, dt);
    const t = performance.now() * 0.001;
    const bob = Math.sin(t * 1.6 + this.position.x * 0.4) * 0.03
      + Math.sin(t * 2.7 + this.position.z * 0.3) * 0.018;

    this.floatObject.position.set(
      this.position.x,
      waterLevel + bob - this.floatDip * 0.42,
      this.position.z
    );
    // Se ladea al ser arrastrada, y tiembla mientras el pez tantea el cebo.
    const tilt = this.floatDip * 0.7 + (this.biting ? Math.sin(t * 22) * 0.12 : 0);
    this.floatObject.rotation.set(tilt, 0, Math.sin(t * 1.3) * 0.06);
  }

  dispose() {
    [this.object, this.floatObject].forEach((root) => {
      root.traverse((o) => {
        if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); }
      });
      root.parent?.remove(root);
    });
  }
}

/* ===== src/fishing/Rod.js ===== */
/**
 * Caña en primera persona, animada por poses.
 *
 * No hay clips ni esqueleto: cada situación —reposo, cargando, lanzando,
 * pescando, peleando— define una pose (posición y rotación de la mano) y el
 * conjunto se interpola hacia ella con amortiguación. Así nunca hay saltos
 * entre animaciones: lo que se ve es siempre la mezcla del estado anterior y
 * el nuevo.
 *
 * Encima de la pose van capas procedurales que no dependen del estado:
 * respiración en reposo, inercia al mover la vista, el barrido del
 * lanzamiento, el bombeo al recoger y la curvatura del blank según la tensión.
 */

const RodPose = {
  IDLE: 'idle',
  CHARGE: 'charge',
  CAST: 'cast',
  FISH: 'fish',
  FIGHT: 'fight',
  STOWED: 'stowed'
};

// Posición de la mano y ángulos base de cada pose.
const POSES = {
  idle:   { pos: [0.40, -0.30, -0.42], rot: [0.20, -0.30, 0.20], lift: 0 },
  charge: { pos: [0.50, -0.26, -0.30], rot: [0.44, -0.60, 0.40], lift: 0 },
  cast:   { pos: [0.38, -0.28, -0.44], rot: [0.17, -0.26, 0.17], lift: 0 },
  fish:   { pos: [0.38, -0.28, -0.44], rot: [0.17, -0.26, 0.17], lift: 0 },
  fight:  { pos: [0.30, -0.20, -0.38], rot: [0.46, -0.18, 0.24], lift: 1 },
  // Guardada: baja y atrás, apoyada en el hombro y fuera del encuadre.
  stowed: { pos: [0.52, -0.72, -0.10], rot: [-0.75, -0.55, 0.55], lift: 0 }
};

const CAST_DURATION = 0.42;

class Rod {
  constructor(camera, equipment) {
    this.equipment = equipment;
    this.pose = RodPose.IDLE;
    this.bend = 0;
    this.sway = new THREE.Vector2();
    this.breath = 0;
    this.castTimer = 0;
    this.castPower = 0;
    this.windUp = 0;          // carga suavizada: sin esto caía de golpe al soltar
    this.reelAngle = 0;
    this.pump = 0;
    this.twitch = 0;
    this.strikeKick = 0;

    // Nodo que se interpola hacia la pose; los hijos cuelgan de él.
    this.group = new THREE.Group();
    this.current = {
      pos: new THREE.Vector3(...POSES.idle.pos),
      rot: new THREE.Vector3(...POSES.idle.rot)
    };
    this.group.position.copy(this.current.pos);
    camera.add(this.group);

    const blank = new THREE.MeshStandardMaterial({ color: 0x4a5158, roughness: 0.35, metalness: 0.35 });
    const cork = new THREE.MeshStandardMaterial({ color: 0x6b5233, roughness: 0.95 });
    const metal = new THREE.MeshStandardMaterial({ color: 0x9aa2ab, roughness: 0.28, metalness: 0.85 });
    const skin = new THREE.MeshStandardMaterial({ color: 0xd7ab84, roughness: 0.7 });
    this.materials = [blank, cork, metal, skin];
    this.material = blank;

    // Empuñadura de corcho
    const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.023, 0.027, 0.3, 10), cork);
    grip.rotation.x = Math.PI / 2;
    grip.position.z = 0.11;
    this.group.add(grip);

    // Carrete: cuerpo, bobina y manivela que gira al recoger
    const reel = new THREE.Group();
    reel.position.set(0, -0.058, 0.02);
    const housing = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.036, 0.055, 14), metal);
    housing.rotation.z = Math.PI / 2;
    reel.add(housing);
    const spool = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.03, 14), blank);
    spool.rotation.z = Math.PI / 2;
    spool.position.y = 0.04;
    reel.add(spool);
    this.crank = new THREE.Group();
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.055, 0.008), metal);
    arm.position.y = 0.028;
    this.crank.add(arm);
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.011, 8, 6), cork);
    knob.position.y = 0.056;
    this.crank.add(knob);
    this.crank.position.set(0.042, 0, 0);
    reel.add(this.crank);
    this.group.add(reel);
    this.reel = reel;

    // Antebrazo y mano sujetando la empuñadura
    const forearm = new THREE.Mesh(new THREE.CapsuleGeometry(0.028, 0.17, 4, 8), skin);
    forearm.rotation.set(1.3, 0, -0.22);
    forearm.position.set(0.05, -0.1, 0.3);
    this.group.add(forearm);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.036, 10, 8), skin);
    hand.scale.set(1, 0.8, 1.3);
    hand.position.set(0.01, -0.024, 0.13);
    this.group.add(hand);

    this._buildBlank();
    this.tip = new THREE.Object3D();
    this.group.add(this.tip);
  }

  _buildBlank() {
    this.curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0, -0.45),
      new THREE.Vector3(0, 0, -0.9),
      new THREE.Vector3(0, 0, -1.35)
    ]);
    this.blank = new THREE.Mesh(
      new THREE.TubeGeometry(this.curve, 20, 0.007, 5, false),
      this.material
    );
    this.group.add(this.blank);

    // Anillas guía a lo largo del blank
    this.guides = [];
    const guideMaterial = this.materials[2];
    [0.3, 0.62, 0.95, 1.2].forEach((t) => {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.012, 0.0022, 5, 10), guideMaterial);
      ring.rotation.y = Math.PI / 2;
      this.group.add(ring);
      this.guides.push({ mesh: ring, t });
    });
  }

  /** Cambia de pose. La transición la hace la interpolación, no un corte. */
  setPose(pose) {
    if (!POSES[pose] || this.pose === pose) return;
    if (pose === RodPose.CAST) {
      this.castTimer = CAST_DURATION;
      this.castPower = clamp(this.windUp, 0.25, 1);   // el latigazo hereda la carga
    }
    this.pose = pose;
  }

  /** Golpe seco al clavar el anzuelo. */
  strike() { this.strikeKick = 1; }
  /** Temblor de la puntera cuando el pez tantea el cebo. */
  nibble(strength = 1) { this.twitch = Math.max(this.twitch, strength); }

  /**
   * @param dt
   * @param state.tensionRatio  0..1 respecto a lo que aguanta la caña
   * @param state.retrieve      0..1 cuánto se recoge
   * @param state.sidePressure  -1..1 hacia dónde se ladea
   * @param state.power         0..1 carga del lanzamiento
   * @param state.lookDelta     movimiento de ratón, para la inercia
   * @param state.surge         0..1 el pez está embistiendo
   */
  update(dt, state = {}) {
    const {
      tensionRatio = 0, retrieve = 0, sidePressure = 0,
      power = 0, lookDelta = { x: 0, y: 0 }, surge = 0
    } = state;

    const target = POSES[this.pose] || POSES.idle;
    this.breath += dt;
    this.castTimer = Math.max(0, this.castTimer - dt);
    this.strikeKick = damp(this.strikeKick, 0, 7, dt);
    this.twitch = damp(this.twitch, 0, 5, dt);

    // --- pose base, siempre interpolada -------------------------------
    const speed = this.pose === RodPose.CAST ? 11 : 7;
    this.current.pos.x = damp(this.current.pos.x, target.pos[0], speed, dt);
    this.current.pos.y = damp(this.current.pos.y, target.pos[1], speed, dt);
    this.current.pos.z = damp(this.current.pos.z, target.pos[2], speed, dt);
    this.current.rot.x = damp(this.current.rot.x, target.rot[0], speed, dt);
    this.current.rot.y = damp(this.current.rot.y, target.rot[1], speed, dt);
    this.current.rot.z = damp(this.current.rot.z, target.rot[2], speed, dt);

    // --- capas procedurales -------------------------------------------
    // Respiración: la caña nunca está del todo quieta.
    const breathe = Math.sin(this.breath * 1.15) * 0.008 + Math.sin(this.breath * 0.7) * 0.005;
    // Inercia al girar la vista: la caña "pesa".
    this.sway.x = damp(this.sway.x, clamp(-lookDelta.x * 0.0022, -0.09, 0.09), 6, dt);
    this.sway.y = damp(this.sway.y, clamp(-lookDelta.y * 0.0022, -0.09, 0.09), 6, dt);
    // Cargar el lanzamiento echa la caña atrás. Se amortigua en lugar de leer
    // la potencia cruda: al soltar, ésta se pone a cero en un fotograma y la
    // mano daba un tirón de 5 cm.
    this.windUp = damp(this.windUp, this.pose === RodPose.CHARGE ? power : 0, 9, dt);
    const windUp = this.windUp;
    // Latigazo: la caña carga, se desdobla hacia delante y vuelve. Arranca en
    // cero, así que la transición es continua sin necesidad de mezclar poses.
    const castPhase = this.castTimer / CAST_DURATION;
    const sweep = castPhase > 0
      ? Math.sin(castPhase * Math.PI) * castPhase * this.castPower
      : 0;
    // Bombeo al recoger, más marcado cuanto más pesa el pez.
    this.pump = damp(this.pump, retrieve * (0.4 + tensionRatio), 8, dt);
    const pumping = Math.sin(this.breath * 6.5) * this.pump * 0.045;

    this.group.position.set(
      this.current.pos.x + this.sway.x * 0.6 - sweep * 0.09,
      this.current.pos.y + breathe + pumping - windUp * 0.03 + sweep * 0.04,
      this.current.pos.z - sweep * 0.22 + windUp * 0.06
    );
    this.group.rotation.set(
      this.current.rot.x + this.sway.y + breathe * 0.5 - sweep * 0.75
        + this.strikeKick * -0.5 + pumping * 1.4,
      this.current.rot.y - windUp * 0.25 + sidePressure * 0.35,
      this.current.rot.z + this.sway.x + sidePressure * 0.28
    );

    // --- curvatura del blank ------------------------------------------
    // Se dobla con la tensión, con el barrido del lance y con las embestidas.
    const targetBend = clamp(
      tensionRatio * 1.05 + sweep * 0.8 + windUp * 0.45 + surge * 0.25 + this.strikeKick * 0.6,
      0, 1.5
    );
    this.bend = damp(this.bend, targetBend, this.pose === RodPose.CAST ? 18 : 9, dt);

    const b = this.bend;
    const shiver = this.twitch * Math.sin(this.breath * 34) * 0.05;
    const points = this.curve.points;
    points[1].set(shiver * 0.2, -b * 0.04, -0.45);
    points[2].set(shiver * 0.6, -b * 0.17, -0.88);
    points[3].set(shiver, -b * 0.4, -1.3 + b * 0.07);

    // El tubo sólo se rehace cuando la forma cambia de verdad. Regenerarlo
    // cada fotograma eran 60 geometrías por segundo tiradas a la basura, y a
    // simple vista no se distingue de esta versión cuantizada.
    const shape = Math.round(b * 60) * 1000 + Math.round(shiver * 400);
    if (shape !== this._shapeKey) {
      this._shapeKey = shape;
      this.blank.geometry.dispose();
      this.blank.geometry = new THREE.TubeGeometry(this.curve, 20, 0.007, 5, false);
    }

    // Las anillas siguen la curva.
    const p = new THREE.Vector3();
    this.guides.forEach(({ mesh, t }) => {
      this.curve.getPoint(t / 1.35, p);
      mesh.position.copy(p);
    });

    this.tip.position.copy(points[3]);

    // --- carrete --------------------------------------------------------
    this.reelAngle += retrieve * dt * 11;
    this.crank.rotation.z = this.reelAngle;
    this.reel.rotation.z = Math.sin(this.reelAngle) * 0.02;
  }

  /** Puntera en coordenadas de mundo: de ahí sale la línea. */
  worldTip(out = new THREE.Vector3()) {
    return this.tip.getWorldPosition(out);
  }

  setVisible(value) { this.group.visible = value; }

  dispose() {
    this.blank.geometry.dispose();
    this.materials.forEach((m) => m.dispose());
    this.group.traverse((o) => { if (o.isMesh) o.geometry.dispose(); });
  }
}

/* ===== src/fishing/FishingSystem.js ===== */
/**
 * Sistema de pesca: lanzamiento, espera, picada, clavada y pelea.
 *
 * El modelo de tensión es el núcleo de todo:
 *
 *   tensión = rigidez · (distancia_al_pez − hilo_soltado)
 *
 * Es decir, la línea sólo tira cuando hay menos hilo fuera que distancia. De
 * ahí salen solos los tres comportamientos que se esperan de un carrete:
 *
 *  - Recoger acorta el hilo → sube la tensión.
 *  - El freno deja escapar hilo cuando la tensión lo supera → la carrera del
 *    pez se "paga" con metros, no con vida.
 *  - Demasiada holgura mantenida → el anzuelo se desprende.
 *
 * Si la tensión supera la resistencia de la línea, rompe.
 */

const FishingState = {
  IDLE: 'idle',
  AIMING: 'aiming',
  CASTING: 'casting',
  FISHING: 'fishing',
  BITE: 'bite',
  FIGHTING: 'fighting',
  LANDED: 'landed'
};

const SLACK_TOLERANCE = 1.4;      // metros de holgura antes de arriesgar el anzuelo
const SLACK_GRACE = 2.2;          // segundos de holgura que aguanta el anzuelo
const LAND_DISTANCE = 2.2;

class FishingSystem {
  constructor({ scene, camera, terrain, water, fishManager, equipment, events }) {
    this.scene = scene;
    this.camera = camera;
    this.terrain = terrain;
    this.water = water;
    this.fishManager = fishManager;
    this.equipment = equipment;
    this.events = events;

    this.rod = new Rod(camera, equipment);
    this.line = new FishingLine(scene);
    this.lure = new Lure(scene);

    this.state = FishingState.IDLE;
    this.power = 0;              // carga del lanzamiento 0..1
    this.charging = false;
    this.lineOut = 0;
    this._slipping = false;
    this.tension = 0;
    this.dragSetting = 0.45;     // 0..1 del freno máximo
    this.slackTimer = 0;
    this.hooked = null;
    this.biteTimer = 0;
    this.retrieveInput = 0;
    this.rodStowed = false;
    this.sidePressure = 0;      // -1 izquierda … +1 derecha, desde dónde apunta la caña
    this.counterPressure = 0;   // >0 si esa presión va contra la carrera del pez
    this.message = null;
    this.lastCatch = null;

    // Veto de cambios de equipo mientras hay algo en marcha.
    equipment.guard = (category) => {
      if (this.state === FishingState.FIGHTING) {
        return 'No puedes cambiar de equipo con un pez enganchado';
      }
      if (this.state !== FishingState.IDLE) {
        return category === 'lures'
          ? 'Recoge el sedal (R) antes de cambiar de señuelo'
          : 'Recoge el sedal (R) antes de cambiar de equipo';
      }
      return null;
    };

    this._rodTip = new THREE.Vector3();
    this._tmp = new THREE.Vector3();
  }

  get stats() { return this.equipment.stats; }
  get tensionRatio() { return clamp(this.tension / this.stats.lineStrength, 0, 1.4); }
  get dragForce() { return this.dragSetting * this.stats.maxDrag; }
  get canCast() { return this.state === FishingState.IDLE && !this.rodStowed; }

  /** Guardar o sacar la caña. No se puede con el aparejo fuera. */
  toggleRod() {
    if (this.state !== FishingState.IDLE) {
      this._say('Recoge el sedal antes de guardar la caña', 'bad');
      return false;
    }
    this.rodStowed = !this.rodStowed;
    this._say(this.rodStowed ? 'Caña guardada' : 'Caña lista');
    return true;
  }

  // ---------------------------------------------------------------- entrada
  beginCast() {
    // Con la caña guardada, el primer clic la saca: una sola acción para el
    // jugador, aunque por dentro sean dos estados.
    if (this.rodStowed && this.state === FishingState.IDLE) {
      this.rodStowed = false;
      return;
    }
    if (!this.canCast) return;
    this.state = FishingState.AIMING;
    this.charging = true;
    this.power = 0;
  }

  releaseCast() {
    if (this.state !== FishingState.AIMING) return;
    this.charging = false;

    const direction = new THREE.Vector3();
    this.camera.getWorldDirection(direction);
    // Se lanza algo por encima de la línea de visión, como en la realidad.
    direction.y += 0.22;
    direction.normalize();

    const distance = this.stats.castDistance * (0.25 + 0.75 * this.power);
    const speed = Math.sqrt(distance * 9.81 / Math.max(0.35, Math.sin(2 * Math.asin(clamp(direction.y, -0.99, 0.99)))));
    const launchSpeed = clamp(isFinite(speed) ? speed : 18, 6, 34);

    this.rod.worldTip(this._rodTip);
    this.lure.cast(this._rodTip, direction, launchSpeed, this.equipment.lure);
    this.line.reset(this._rodTip, this.lure.position);
    this.line.setVisible(true);
    this.lineOut = 1;
    this.tension = 0;
    this.state = FishingState.CASTING;
    this.rod.setPose(RodPose.CAST);
    this.events?.onCast?.(this.power);
    this.power = 0;
  }

  /** Clavada. Sólo sirve durante la ventana de picada. */
  strike() {
    if (this.state === FishingState.BITE) {
      const fish = this.fishManager.biting;
      if (fish) {
        fish.setState(FishState.FIGHTING);
        this.hooked = fish;
        this.state = FishingState.FIGHTING;
        this.slackTimer = 0;
        // La línea queda tensa pero sin estirar: sin esto, el desfase que
        // acumula el recogido se convertiría en un pico de tensión que rompe
        // el hilo en el mismo instante de clavar.
        this.lineOut = Math.max(this.lineOut, this._rodTip.distanceTo(fish.position) + 0.15);
        // El cebo va en la boca del pez: boya y señuelo dejan de pintarse y la
        // línea pasa a colgar directamente de él.
        this.lure.stow();
        this.fight = {
          lastDistance: this._rodTip.distanceTo(fish.position),
          hookHold: 1,
          warned: false,
          stamina: 1,
          burst: 0,
          burstTimer: 1 + Math.random() * 2,
          jumping: 0,
          runsLeft: fish.species.fight.runs
        };
        this.rod.strike();
        this.events?.onHookSet?.(fish);
        return true;
      }
    }
    if (this.state === FishingState.FISHING || this.state === FishingState.CASTING) {
      // Clavada en falso: se recoge el señuelo.
      this.reelIn('Clavada en vacío');
    }
    return false;
  }

  reelIn(reason = null) {
    // Sin esto, seguir pulsando recoger al terminar un lance hacía que el
    // siguiente se recuperase solo nada más tocar el agua.
    this.retrieveInput = 0;
    this.lure.stow();
    this.line.setVisible(false);
    if (this.hooked) this.fishManager.release(this.hooked);
    this.hooked = null;
    this.fight = null;
    this.state = FishingState.IDLE;
    this.tension = 0;
    this.lineOut = 0;
    if (reason) this._say(reason);
  }

  adjustDrag(delta) {
    this.dragSetting = clamp(this.dragSetting + delta, 0.05, 1);
  }

  setRetrieve(amount) { this.retrieveInput = clamp(amount, 0, 1); }

  _say(text, kind = 'info') {
    this.message = { text, kind, time: 0 };
    this.events?.onMessage?.(text, kind);
  }

  // ----------------------------------------------------------------- update
  update(dt, context) {
    this.rod.worldTip(this._rodTip);
    const stats = this.stats;

    if (this.charging) {
      this.power = Math.min(1, this.power + dt * 0.85);
    }

    const event = this.lure.update(dt, {
      terrain: this.terrain,
      waterLevel: this.terrain.waterLevel,
      retrieve: this.state === FishingState.FIGHTING ? 0 : this.retrieveInput,
      rodTip: this._rodTip,
      retrieveSpeed: stats.retrieveSpeed,
      wind: context.wind
    });

    if (event?.type === 'splash') {
      this.water.splash(event.position, 0.8);
      this.events?.onSplash?.(event.position);
      this.state = FishingState.FISHING;
      this.lineOut = this._rodTip.distanceTo(this.lure.position) + 0.3;
    } else if (event?.type === 'ground') {
      this._say('El señuelo ha caído en tierra');
      this.state = FishingState.FISHING;
      this.lineOut = this._rodTip.distanceTo(this.lure.position) + 0.3;
    }

    switch (this.state) {
      case FishingState.CASTING: this._updateCasting(dt); break;
      case FishingState.FISHING: this._updateFishing(dt, context); break;
      case FishingState.BITE: this._updateBite(dt, context); break;
      case FishingState.FIGHTING: this._updateFight(dt, context); break;
      default: break;
    }

    this._updateLineVisual(dt, context);
    this.rod.setPose(this._poseForState());
    this.rod.update(dt, {
      tensionRatio: clamp(this.tension / Math.max(1, stats.rodStrength), 0, 1.3),
      retrieve: this.retrieveInput,
      sidePressure: this.sidePressure,
      power: this.power,
      lookDelta: context.lookDelta,
      surge: this.fight?.burst ?? 0
    });
    // La pieza gira despacio mientras se mira.
    if (this._trophy) {
      this._trophy.spin += dt * 0.55;
      const mesh = this._trophy.fish.mesh;
      mesh.rotation.y = Math.PI / 2 + Math.sin(this._trophy.spin) * 0.5;
      mesh.rotation.z = Math.sin(this._trophy.spin * 1.7) * 0.08;
    }

    if (this.message) {
      this.message.time += dt;
      if (this.message.time > 3.5) this.message = null;
    }
  }

  /** Qué pose corresponde al estado actual de la pesca. */
  _poseForState() {
    switch (this.state) {
      case FishingState.AIMING: return RodPose.CHARGE;
      case FishingState.CASTING: return RodPose.CAST;
      case FishingState.FISHING:
      case FishingState.BITE: return RodPose.FISH;
      case FishingState.FIGHTING: return RodPose.FIGHT;
      default: return this.rodStowed ? RodPose.STOWED : RodPose.IDLE;
    }
  }

  _updateCasting() {
    this.lineOut = Math.max(this.lineOut, this._rodTip.distanceTo(this.lure.position) + 0.2);
  }

  _updateFishing(dt, context) {
    if (!this.lure.isFishable) return;

    // Recoger acorta el hilo; si llega al final, el lance ha terminado.
    if (this.retrieveInput > 0.05) {
      const toLure = this._rodTip.distanceTo(this.lure.position);
      this.lineOut = Math.max(0.6, this.lineOut - this.stats.retrieveSpeed * this.retrieveInput * dt);
      // El señuelo tarda en seguir al carrete; sin este tope el hilo "fuera"
      // se quedaría por debajo de la distancia real.
      this.lineOut = Math.max(this.lineOut, toLure);
      if (toLure < 1.4) {
        this.reelIn();
        return;
      }
    }

    this.fishManager.evaluate({
      lurePosition: this.lure.position,
      lure: this.equipment.lure,
      hour: context.hour,
      weatherModifier: context.weatherModifier,
      lureAction: this.lure.action * this.stats.lureAction,
      feeding: context.feeding
    });

    if (this.fishManager.biting) {
      this.state = FishingState.BITE;
      this.lure.setBiting(true);
      this.biteTimer = 0;
      this.water.splash(this.lure.position, 0.5);
      this.events?.onBite?.(this.fishManager.biting);
    }
  }

  _updateBite(dt) {
    this.biteTimer += dt;
    const fish = this.fishManager.biting;
    if (!fish) {
      // Lo ha soltado sin que reaccionáramos.
      this.lure.setBiting(false);
      this.state = FishingState.FISHING;
      this._say('Se ha soltado');
      return;
    }
    // Tirones visibles en el señuelo mientras el pez lo tiene en la boca.
    this.lure.position.lerp(fish.position, 0.35 * dt * 4);
    this.rod.nibble(0.6 + (fish.biteStrength ?? 0.5) * 0.6);
    this.lineOut = Math.max(0.8, this.lineOut - dt * 0.4);
  }

  _updateFight(dt, context) {
    const fish = this.hooked;
    if (!fish) { this.state = FishingState.FISHING; return; }

    const stats = this.stats;
    const f = this.fight;
    const species = fish.species;

    // --- presión lateral ---------------------------------------------------
    // Apuntar la caña a un lado del pez, y no de frente, es la técnica real
    // para cansarlo: se le obliga a nadar contra la tracción en vez de tirar
    // en línea recta. Aquí sale del propio giro de la vista, sin control nuevo.
    const toFish = fish.position.clone().sub(this._rodTip).setY(0);
    if (toFish.lengthSq() > 0.01) {
      toFish.normalize();
      const aim = new THREE.Vector3();
      this.camera.getWorldDirection(aim);
      aim.y = 0;
      if (aim.lengthSq() > 0.01) {
        aim.normalize();
        // Seno del ángulo entre a dónde apunta la caña y dónde está el pez.
        this.sidePressure = clamp(aim.x * toFish.z - aim.z * toFish.x, -1, 1);
        // ¿Va esa presión en contra del desplazamiento lateral del pez?
        const lateral = toFish.x * fish.velocity.z - toFish.z * fish.velocity.x;
        this.counterPressure = clamp(-Math.sign(lateral) * this.sidePressure, -1, 1);
      }
    }

    // --- comportamiento del pez -------------------------------------------
    f.burstTimer -= dt;
    if (f.burstTimer <= 0) {
      const wantsRun = f.runsLeft > 0 && f.stamina > 0.25 && Math.random() < 0.55 + this.tensionRatio * 0.3;
      if (wantsRun) {
        f.burst = 1;
        f.runsLeft -= 1;
        f.burstTimer = 1.2 + Math.random() * 1.8;
        this.events?.onRun?.(fish);
      } else {
        f.burst = 0;
        f.burstTimer = 0.8 + Math.random() * 1.6;
      }
      if (Math.random() < species.fight.jumpChance * 0.5 && f.stamina > 0.3) {
        f.jumping = 0.55;
        this.events?.onJump?.(fish);
      }
    }
    f.burst = damp(f.burst, f.burst > 0.5 ? 1 : 0, 4, dt);

    // Nada alejándose del pescador, con sacudidas laterales.
    const away = fish.position.clone().sub(this._rodTip).setY(0);
    if (away.lengthSq() < 0.01) away.set(1, 0, 0);
    away.normalize();
    const shake = Math.sin(context.time * 6 * species.fight.headshake) * 0.5;
    away.applyAxisAngle(new THREE.Vector3(0, 1, 0), shake);

    // El tirón crece con el peso, pero de forma sublineal: un siluro de 50 kg
    // es muchísimo más fuerte que una perca, no cien veces más.
    const power = species.strength
      * (0.5 + Math.pow(fish.weight, 0.45) * 0.7)
      * (0.5 + f.burst * 1.2)
      * (0.25 + 0.75 * f.stamina);
    const pullSpeed = species.speed * 0.42 * (0.4 + f.burst) * clamp(f.stamina, 0.12, 1);
    // La tensión frena al pez: tirar cansa a los dos.
    // Ladear la caña le tuerce la cabeza y le quita avance; acompañar su
    // carrera se lo regala. Ese es todo el valor de la técnica.
    const steerFactor = clamp(1 - this.counterPressure * 0.4, 0.6, 1.3);
    const resisted = pullSpeed * steerFactor / (1 + this.tensionRatio * 1.6);

    fish.velocity.copy(away).multiplyScalar(resisted);
    // Desvío lateral leve: se nota en la trayectoria, no en la velocidad.
    fish.velocity.addScaledVector(
      new THREE.Vector3(-away.z, 0, away.x), this.sidePressure * resisted * 0.18
    );
    if (f.jumping > 0) {
      f.jumping -= dt;
      fish.velocity.y = 2.4;                    // salto fuera del agua
    } else {
      const bed = this.terrain.heightAt(fish.position.x, fish.position.z);
      const target = clamp(this.terrain.waterLevel - 0.6, bed + 0.25, this.terrain.waterLevel - 0.15);
      fish.velocity.y = (target - fish.position.y) * 0.8;
    }
    fish.position.addScaledVector(fish.velocity, dt);
    // No se mete en la orilla: si toca fondo, gira.
    const bed = this.terrain.heightAt(fish.position.x, fish.position.z);
    if (fish.position.y < bed + 0.12) fish.position.y = bed + 0.12;

    // --- carrete y línea ---------------------------------------------------
    const distance = this._rodTip.distanceTo(fish.position);
    // Red de seguridad: ni el pez más rápido ni el jugador corriendo separan la
    // puntera del pez más de esto en un fotograma. Si la distancia da un salto
    // mayor, no ha habido un tirón: ha saltado la geometría (un
    // teletransporte, una pestaña que vuelve del segundo plano). Se reajusta el
    // hilo en vez de romperlo por un pico que el jugador no ha provocado.
    if (distance - f.lastDistance > 12 * dt + 0.35) {
      this.lineOut = clamp(distance + 0.15, 0.8, stats.capacity - 1);
      this.tension = Math.min(this.tension, this.dragForce);
    }
    f.lastDistance = distance;
    if (this.retrieveInput > 0.05) {
      // Cuanta más tensión, más cuesta recuperar hilo. Y mientras el freno
      // patina no se recupera nada: el carrete gira en vacío contra el
      // embrague. Es lo que impide ganar la pelea a base de manivela.
      const effort = this._slipping
        ? 0
        : stats.retrieveSpeed * this.retrieveInput / (1 + this.tensionRatio * 2.2);
      this.lineOut = Math.max(0.8, this.lineOut - effort * dt);
    }

    // La línea es una cuerda: si hay menos hilo fuera que distancia, el pez
    // viene hacia la caña. Cuanto más cansado, menos se resiste — y eso es lo
    // que convierte "cansarlo" en la forma de cobrarlo.
    let stretch = distance - this.lineOut;
    const netPull = this.tension - power * 0.85;
    if (stretch > 0 && netPull > 0) {
      const rate = netPull * 0.5 * (1 + (1 - f.stamina) * 2.4);
      const give = Math.min(stretch, rate * dt);
      const toRod = this._rodTip.clone().sub(fish.position).normalize();
      fish.position.addScaledVector(toRod, give);
      stretch -= give;
    }

    // El freno es un embrague: mientras la carga lo supere, el carrete cede
    // hilo y la tensión se queda clavada en el valor del freno. Lo único que
    // lo atraviesa son los picos (embestidas y saltos), y por eso apretar el
    // freno al máximo es la forma más rápida de romper la línea.
    const stiffness = lerp(9, 3.5, stats.elasticity);
    const load = Math.max(0, stretch) * stiffness
      + power * (0.55 + Math.abs(this.sidePressure) * 0.07);
    const slipping = load > this.dragForce;
    this._slipping = slipping;
    const shock = slipping ? Math.min(load - this.dragForce, load * 0.2) * (1 - stats.elasticity * 0.5) : 0;
    this.tension = damp(this.tension, Math.min(load, this.dragForce + shock), 11, dt);

    if (slipping) {
      // El freno cede hilo, pero sólo el que el pez se está llevando de
      // verdad: si soltase más que la distancia que gana, fabricaría holgura
      // de la nada y el pez se soltaría solo después de cada carrera.
      const slip = (load - this.dragForce) * 0.4;
      this.lineOut = Math.min(
        stats.capacity,
        Math.min(this.lineOut + slip * dt, distance + 0.25)
      );
      this.events?.onDragSlip?.(slip);
    }

    // El anzuelo también se cansa. Cuanto más grande es el pez para el aparejo
    // que lleva el jugador, antes abre su propio agujero y se suelta. Es lo
    // que le pone final a las peleas imposibles: con equipo de iniciación un
    // siluro de récord no rompe el hilo — se suelta — y eso es exactamente la
    // razón para ir a comprar una caña mejor.
    const overmatch = clamp(power / Math.max(0.6, this.dragForce), 0, 4);
    f.hookHold = clamp(f.hookHold - dt * 0.012 * overmatch * (0.4 + this.tensionRatio), 0, 1);
    if (!f.warned && f.hookHold < 0.35) {
      f.warned = true;
      this._say('El anzuelo empieza a ceder: cóbralo ya', 'bad');
    }
    if (f.hookHold <= 0) {
      this._loseFish(fish, 'El anzuelo ha abierto su agujero y se ha soltado');
      return;
    }

    // El pez se cansa por la tensión sostenida, y bastante más rápido si se
    // le está haciendo trabajar de costado.
    const sideBonus = clamp(1 + this.counterPressure * 0.9, 0.45, 1.9);
    const drain = (0.028 + this.tensionRatio * 0.16) * sideBonus / species.stamina;
    f.stamina = clamp(f.stamina - drain * dt, 0, 1);
    fish.energy = f.stamina;

    // --- desenlaces --------------------------------------------------------
    if (this.tension > stats.lineStrength) {
      this._breakLine(fish);
      return;
    }
    if (this.lineOut >= stats.capacity - 0.5) {
      this._breakLine(fish, 'Se acabó el hilo del carrete');
      return;
    }

    // El hilo que cede el freno no es holgura: el pez se lo está llevando.
    // Sólo cuenta como holgura si la línea se afloja sin que nadie tire.
    const slack = this.lineOut - distance;
    if (!slipping && slack > SLACK_TOLERANCE) {
      this.slackTimer += dt;
      if (this.slackTimer > SLACK_GRACE) {
        this._loseFish(fish, 'Demasiada holgura: el anzuelo se ha soltado');
        return;
      }
    } else {
      this.slackTimer = Math.max(0, this.slackTimer - dt * 1.5);
    }

    if (distance < LAND_DISTANCE && f.stamina < 0.3) {
      this._land(fish);
    }
  }

  _breakLine(fish, reason = 'La línea ha roto') {
    this.sidePressure = this.counterPressure = 0;
    this.retrieveInput = 0;
    this.events?.onLineBreak?.(fish);
    this.fishManager.release(fish);
    this.hooked = null;
    this.fight = null;
    this.lure.stow();
    this.line.setVisible(false);
    this.state = FishingState.IDLE;
    this.tension = 0;
    this._say(reason, 'bad');
  }

  _loseFish(fish, reason) {
    this.sidePressure = this.counterPressure = 0;
    this.retrieveInput = 0;
    this.events?.onFishLost?.(fish);
    this.fishManager.release(fish);
    this.hooked = null;
    this.fight = null;
    this.lure.stow();
    this.line.setVisible(false);
    this.state = FishingState.IDLE;
    this.tension = 0;
    this._say(reason, 'bad');
  }

  /**
   * Levantar la pieza.
   *
   * El pez pasa a colgar de la cámara, a la distancia justa para que quepa en
   * pantalla. No se reescala: uno de dos metros se aleja más, pero sigue
   * ocupando mucho más que uno de treinta centímetros. Eso es lo que hace que
   * el tamaño se sienta.
   */
  _showTrophy(fish) {
    const mesh = fish.mesh;
    this._trophy = { fish, parent: mesh.parent, spin: 0 };
    fish.setState(FishState.CAUGHT);
    this.camera.add(mesh);
    mesh.visible = true;
    const lengthM = fish.length / 100;
    // Encuadre a partir del campo de visión real: colocarlo con números fijos
    // dejaba a los ejemplares grandes cortados por el borde de la pantalla.
    const dist = 0.42 + lengthM * 0.85;
    const halfHeight = dist * Math.tan(THREE.MathUtils.degToRad(this.camera.fov) * 0.5);
    // Por encima del centro, para que la ficha de captura no lo tape, pero
    // dentro del cuadro.
    mesh.position.set(0, halfHeight * 0.52, -dist);
    mesh.rotation.set(0, Math.PI / 2, 0);

    // Luz propia: da igual que sea de noche o que el pez esté a contraluz.
    if (!this._trophyLight) {
      this._trophyLight = new THREE.PointLight(0xfff0d8, 0, 6, 2);
      this.camera.add(this._trophyLight);
    }
    // La luz se coloca junto al pez, no junto a la cámara: a metro y medio, con
    // caída cuadrática, apenas le llegaba nada y el ejemplar salía en sombra.
    this._trophyLight.position.set(dist * 0.5, mesh.position.y + 0.35, -dist * 0.55);
    // Con la exposición del render en su valor normal, 3.2 quemaba el pez a
    // blanco y se perdían los colores de la especie.
    this._trophyLight.intensity = 1.1;
  }

  _hideTrophy() {
    if (!this._trophy) return;
    const { fish, parent } = this._trophy;
    this.camera.remove(fish.mesh);
    parent?.add(fish.mesh);
    fish.mesh.rotation.set(0, 0, 0);
    fish.mesh.visible = false;
    if (this._trophyLight) this._trophyLight.intensity = 0;
    this._trophy = null;
  }

  _land(fish) {
    this.sidePressure = this.counterPressure = 0;
    this.retrieveInput = 0;
    this.state = FishingState.LANDED;
    this.lastCatch = fish;
    this.tension = 0;
    this.lure.stow();
    this.line.setVisible(false);
    this.water.splash(fish.position, 1.4);
    this._showTrophy(fish);
    this.events?.onLanded?.(fish);
    this.hooked = null;
    this.fight = null;
  }

  /** Se llama desde la UI cuando el jugador cierra la ficha de captura. */
  finishCatch(keep = true) {
    this._hideTrophy();
    const fish = this.lastCatch;
    this.lastCatch = null;
    this.state = FishingState.IDLE;
    if (fish) {
      if (keep) this.fishManager.remove(fish);
      else this.fishManager.release(fish);
    }
  }

  _updateLineVisual(dt, context) {
    if (!this.line.mesh.visible) return;
    const end = this.hooked ? this.hooked.position : this.lure.lineAnchor;
    const visualLineOut = this.state === FishingState.FIGHTING
      ? this.lineOut
      : Math.max(this.lineOut, this._rodTip.distanceTo(end));
    this.line.update(dt, this._rodTip, end, visualLineOut, context.wind);
    this.line.setTension(this.tensionRatio);
  }

  /** Datos para el HUD. */
  get hud() {
    return {
      state: this.state,
      power: this.power,
      tension: this.tension,
      tensionRatio: this.tensionRatio,
      lineStrength: this.stats.lineStrength,
      drag: this.dragForce,
      dragSetting: this.dragSetting,
      lineOut: this.lineOut,
      capacity: this.stats.capacity,
      lure: this.equipment.lure,
      hooked: this.hooked ? {
        name: this.hooked.displayName,
        weight: this.hooked.weight,
        stamina: this.fight?.stamina ?? 1,
        hookHold: this.fight?.hookHold ?? 1,
        sidePressure: this.sidePressure,
        counterPressure: this.counterPressure
      } : null,
      message: this.message
    };
  }

  dispose() {
    this.rod.dispose();
    this.line.dispose();
    this.lure.dispose();
  }
}

/* ===== src/player/PlayerBody.js ===== */
/**
 * Cuerpo del pescador, animado por código.
 *
 * No hay mallas con esqueleto ni clips: el cuerpo se monta como una jerarquía
 * de articulaciones —caderas, torso, cuello, hombros, codos, muslos, rodillas—
 * y cada fotograma se calculan sus ángulos a partir del estado del jugador.
 * Es animación procedural: no hay transiciones que mezclar porque nunca hay un
 * salto entre clips, sólo un ciclo continuo que cambia de amplitud y ritmo.
 *
 * Capas, de abajo a arriba:
 *   1. Ciclo de marcha (piernas y brazos, según la velocidad real).
 *   2. Postura (agachado, inclinación al girar, peso al frenar).
 *   3. Respiración y microbalanceo, para que el reposo no sea una estatua.
 *   4. Pose de los brazos según lo que hacen las manos (sujetar la caña).
 */

const SKIN = 0xd7ab84;
const COAT = 0x2c4a5e;
const TROUSERS = 0x3a4048;
const HAT = 0x7a6a3c;

function limb(material, radius, length) {
  const mesh = new THREE.Mesh(new THREE.CapsuleGeometry(radius, length, 4, 8), material);
  mesh.position.y = -length / 2 - radius * 0.5;   // cuelga de la articulación
  mesh.castShadow = true;
  return mesh;
}

class PlayerBody {
  constructor() {
    this.root = new THREE.Group();
    this.root.visible = false;

    const skin = new THREE.MeshStandardMaterial({ color: SKIN, roughness: 0.75 });
    const coat = new THREE.MeshStandardMaterial({ color: COAT, roughness: 0.86 });
    const trousers = new THREE.MeshStandardMaterial({ color: TROUSERS, roughness: 0.9 });
    const hat = new THREE.MeshStandardMaterial({ color: HAT, roughness: 0.92 });
    this.materials = [skin, coat, trousers, hat];

    // --- caderas y torso ---------------------------------------------
    this.hips = new THREE.Group();
    this.hips.position.y = 0.92;
    this.root.add(this.hips);

    this.torso = new THREE.Group();
    this.hips.add(this.torso);
    const chest = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.42, 4, 10), coat);
    chest.position.y = 0.26;
    chest.castShadow = true;
    this.torso.add(chest);
    this.chest = chest;

    // --- cuello y cabeza ----------------------------------------------
    this.neck = new THREE.Group();
    this.neck.position.y = 0.55;
    this.torso.add(this.neck);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.135, 14, 12), skin);
    head.castShadow = true;
    this.neck.add(head);
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.022, 14), hat);
    brim.position.y = 0.075;
    this.neck.add(brim);
    const crown = new THREE.Mesh(new THREE.SphereGeometry(0.128, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), hat);
    crown.position.y = 0.078;
    this.neck.add(crown);

    // --- brazos --------------------------------------------------------
    this.arms = {};
    for (const side of ['L', 'R']) {
      const sign = side === 'L' ? -1 : 1;
      const shoulder = new THREE.Group();
      shoulder.position.set(sign * 0.23, 0.44, 0);
      this.torso.add(shoulder);
      shoulder.add(limb(coat, 0.055, 0.26));

      const elbow = new THREE.Group();
      elbow.position.y = -0.33;
      shoulder.add(elbow);
      elbow.add(limb(skin, 0.048, 0.24));

      this.arms[side] = { shoulder, elbow };
    }

    // --- caña en la mano derecha ---------------------------------------
    // En tercera persona el modelo de primera persona se oculta, así que sin
    // esto el pescador aparecía haciendo el gesto de sujetar la caña con las
    // manos vacías.
    this.heldRod = new THREE.Group();
    this.heldRod.position.set(0, -0.3, 0.02);       // en el puño
    this.heldRod.rotation.set(2.15, 0, -0.25);      // vertical, como se lleva al andar
    const rodMat = new THREE.MeshStandardMaterial({ color: 0x23272c, roughness: 0.45 });
    const blank = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.017, 2.15, 6), rodMat);
    blank.position.y = 1.0;
    blank.castShadow = true;
    this.heldRod.add(blank);
    const grip = new THREE.Mesh(
      new THREE.CylinderGeometry(0.021, 0.019, 0.22, 8),
      new THREE.MeshStandardMaterial({ color: 0xb08b52, roughness: 0.85 })
    );
    grip.position.y = -0.06;
    this.heldRod.add(grip);
    const spool = new THREE.Mesh(
      new THREE.CylinderGeometry(0.045, 0.045, 0.05, 10),
      new THREE.MeshStandardMaterial({ color: 0x8d939a, roughness: 0.4, metalness: 0.5 })
    );
    spool.rotation.z = Math.PI / 2;
    spool.position.set(0.05, 0.07, 0);
    this.heldRod.add(spool);
    this.arms.R.elbow.add(this.heldRod);

    // --- piernas -------------------------------------------------------
    this.legs = {};
    for (const side of ['L', 'R']) {
      const sign = side === 'L' ? -1 : 1;
      const hip = new THREE.Group();
      hip.position.set(sign * 0.11, 0, 0);
      this.hips.add(hip);
      hip.add(limb(trousers, 0.075, 0.34));

      const knee = new THREE.Group();
      knee.position.y = -0.42;
      hip.add(knee);
      knee.add(limb(trousers, 0.062, 0.32));

      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.06, 0.24), coat);
      foot.position.set(0, -0.42, 0.05);
      foot.castShadow = true;
      knee.add(foot);

      this.legs[side] = { hip, knee, foot };
    }

    this.phase = 0;
    this.stride = 0;
    this.crouch = 0;
    this.breath = 0;
    this.armPose = 0;      // 0 brazos sueltos, 1 sujetando la caña
    this.lastFootDown = { L: false, R: false };
  }

  setVisible(value) { this.root.visible = value; }

  /**
   * @param state.speed      velocidad horizontal en m/s
   * @param state.running    si va corriendo
   * @param state.turnRate   giro en rad/s, para que el torso lidere
   * @param state.crouch     0..1
   * @param state.holdingRod 0..1, brazos en posición de caña
   * @param state.onFoot     falso a bordo de la barca: no hay ciclo de marcha
   * @returns {'L'|'R'|null} pie que acaba de apoyarse, para el sonido de paso
   */
  update(dt, state = {}) {
    const {
      speed = 0, running = false, turnRate = 0,
      crouch = 0, holdingRod = 1, onFoot = true
    } = state;

    this.breath += dt;
    this.crouch = damp(this.crouch, crouch, 8, dt);
    this.armPose = damp(this.armPose, holdingRod, 6, dt);

    // --- 1. ciclo de marcha --------------------------------------------
    // La zancada crece con la velocidad; la cadencia, algo menos, para que
    // correr sean pasos más largos y no sólo más rápidos.
    const target = onFoot ? clamp(speed / 3.1, 0, 1.9) : 0;
    this.stride = damp(this.stride, target, 9, dt);
    const cadence = onFoot ? (1.9 + Math.sqrt(Math.max(speed, 0)) * 1.5) : 0;
    this.phase += dt * cadence;

    const swing = Math.sin(this.phase);
    const swingB = Math.sin(this.phase + Math.PI);
    const amp = this.stride * 0.52;

    let stepped = null;
    for (const [side, sign] of [['L', 1], ['R', -1]]) {
      const s = sign > 0 ? swing : swingB;
      const leg = this.legs[side];
      leg.hip.rotation.x = s * amp - this.crouch * 0.5;
      // La rodilla sólo dobla cuando la pierna va hacia atrás o al elevarla.
      const bend = Math.max(0, -s) * amp * 1.5 + Math.max(0, Math.sin(this.phase * 2 + (sign > 0 ? 0 : Math.PI))) * amp * 0.35;
      leg.knee.rotation.x = bend + this.crouch * 1.0;
      leg.foot.rotation.x = -leg.hip.rotation.x * 0.4 - leg.knee.rotation.x * 0.5;

      // Momento en que el pie toca el suelo: sirve para el sonido de paso.
      const down = s < -0.85;
      if (down && !this.lastFootDown[side] && this.stride > 0.25) stepped = side;
      this.lastFootDown[side] = down;
    }

    // --- 2. postura -----------------------------------------------------
    // Las caderas suben y bajan con cada paso y bajan al agacharse.
    const bounce = Math.abs(Math.sin(this.phase)) * this.stride * 0.035;
    this.hips.position.y = 0.92 - this.crouch * 0.32 - bounce;
    this.hips.rotation.y = swing * this.stride * 0.09;      // la pelvis rota al andar
    this.hips.rotation.z = clamp(-turnRate * 0.12, -0.12, 0.12);

    // El torso contrarresta a la pelvis y se inclina hacia delante al correr.
    this.torso.rotation.y = -this.hips.rotation.y * 0.7;
    this.torso.rotation.x = this.stride * (running ? 0.14 : 0.06) + this.crouch * 0.35;
    this.torso.rotation.z = clamp(turnRate * 0.16, -0.18, 0.18);

    // --- 3. respiración y microbalanceo ---------------------------------
    const idle = 1 - clamp(this.stride, 0, 1);
    const breathe = Math.sin(this.breath * 1.25) * 0.02 * idle;
    this.chest.scale.set(1 + breathe * 0.4, 1 + breathe, 1 + breathe * 0.4);
    this.torso.rotation.x += breathe * 0.5 + Math.sin(this.breath * 0.43) * 0.012 * idle;
    this.torso.rotation.z += Math.sin(this.breath * 0.37) * 0.016 * idle;
    this.neck.rotation.x = -this.torso.rotation.x * 0.6 + Math.sin(this.breath * 0.6) * 0.02 * idle;

    // --- 4. brazos --------------------------------------------------------
    // Mezcla entre brazos sueltos (balanceo de marcha) y sujetando la caña.
    const free = 1 - this.armPose;
    const swingArm = swingB * amp * 0.75 * free;
    const swingArmB = swing * amp * 0.75 * free;

    // Mano derecha en la empuñadura, izquierda en el carrete.
    this.arms.R.shoulder.rotation.set(-1.05 * this.armPose + swingArm, -0.32 * this.armPose, -0.3 * this.armPose);
    this.arms.R.elbow.rotation.set(-1.15 * this.armPose - Math.max(0, swingArm) * 0.6, 0, 0);
    this.arms.L.shoulder.rotation.set(-0.85 * this.armPose + swingArmB, 0.42 * this.armPose, 0.34 * this.armPose);
    this.arms.L.elbow.rotation.set(-1.35 * this.armPose - Math.max(0, swingArmB) * 0.6, 0, 0);

    // La caña aparece con la pose: guardada, la mano queda libre.
    this.heldRod.visible = this.armPose > 0.08;
    this.heldRod.scale.setScalar(clamp(this.armPose, 0.001, 1));

    return stepped;
  }

  dispose() {
    this.root.traverse((o) => { if (o.isMesh) o.geometry.dispose(); });
    this.materials.forEach((m) => m.dispose());
  }
}

/* ===== src/player/Player.js ===== */
/**
 * Jugador en primera persona.
 *
 * La cámara vive dentro de un "rig" para dejar preparada la tercera persona:
 * basta con alejar `camera` del pivote y añadir un modelo visible; el resto
 * del control no cambia. El movimiento sigue el terreno de forma analítica
 * (sin física de cuerpos) y sólo lanza un rayo hacia abajo para subirse al
 * muelle y demás construcciones.
 */

const EYE_HEIGHT = 1.68;
const WALK_SPEED = 3.1;
const RUN_SPEED = 5.6;
const WADE_DEPTH = 1.05;

class Player {
  constructor(camera, terrain, { spawn = new THREE.Vector3(0, 0, 0), walkables = [] } = {}) {
    this.terrain = terrain;
    this.camera = camera;
    this.walkables = walkables;

    this.rig = new THREE.Object3D();
    this.rig.position.copy(spawn);
    this.rig.add(camera);
    camera.position.set(0, EYE_HEIGHT, 0);

    this.yaw = 0;
    this.pitch = 0;
    this.velocity = new THREE.Vector3();
    this.grounded = true;
    this.bobPhase = 0;
    this.bobAmount = 0;
    this.surface = 'tierra';
    this.mode = 'first';          // 'first' | 'third'
    this.onModeChange = null;     // lo engancha Game para ocultar la caña de mano
    this.thirdPersonDistance = 3.4;

    this.platform = null;            // barca u otra plataforma móvil
    this.crouch = 0;
    this.bodyRig = new PlayerBody();
    this.body = this.bodyRig.root;
    this.rig.add(this.body);

    this._raycaster = new THREE.Raycaster();
    this._down = new THREE.Vector3(0, -1, 0);
    this._forward = new THREE.Vector3();
    this._right = new THREE.Vector3();
    this.lookDelta = new THREE.Vector2();
    this.lean = 0;
    this.lastYaw = 0;
  }

  get position() { return this.rig.position; }

  /** Sube o baja de una plataforma móvil (la barca). */
  setPlatform(platform) {
    this.platform = platform;
    if (platform) platform.board(); 
  }

  /** Altura pisable: terreno o cualquier estructura por encima (muelle, barca). */
  groundHeight(x, z) {
    const terrainY = this.terrain.heightAt(x, z);
    if (!this.walkables.length) return { y: terrainY, surface: 'tierra' };

    this._raycaster.set(new THREE.Vector3(x, terrainY + 6, z), this._down);
    this._raycaster.far = 8;
    const hits = this._raycaster.intersectObjects(this.walkables, true);
    if (hits.length && hits[0].point.y > terrainY + 0.15) {
      return { y: hits[0].point.y, surface: 'madera' };
    }
    return { y: terrainY, surface: terrainY < this.terrain.waterLevel ? 'agua' : 'tierra' };
  }

  look(dx, dy, sensitivity = 1, invertY = false) {
    this.lookDelta.set(dx, dy);
    this.yaw -= dx * 0.0022 * sensitivity;
    this.pitch -= dy * 0.0022 * sensitivity * (invertY ? -1 : 1);
    this.pitch = clamp(this.pitch, -Math.PI / 2 + 0.05, Math.PI / 2 - 0.05);
  }

  update(dt, input) {
    if (this.platform) return this._updateOnPlatform(dt, input);
    const forwardInput = (input.isDown('KeyW') ? 1 : 0) - (input.isDown('KeyS') ? 1 : 0);
    const strafeInput = (input.isDown('KeyD') ? 1 : 0) - (input.isDown('KeyA') ? 1 : 0);
    const running = input.isDown('ShiftLeft') || input.isDown('ShiftRight');
    const crouching = input.isDown('ControlLeft') || input.isDown('KeyC');
    this.crouch = damp(this.crouch, crouching ? 1 : 0, 9, dt);

    this._forward.set(Math.sin(this.yaw), 0, Math.cos(this.yaw)).multiplyScalar(-1);
    this._right.set(this._forward.z, 0, -this._forward.x);

    const wish = new THREE.Vector3()
      .addScaledVector(this._forward, forwardInput)
      .addScaledVector(this._right, strafeInput);
    if (wish.lengthSq() > 0) wish.normalize();

    const depth = this.terrain.depthAt(this.rig.position.x, this.rig.position.z);
    // Andar dentro del agua cuesta; a partir de cierto calado no se avanza.
    const wadeFactor = depth > 0 ? clamp(1 - depth / WADE_DEPTH, 0.25, 1) : 1;
    // Agachado se anda despacio, pero se pesca sin espantar tanto al pez.
    const speed = (running ? RUN_SPEED : WALK_SPEED) * wadeFactor * (1 - this.crouch * 0.55);

    this.velocity.x = damp(this.velocity.x, wish.x * speed, 12, dt);
    this.velocity.z = damp(this.velocity.z, wish.z * speed, 12, dt);

    const next = this.rig.position.clone().addScaledVector(this.velocity, dt);
    const ground = this.groundHeight(next.x, next.z);
    const nextDepth = this.terrain.waterLevel - ground.y;

    // Bloqueo suave: no se entra a nadar.
    if (ground.surface === 'agua' && nextDepth > WADE_DEPTH) {
      this.velocity.multiplyScalar(0.1);
    } else {
      this.rig.position.x = next.x;
      this.rig.position.z = next.z;
    }

    const target = this.groundHeight(this.rig.position.x, this.rig.position.z);
    this.surface = target.surface;
    this.rig.position.y = damp(this.rig.position.y, target.y, 14, dt);

    // Balanceo de cabeza proporcional a la velocidad real.
    const horizontalSpeed = Math.hypot(this.velocity.x, this.velocity.z);
    this.stepping = horizontalSpeed > 0.6;
    this.bobPhase += dt * horizontalSpeed * 2.1;
    this.bobAmount = damp(this.bobAmount, clamp(horizontalSpeed / RUN_SPEED, 0, 1), 6, dt);

    const bobY = Math.sin(this.bobPhase * 2) * 0.035 * this.bobAmount;
    const bobX = Math.cos(this.bobPhase) * 0.028 * this.bobAmount;

    // Inclinación: al desplazarse de lado y al girar, el cuerpo se ladea. Es
    // lo que separa "una cámara que se traslada" de "alguien andando".
    const strafeLean = -strafeInput * 0.022 * clamp(horizontalSpeed / RUN_SPEED, 0, 1);
    let turnDelta = this.yaw - this.lastYaw;
    while (turnDelta > Math.PI) turnDelta -= Math.PI * 2;
    while (turnDelta < -Math.PI) turnDelta += Math.PI * 2;
    this.lastYaw = this.yaw;
    const turnLean = clamp(turnDelta * 0.5, -0.03, 0.03);
    this.lean = damp(this.lean, strafeLean + turnLean, 7, dt);

    this.rig.rotation.y = this.yaw;
    this.camera.rotation.set(this.pitch, 0, bobX * 0.35 + this.lean);

    let back = 0;
    if (this.mode === 'third') {
      // La cámara se acerca al jugador si el terreno se interpone, en vez de
      // meterse dentro de la ladera.
      back = this.thirdPersonDistance;
      const behind = new THREE.Vector3(0, EYE_HEIGHT, back).applyAxisAngle(
        new THREE.Vector3(0, 1, 0), this.yaw
      ).add(this.rig.position);
      const ground = this.terrain.heightAt(behind.x, behind.z) + 0.6;
      if (behind.y < ground) {
        const room = clamp((behind.y - this.rig.position.y) / Math.max(0.01, ground - this.rig.position.y), 0.25, 1);
        back = this.thirdPersonDistance * room;
      }
      this.thirdPersonCurrent = damp(this.thirdPersonCurrent ?? back, back, 8, dt);
      back = this.thirdPersonCurrent;
    }

    this.camera.position.set(
      this.mode === 'third' ? 0 : bobX * 0.5,
      EYE_HEIGHT - this.crouch * 0.45 + bobY,
      back
    );

    // El cuerpo se anima siempre: en primera persona está oculto, pero al
    // cambiar de cámara ya está en la pose correcta en vez de arrancar de cero.
    this.stepped = this.bodyRig.update(dt, {
      speed: horizontalSpeed,
      running,
      turnRate: turnDelta / Math.max(dt, 1e-3),
      crouch: this.crouch,
      holdingRod: this.holdingRod ?? 1,
      onFoot: !this.platform
    });

    this.lookDelta.multiplyScalar(0.82);
    return {
      speed: horizontalSpeed,
      surface: this.surface,
      depth: Math.max(0, depth),
      stepped: this.stepped,
      crouch: this.crouch
    };
  }

  /** Embarcado: rema en vez de andar, y la vista sigue al asiento. */
  _updateOnPlatform(dt, input) {
    const seat = this.platform.seatPosition();
    this.rig.position.copy(seat);
    this.rig.rotation.y = this.yaw;

    const bob = Math.sin(this.bobPhase) * 0.012;
    this.bobPhase += dt * 1.6;
    this.camera.rotation.set(this.pitch, 0, 0);
    this.camera.position.set(
      0,
      EYE_HEIGHT * 0.62 + bob,
      this.mode === 'third' ? this.thirdPersonDistance : 0
    );
    this.surface = 'barca';
    this.bodyRig.update(dt, {
      speed: 0, running: false, turnRate: 0,
      crouch: 0.55, holdingRod: this.holdingRod ?? 1, onFoot: false
    });
    this.lookDelta.multiplyScalar(0.82);
    return { speed: Math.abs(this.platform.speed), surface: 'barca', depth: 0, stepped: null, crouch: 0.55 };
  }

  /** Alterna primera y tercera persona; el cuerpo sólo se ve en la segunda. */
  setCameraMode(mode) {
    this.mode = mode === 'third' ? 'third' : 'first';
    this.bodyRig.setVisible(this.mode === 'third');
    // El modelo de primera persona y el cuerpo no pueden verse a la vez. Vivía
    // en el manejador de teclas, así que cualquier otra vía de cambio de cámara
    // dejaba las dos cañas en pantalla.
    this.onModeChange?.(this.mode);
  }

  teleport(position) {
    this.rig.position.copy(position);
    const g = this.groundHeight(position.x, position.z);
    this.rig.position.y = g.y;
  }
}

/* ===== src/player/CameraFx.js ===== */
/**
 * Efectos de cámara: sacudidas, tirones y campo de visión.
 *
 * Todo entra como impulsos que decaen, nunca como valores fijos, de modo que
 * la cámara siempre vuelve sola a su sitio y no se acumulan desvíos. Se aplica
 * después del control del jugador, así que no interfiere con la puntería.
 */
class CameraFx {
  constructor(camera, { baseFov = 70 } = {}) {
    this.camera = camera;
    this.baseFov = baseFov;
    this.shake = 0;
    this.fovKick = 0;
    this.pull = { x: 0, y: 0 };
    this.roll = 0;
    this._t = 0;
  }

  setBaseFov(fov) { this.baseFov = fov; }

  /** Sacudida breve: rotura de línea, clavada fuerte, trueno. */
  addShake(amount) { this.shake = Math.min(1.2, this.shake + amount); }
  /** Cambio momentáneo de campo de visión: el lance «abre» la vista. */
  addFovKick(amount) { this.fovKick += amount; }
  /** Tirón sostenido: el pez arrastra la vista hacia su carrera. */
  setPull(x, y) { this.pull.x = x; this.pull.y = y; }
  /** Inclinación lateral: presión de la caña en la pelea. */
  setRoll(amount) { this.roll = amount; }

  update(dt) {
    this._t += dt;
    this.shake = damp(this.shake, 0, 4.5, dt);
    this.fovKick = damp(this.fovKick, 0, 5, dt);

    // Ruido de dos frecuencias: una sacudida limpia se nota artificial.
    const s = this.shake * this.shake;
    const nx = (Math.sin(this._t * 47) * 0.6 + Math.sin(this._t * 23.3) * 0.4) * s * 0.035;
    const ny = (Math.cos(this._t * 41) * 0.6 + Math.cos(this._t * 19.7) * 0.4) * s * 0.03;

    this.camera.rotation.x += ny + this.pull.y;
    this.camera.rotation.y += nx + this.pull.x;
    this.camera.rotation.z += this.roll + nx * 0.5;

    const fov = this.baseFov + this.fovKick;
    if (Math.abs(this.camera.fov - fov) > 0.01) {
      this.camera.fov = fov;
      this.camera.updateProjectionMatrix();
    }
  }
}

/* ===== src/ui/Coach.js ===== */
/**
 * Avisos de aprendizaje.
 *
 * El juego tiene bastantes sistemas y ninguno se explica solo. Estos avisos
 * salen una única vez, en el momento en que hacen falta, y se recuerdan en la
 * partida guardada para no repetirse nunca más.
 *
 * Cada aviso es una condición sobre el estado del juego, no una secuencia
 * fija: si alguien engancha un pez antes de leer nada, el consejo de la pelea
 * le llega igual.
 */

const TIPS = [
  {
    id: 'picada',
    when: (s) => s.fishingState === 'bite',
    text: 'Clic izquierdo AHORA para clavar — la ventana es de poco más de un segundo.'
  },
  {
    id: 'pelea',
    when: (s) => s.fishingState === 'fighting',
    text: 'Recoge con clic derecho, pero suelta cuando la tensión suba. Ladea la caña a un costado del pez para cansarlo.'
  },
  {
    id: 'freno',
    when: (s) => s.lastEvent === 'lineBreak',
    text: 'La línea ha reventado: baja el freno con la rueda del ratón para que ceda hilo antes de romper.'
  },
  {
    id: 'holgura',
    when: (s) => s.lastEvent === 'fishLost',
    text: 'Se soltó el anzuelo: si dejas demasiada holgura, el pez se libera. Mantén algo de tensión.'
  },
  {
    id: 'vender',
    when: (s) => s.lastEvent === 'landed',
    text: 'Cobrado. Con B abres la tienda: mejores cañas llegan más lejos y mejores líneas aguantan más.'
  },
  {
    id: 'cebo',
    when: (s) => s.casts >= 4 && s.landed === 0,
    text: 'Prueba otro señuelo (Tab): cada especie tiene sus preferencias y su profundidad.'
  },
  {
    id: 'barca',
    when: (s) => s.nearBoat,
    text: 'Con E subes a la barca. Los peces de fondo, como el siluro, no pican desde la orilla.'
  },
  {
    id: 'zonas',
    when: (s) => s.money >= 2500,
    text: 'Ya te llega para otra zona de pesca: pulsa Z.'
  },
  {
    id: 'flotador',
    when: (s) => s.rig === 'flotador' && s.fishingState === 'fishing',
    text: 'Montaje de flotador: no hace falta recoger. Espera y vigila la boya — se hundirá al picar.'
  }
];

const DISPLAY_SECONDS = 7;

class Coach {
  constructor(seen = []) {
    this.seen = new Set(seen);
    this.current = null;
    this.timer = 0;
    this.enabled = true;
  }

  /** Devuelve el texto de un aviso nuevo, o null. */
  check(state, dt) {
    if (this.current) {
      this.timer -= dt;
      if (this.timer <= 0) this.current = null;
      return null;
    }
    if (!this.enabled) return null;

    for (const tip of TIPS) {
      if (this.seen.has(tip.id)) continue;
      if (!tip.when(state)) continue;
      this.seen.add(tip.id);
      this.current = tip.text;
      this.timer = DISPLAY_SECONDS;
      return tip.text;
    }
    return null;
  }

  get text() { return this.current; }

  toJSON() { return [...this.seen]; }
}
