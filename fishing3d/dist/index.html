const el = (tag, className, html) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (html !== undefined) node.innerHTML = html;
  return node;
};

class UI {
  constructor(callbacks = {}) {
    this.cb = callbacks;
    this.openPanel = null;
    this.shopTab = 'rods';
    this.gearTab = 'rods';

    const style = document.createElement('style');
    style.textContent = CSS;
    document.head.appendChild(style);

    this.root = el('div', 'sw-root');
    document.body.appendChild(this.root);

    this.crosshair = el('div', 'sw-crosshair');
    this.root.appendChild(this.crosshair);

    this.topbar = el('div', 'sw-topbar');
    this.chips = {
      time: this._chip('Hora', '07:30'),
      weather: this._chip('Tiempo', 'Despejado'),
      money: this._chip('Monedas', '60')
    };
    this.chips.money.classList.add('sw-money');
    Object.values(this.chips).forEach((c) => this.topbar.appendChild(c));
    this.root.appendChild(this.topbar);

    this.gearBox = el('div', 'sw-gear');
    this.root.appendChild(this.gearBox);

    this.tensionBox = el('div', 'sw-tension');
    this.tensionBox.innerHTML = `
      <div class="label"><span>Tensión</span><b class="t-val">0.0 kg</b></div>
      <div class="sw-bar"><i class="t-fill"></i><div class="mark"></div></div>
      <div class="sub">
        <div class="label"><span>Freno</span><b class="d-val">1.4 kg</b></div>
        <div class="sw-bar"><i class="d-fill" style="background:var(--warn)"></i></div>
      </div>
      <div class="sub">
        <div class="label"><span>Hilo fuera</span><b class="l-val">0 m</b></div>
      </div>
      <div class="sub fight-only">
        <div class="label"><span>Pez agotado</span><b class="f-val">0 %</b></div>
        <div class="sw-bar"><i class="f-fill" style="background:var(--good)"></i></div>
      </div>
      <div class="sub fight-only">
        <div class="label"><span>Anzuelo</span><b class="h-val">100 %</b></div>
        <div class="sw-bar"><i class="h-fill" style="background:var(--good)"></i></div>
      </div>`;
    this.root.appendChild(this.tensionBox);

    this.prompt = el('div', 'sw-prompt');
    this.root.appendChild(this.prompt);

    this.hint = el('div', 'sw-hintline');
    this.root.appendChild(this.hint);

    this.coachBox = el('div', 'sw-coach');
    this.coachBox.style.display = 'none';
    this.root.appendChild(this.coachBox);

    this.fpsBox = el('div', 'sw-fps');
    this.fpsBox.style.display = 'none';
    this.root.appendChild(this.fpsBox);

    this.fadeBox = el('div', 'sw-fade');
    this.root.appendChild(this.fadeBox);

    this.toast = el('div', 'sw-toast');
    this.toast.style.display = 'none';
    this.root.appendChild(this.toast);
  }

  _chip(key, value) {
    const chip = el('div', 'sw-chip');
    chip.innerHTML = `<span class="k">${key}</span><b>${value}</b>`;
    return chip;
  }

  setChip(name, value) {
    const b = this.chips[name]?.querySelector('b');
    if (b && b.textContent !== String(value)) b.textContent = value;
  }

  // ------------------------------------------------------------------ HUD
  update(data) {
    const { fishing, time, weather, money, equipment, hint = '' } = data;
    if (this.hint.textContent !== hint) this.hint.textContent = hint;
    this.setChip('time', time.label);
    this.setChip('weather', weather.label);
    this.setChip('money', money);

    const s = equipment.stats;
    this.gearBox.innerHTML = `
      <h4>Montaje</h4>
      <div class="row"><span>${equipment.rod.name}</span><span>${s.castDistance.toFixed(0)} m</span></div>
      <div class="row"><span>${equipment.reel.name}</span><span>freno ${s.maxDrag.toFixed(1)} kg</span></div>
      <div class="row"><span>${equipment.line.name}</span><span>${s.lineStrength.toFixed(1)} kg</span></div>
      <div class="row"><span>${equipment.lure.name}</span><span>${equipment.lure.workingDepth.toFixed(1)} m</span></div>`;

    const hud = fishing;
    // El panel de tensión sólo importa con el aparejo fuera. En reposo estorba.
    const relevante = hud.state !== FishingState.IDLE && hud.state !== FishingState.AIMING;
    const quiere = relevante ? 'block' : 'none';
    if (this.tensionBox.style.display !== quiere) this.tensionBox.style.display = quiere;
    if (!relevante) { this._updatePrompt(hud); this._updateToast(hud.message); return; }

    const ratio = clamp(hud.tensionRatio, 0, 1);
    const fill = this.tensionBox.querySelector('.t-fill');
    fill.style.width = `${ratio * 100}%`;
    fill.style.background = ratio > 0.82 ? 'var(--bad)' : ratio > 0.55 ? 'var(--warn)' : 'var(--good)';
    this.tensionBox.querySelector('.t-val').textContent = `${hud.tension.toFixed(1)} kg`;
    this.tensionBox.querySelector('.mark').style.left =
      `${clamp(hud.drag / Math.max(0.1, hud.lineStrength), 0, 1) * 100}%`;
    this.tensionBox.querySelector('.d-fill').style.width = `${hud.dragSetting * 100}%`;
    this.tensionBox.querySelector('.d-val').textContent = `${hud.drag.toFixed(1)} kg`;
    this.tensionBox.querySelector('.l-val').textContent =
      `${hud.lineOut.toFixed(0)} / ${hud.capacity} m`;

    // Durante la pelea el jugador necesita ver las dos cuentas atrás que
    // deciden el desenlace: lo que le queda al pez y lo que le queda al
    // anzuelo. Sin esto, perder una captura parece arbitrario.
    const luchando = hud.state === FishingState.FIGHTING && hud.hooked;
    const verPelea = luchando ? 'block' : 'none';
    this.tensionBox.querySelectorAll('.fight-only').forEach((n) => {
      if (n.style.display !== verPelea) n.style.display = verPelea;
    });
    if (luchando) {
      const cansancio = clamp(1 - hud.hooked.stamina, 0, 1);
      const fFill = this.tensionBox.querySelector('.f-fill');
      fFill.style.width = `${cansancio * 100}%`;
      fFill.style.background = cansancio > 0.7 ? 'var(--good)' : 'var(--warn)';
      this.tensionBox.querySelector('.f-val').textContent = `${Math.round(cansancio * 100)} %`;

      const hold = clamp(hud.hooked.hookHold ?? 1, 0, 1);
      const hFill = this.tensionBox.querySelector('.h-fill');
      hFill.style.width = `${hold * 100}%`;
      hFill.style.background = hold < 0.35 ? 'var(--bad)' : hold < 0.65 ? 'var(--warn)' : 'var(--good)';
      this.tensionBox.querySelector('.h-val').textContent = `${Math.round(hold * 100)} %`;
    }

    this._updatePrompt(hud);
    this._updateToast(hud.message);
    if (data.fps !== undefined) {
      this.fpsBox.style.display = 'block';
      this.fpsBox.textContent = `${data.fps} fps · ${data.quality}`;
    } else if (this.fpsBox.style.display !== 'none') {
      this.fpsBox.style.display = 'none';
    }
  }

  _updatePrompt(hud) {
    let html = '';
    switch (hud.state) {
      case FishingState.IDLE:
        html = `<div class="small">Mantén <b>clic izquierdo</b> para cargar el lanzamiento</div>`;
        break;
      case FishingState.AIMING:
        html = `<div class="small">Suelta para lanzar</div>
                <div class="sw-power"><i style="width:${hud.power * 100}%"></i></div>`;
        break;
      case FishingState.CASTING:
        html = `<div class="small">…</div>`;
        break;
      case FishingState.FISHING:
        html = `<div class="small">Mantén <b>clic derecho</b> para recoger · rueda para el freno</div>`;
        break;
      case FishingState.BITE:
        html = `<div class="big bite">¡PICADA!</div><div class="small">Clic izquierdo para clavar</div>`;
        break;
      case FishingState.FIGHTING: {
        const h = hud.hooked;
        const counter = h?.counterPressure ?? 0;
        const side = h?.sidePressure ?? 0;
        let tip, cls;
        if (counter > 0.25) { tip = 'Buena presión lateral · lo estás cansando'; cls = 'good'; }
        else if (counter < -0.25) { tip = 'Estás acompañando su carrera · ladea la caña al otro lado'; cls = 'bad'; }
        else { tip = 'Ladea la caña a un costado del pez para cansarlo'; cls = 'neutral'; }
        const arrow = side > 0.15 ? '▶' : side < -0.15 ? '◀' : '●';
        html = `<div class="small"><b>${h?.name ?? ''}</b> · ${(h?.weight ?? 0).toFixed(2)} kg
                — recoge sin pasarte de tensión</div>
                <div class="side ${cls}"><span class="ar">${arrow}</span> ${tip}</div>`;
        break;
      }
      default:
        html = '';
    }
    if (this.prompt.innerHTML !== html) this.prompt.innerHTML = html;
  }

  _updateToast(message) {
    if (!message) { this.toast.style.display = 'none'; return; }
    this.toast.style.display = 'block';
    this.toast.textContent = message.text;
    this.toast.className = `sw-toast${message.kind === 'bad' ? ' bad' : ''}`;
  }

  /** Muestra un aviso de aprendizaje; `null` lo retira. */
  showCoach(text) {
    if (!text) { this.coachBox.style.display = 'none'; return; }
    this.coachBox.style.display = 'block';
    this.coachBox.innerHTML = text;
  }

  showWelcome(onStart) {
    const body = el('div', 'help');
    body.innerHTML = `
      <p>Estás en el muelle del <b>Lago de la Niebla</b>. Tres cosas y ya puedes pescar:</p>
      <div class="sw-keys" style="margin:12px 0 14px">
        <b>Clic izq. mantenido</b><span>Carga el lanzamiento; al soltar, lanza. Cuanto más cargues, más lejos.</span>
        <b>Clic izq.</b><span>Clavar cuando pique. La ventana es corta.</span>
        <b>Clic der. mantenido</b><span>Recoger. Vigila la tensión: si se dispara, suelta.</span>
      </div>
      <p class="sw-hint">El resto se explica solo sobre la marcha. <b>Esc</b> muestra todos los controles.</p>`;
    const go = el('button', 'sw-btn sw-cta', 'Empezar a pescar');
    go.style.marginTop = '16px';
    go.addEventListener('click', () => { this.closePanel(); onStart?.(); });
    body.appendChild(go);
    this._overlay('Still Waters', body, { onClose: onStart });
  }

  /** Funde a negro, ejecuta `during` y vuelve. Para saltos de tiempo. */
  fadeThrough(during, { hold = 620 } = {}) {
    this.fadeBox.classList.add('on');
    setTimeout(() => {
      during?.();
      setTimeout(() => this.fadeBox.classList.remove('on'), 260);
    }, hold);
  }

  setCrosshairVisible(value) {
    this.crosshair.style.display = value ? 'block' : 'none';
  }

  // -------------------------------------------------------------- paneles
  _overlay(title, bodyNode, { onClose = null, placement = 'center' } = {}) {
    this.closePanel();
    const overlay = el('div', `sw-overlay${placement === 'bottom' ? ' bottom' : ''}`);
    const panel = el('div', 'sw-panel');
    const header = el('header');
    header.appendChild(el('h2', null, title));
    const close = el('button', 'sw-close', '&times;');
    close.addEventListener('click', () => { this.closePanel(); onClose?.(); });
    header.appendChild(close);
    const body = el('div', 'body');
    body.appendChild(bodyNode);
    panel.appendChild(header);
    panel.appendChild(body);
    overlay.appendChild(panel);
    this.root.appendChild(overlay);
    this.openPanel = { overlay, onClose };
    this.cb.onPanelOpen?.();
    return { overlay, body };
  }

  closePanel() {
    if (!this.openPanel) return;
    this.root.removeChild(this.openPanel.overlay);
    const cb = this.openPanel.onClose;
    this.openPanel = null;
    this.cb.onPanelClose?.();
    cb?.();
  }

  get isPanelOpen() { return !!this.openPanel; }

  showCatch(fish, result, { onKeep, onRelease }) {
    const body = el('div', 'sw-catch');
    const badges = [];
    if (result.isNew) badges.push('<span class="sw-badge" style="color:var(--accent)">Especie nueva</span>');
    if (result.isRecord) badges.push('<span class="sw-badge" style="color:var(--warn)">Récord personal</span>');
    if (fish.trophy > 0.8) badges.push('<span class="sw-badge" style="color:var(--good)">Ejemplar de trofeo</span>');

    body.innerHTML = `
      <div class="name">${fish.species.name}</div>
      <div class="latin">${fish.species.latin}</div>
      <div class="measures">
        <div>Longitud<b>${fish.length.toFixed(1)} cm</b></div>
        <div>Peso<b>${fish.weight.toFixed(2)} kg</b></div>
        <div>Valor<b>${result.value}</b></div>
      </div>
      <div class="badges">${badges.join('')}</div>`;

    const actions = el('div', 'sw-actions');
    const keep = el('button', 'sw-btn', `Quedárselo · ${result.value} monedas`);
    const release = el('button', 'sw-btn ghost', 'Devolver al agua');
    keep.addEventListener('click', () => { this.closePanel(); onKeep(); });
    release.addEventListener('click', () => { this.closePanel(); onRelease(); });
    actions.appendChild(keep);
    actions.appendChild(release);
    body.appendChild(actions);

    this._overlay('Captura', body, { onClose: onRelease, placement: 'bottom' });
  }

  showGear(inventory, equipment) {
    const body = el('div');
    const render = () => {
      body.innerHTML = '';
      const tabs = el('div', 'sw-tabs');
      Object.keys(CATALOG).forEach((category) => {
        const b = el('button', null, CATEGORY_LABELS[category]);
        b.setAttribute('aria-selected', String(this.gearTab === category));
        b.addEventListener('click', () => { this.gearTab = category; render(); });
        tabs.appendChild(b);
      });
      body.appendChild(tabs);

      inventory.list(this.gearTab).forEach((item) => {
        const equipped = equipment.equipped[this.gearTab] === item.id;
        const row = el('div', `sw-item${equipped ? ' equipped' : ''}`);
        row.innerHTML = `<div><div class="t">${item.name}</div>
          <div class="d">${item.description}</div>
          <div class="stats">${this._itemStats(this.gearTab, item)}</div></div>`;
        const act = el('div', 'act');
        if (equipped) {
          act.appendChild(el('span', 'sw-tag', 'Equipado'));
        } else {
          const b = el('button', 'sw-btn', 'Equipar');
          b.addEventListener('click', () => {
            if (this.cb.onEquip?.(this.gearTab, item.id) !== false) render();
          });
          act.appendChild(b);
        }
        row.appendChild(act);
        body.appendChild(row);
      });
    };
    render();
    this._overlay('Equipo', body);
  }

  _itemStats(category, item) {
    switch (category) {
      case 'rods': return `potencia ${item.power} · resistencia ${item.strength} kg · sensibilidad ${(item.sensitivity * 100).toFixed(0)}%`;
      case 'reels': return `${item.capacity} m · recogida ${item.retrieve} · freno máx ${item.maxDrag} kg`;
      case 'lines': return `${item.strength} kg · ⌀ ${item.diameter} mm · elasticidad ${(item.elasticity * 100).toFixed(0)}%`;
      case 'lures': return `${item.weightG} g · trabaja a ${item.workingDepth} m · acción ${(item.action * 100).toFixed(0)}%`;
      default: return '';
    }
  }

  showShop(inventory, economy) {
    const body = el('div');
    const render = () => {
      body.innerHTML = '';
      const money = el('div', 'sw-hint', `Monedas disponibles: <b style="color:var(--warn)">${economy.money}</b>`);
      money.style.marginBottom = '12px';
      body.appendChild(money);

      const tabs = el('div', 'sw-tabs');
      Object.keys(CATALOG).forEach((category) => {
        const b = el('button', null, CATEGORY_LABELS[category]);
        b.setAttribute('aria-selected', String(this.shopTab === category));
        b.addEventListener('click', () => { this.shopTab = category; render(); });
        tabs.appendChild(b);
      });
      body.appendChild(tabs);

      CATALOG[this.shopTab].forEach((item) => {
        const owned = inventory.has(this.shopTab, item.id);
        const row = el('div', `sw-item${owned ? ' equipped' : ''}`);
        row.innerHTML = `<div><div class="t">${item.name}</div>
          <div class="d">${item.description}</div>
          <div class="stats">${this._itemStats(this.shopTab, item)}</div></div>`;
        const act = el('div', 'act');
        if (owned) {
          act.appendChild(el('span', 'sw-tag', 'En propiedad'));
        } else {
          const b = el('button', 'sw-btn', `${item.price}`);
          b.disabled = !economy.canAfford(item.price);
          b.addEventListener('click', () => { this.cb.onBuy?.(this.shopTab, item.id); render(); });
          act.appendChild(b);
        }
        row.appendChild(act);
        body.appendChild(row);
      });
    };
    render();
    this._overlay('Tienda del embarcadero', body);
  }

  showRecords(economy) {
    const body = el('div');
    const grid = el('div', 'sw-grid');
    SPECIES.forEach((species) => {
      const record = economy.records[species.id];
      const card = el('div', `sw-card${record ? '' : ' unknown'}`);
      card.innerHTML = record
        ? `<div class="t">${species.name}</div>
           <div class="m">${record.count} capturas · récord ${record.bestLength.toFixed(1)} cm / ${record.bestWeight.toFixed(2)} kg</div>`
        : `<div class="t">? ? ?</div><div class="m">Sin capturar</div>`;
      grid.appendChild(card);
    });
    body.appendChild(grid);
    this._overlay(`Capturas · ${economy.discovered}/${economy.speciesTotal}`, body);
  }

  showStats(economy) {
    const body = el('div', 'sw-stats');
    const s = economy.stats;
    const items = [
      ['Lances', s.casts],
      ['Picadas clavadas', s.hooked],
      ['Cobrados', s.landed],
      ['Perdidos', s.lost],
      ['Líneas rotas', s.lineBreaks],
      ['Peso total', `${s.totalWeight.toFixed(1)} kg`],
      ['Mayor captura', `${s.biggest.toFixed(2)} kg`],
      ['Efectividad', s.hooked ? `${Math.round((s.landed / s.hooked) * 100)}%` : '—']
    ];
    items.forEach(([k, v]) => {
      const stat = el('div', 'sw-stat');
      stat.innerHTML = `<div class="k">${k}</div><div class="v">${v}</div>`;
      body.appendChild(stat);
    });
    this._overlay('Estadísticas', body);
  }

  showZones(zones, economy, currentId) {
    const body = el('div');
    const render = () => {
      body.innerHTML = '';
      const money = el('div', 'sw-hint', `Monedas disponibles: <b style="color:var(--warn)">${economy.money}</b>`);
      money.style.marginBottom = '12px';
      body.appendChild(money);

      zones.forEach((zone) => {
        const unlocked = economy.unlockedZones.includes(zone.id);
        const here = zone.id === currentId;
        const row = el('div', `sw-item${here ? ' equipped' : ''}`);
        row.innerHTML = `<div><div class="t">${zone.name}</div>
          <div class="d">${zone.description}</div>
          <div class="stats">${zone.species.length} especies · hasta ${zone.terrain.maxDepth} m de calado</div></div>`;
        const act = el('div', 'act');
        if (here) {
          act.appendChild(el('span', 'sw-tag', 'Estás aquí'));
        } else if (unlocked) {
          const go = el('button', 'sw-btn', 'Viajar');
          go.addEventListener('click', () => this.cb.onTravel?.(zone.id));
          act.appendChild(go);
        } else {
          const buy = el('button', 'sw-btn', `${zone.price}`);
          buy.disabled = !economy.canAfford(zone.price);
          buy.addEventListener('click', () => {
            if (this.cb.onUnlockZone?.(zone.id)) render();
          });
          act.appendChild(buy);
        }
        row.appendChild(act);
        body.appendChild(row);
      });
    };
    render();
    this._overlay('Zonas de pesca', body);
  }

  showSettings(settings) {
    const body = el('div');
    const quality = el('div', 'sw-field');
    quality.innerHTML = '<label>Calidad gráfica</label>';
    const buttons = el('div', 'sw-tabs');
    buttons.style.margin = '0';
    Object.entries(QUALITY_PRESETS).forEach(([key, preset]) => {
      const b = el('button', null, preset.label);
      b.setAttribute('aria-selected', String(settings.quality === key));
      b.addEventListener('click', () => {
        this.cb.onSetting?.('quality', key);
        [...buttons.children].forEach((c) => c.setAttribute('aria-selected', String(c === b)));
      });
      buttons.appendChild(b);
    });
    quality.appendChild(buttons);
    body.appendChild(quality);

    const slider = (label, key, min, max, step, value, format) => {
      const field = el('div', 'sw-field');
      field.innerHTML = `<label>${label}</label>`;
      const wrap = el('div');
      const input = document.createElement('input');
      input.type = 'range';
      input.min = min; input.max = max; input.step = step; input.value = value;
      const out = el('span', null, format(value));
      out.style.cssText = 'margin-left:10px;color:var(--dim);font-size:12px';
      input.addEventListener('input', () => {
        out.textContent = format(Number(input.value));
        this.cb.onSetting?.(key, Number(input.value));
      });
      wrap.appendChild(input);
      wrap.appendChild(out);
      field.appendChild(wrap);
      body.appendChild(field);
    };
    slider('Campo de visión', 'fov', 55, 100, 1, settings.fov, (v) => `${v}°`);
    slider('Sensibilidad', 'sensitivity', 0.2, 3, 0.1, settings.sensitivity, (v) => v.toFixed(1));
    slider('Volumen', 'masterVolume', 0, 1, 0.05, settings.masterVolume, (v) => `${Math.round(v * 100)}%`);

    const toggle = (label, key, value, note) => {
      const field = el('div', 'sw-field');
      field.innerHTML = `<label>${label}${note ? `<div class="sw-hint" style="margin-top:2px">${note}</div>` : ''}</label>`;
      const btn = el('button', 'sw-btn' + (value ? '' : ' ghost'), value ? 'Activado' : 'Desactivado');
      btn.addEventListener('click', () => {
        const next = btn.textContent === 'Desactivado';
        btn.textContent = next ? 'Activado' : 'Desactivado';
        btn.className = 'sw-btn' + (next ? '' : ' ghost');
        this.cb.onSetting?.(key, next);
      });
      field.appendChild(btn);
      body.appendChild(field);
    };
    toggle('Calidad automática', 'autoQuality', settings.autoQuality !== false,
      'Baja la calidad sola si el juego no va fluido, y la sube si sobra margen.');
    toggle('Mostrar fps', 'showFps', !!settings.showFps);

    const hint = el('div', 'sw-hint');
    hint.style.marginTop = '14px';
    hint.innerHTML = 'Elegir calidad a mano desactiva el ajuste automático.';
    body.appendChild(hint);

    this._overlay('Configuración', body);
  }

  showPause({ onResume, onSave, onSettings, onReset }) {
    const body = el('div');
    const keys = el('div', 'sw-keys');
    keys.innerHTML = `
      <b>WASD</b><span>Moverse (Mayús para correr)</span>
      <b>Ratón</b><span>Mirar</span>
      <b>Clic izq. (mantener)</b><span>Cargar y lanzar</span>
      <b>Clic izq.</b><span>Clavar durante la picada</span>
      <b>Clic der. (mantener)</b><span>Recoger carrete</span>
      <b>Rueda</b><span>Ajustar el freno</span>
      <b>R</b><span>Recoger el sedal</span>
      <b>Tab</b><span>Equipo</span>
      <b>B</b><span>Tienda</span>
      <b>C</b><span>Capturas</span>
      <b>Z</b><span>Zonas de pesca</span>
      <b>E</b><span>Subir o bajar de la barca</span>
      <b>G</b><span>Estadísticas</span>
      <b>F</b><span>Cambiar cámara</span>
      <b>Esc</b><span>Pausa</span>`;
    body.appendChild(keys);

    const actions = el('div', 'sw-actions');
    actions.style.marginTop = '18px';
    const mk = (label, cls, fn) => {
      const b = el('button', `sw-btn${cls}`, label);
      b.addEventListener('click', fn);
      return b;
    };
    actions.appendChild(mk('Continuar', '', () => { this.closePanel(); onResume(); }));
    actions.appendChild(mk('Guardar', ' ghost', onSave));
    actions.appendChild(mk('Configuración', ' ghost', () => { this.closePanel(); onSettings(); }));
    actions.appendChild(mk('Empezar de cero', ' ghost', onReset));
    body.appendChild(actions);

    this._overlay('Pausa', body, { onClose: onResume });
  }
}

/* ===== src/audio/AudioSystem.js ===== */
/**
 * Audio sintetizado con WebAudio.
 *
 * No se descarga ningún fichero: el viento y la lluvia son ruido filtrado, el
 * agua es ruido con un filtro que respira, los pájaros y los grillos son
 * osciladores con envolvente. La mezcla responde a la hora y al tiempo
 * atmosférico, así que el paisaje sonoro cambia solo.
 */

class AudioSystem {
  constructor() {
    this.ctx = null;
    this.ready = false;
    this.master = null;
    this.volume = 0.8;
    this.muted = false;
    this.layers = {};
    this._birdTimer = 3;
    this._cricketTimer = 5;
  }

  /** Debe llamarse desde un gesto del usuario (política de autoplay). */
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    this.ctx = new Ctx();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.volume;
    this.master.connect(this.ctx.destination);

    this.layers.wind = this._noiseLayer({ type: 'lowpass', frequency: 480, q: 0.7, gain: 0 });
    this.layers.water = this._noiseLayer({ type: 'bandpass', frequency: 900, q: 1.4, gain: 0 });
    this.layers.rain = this._noiseLayer({ type: 'highpass', frequency: 1500, q: 0.6, gain: 0 });
    this.ready = true;
  }

  _noiseBuffer(seconds = 3) {
    const length = Math.floor(this.ctx.sampleRate * seconds);
    const buffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
  }

  _noiseLayer({ type, frequency, q, gain }) {
    const source = this.ctx.createBufferSource();
    source.buffer = this._noiseBuffer();
    source.loop = true;
    const filter = this.ctx.createBiquadFilter();
    filter.type = type;
    filter.frequency.value = frequency;
    filter.Q.value = q;
    const amp = this.ctx.createGain();
    amp.gain.value = gain;
    // LFO lento sobre el filtro: evita que el ruido suene estático.
    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    lfo.frequency.value = 0.07 + Math.random() * 0.1;
    lfoGain.gain.value = frequency * 0.28;
    lfo.connect(lfoGain);
    lfoGain.connect(filter.frequency);
    lfo.start();

    source.connect(filter);
    filter.connect(amp);
    amp.connect(this.master);
    source.start();
    return { source, filter, amp };
  }

  _tone(freq, duration, { type = 'sine', gain = 0.12, slideTo = null, delay = 0, attack = 0.01 } = {}) {
    if (!this.ready || this.muted) return;
    const t0 = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const amp = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + duration);
    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.exponentialRampToValueAtTime(gain, t0 + attack);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(amp);
    amp.connect(this.master);
    osc.start(t0);
    osc.stop(t0 + duration + 0.05);
  }

  _burst(duration, { gain = 0.2, type = 'lowpass', from = 3000, to = 300 } = {}) {
    if (!this.ready || this.muted) return;
    const t0 = this.ctx.currentTime;
    const source = this.ctx.createBufferSource();
    source.buffer = this._noiseBuffer(Math.max(0.4, duration));
    const filter = this.ctx.createBiquadFilter();
    filter.type = type;
    filter.frequency.setValueAtTime(from, t0);
    filter.frequency.exponentialRampToValueAtTime(Math.max(60, to), t0 + duration);
    const amp = this.ctx.createGain();
    amp.gain.setValueAtTime(gain, t0);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    source.connect(filter); filter.connect(amp); amp.connect(this.master);
    source.start(t0);
    source.stop(t0 + duration + 0.05);
  }

  // ------------------------------------------------------------- efectos
  cast() { this._burst(0.32, { gain: 0.16, from: 600, to: 2600, type: 'bandpass' }); }
  splash(strength = 1) { this._burst(0.45 * strength, { gain: 0.26, from: 2600, to: 280 }); }
  reelClick() { this._tone(1500 + Math.random() * 400, 0.03, { type: 'square', gain: 0.045 }); }
  dragSlip() { this._tone(820, 0.16, { type: 'sawtooth', gain: 0.09, slideTo: 1250 }); }
  hookSet() { this._tone(240, 0.16, { type: 'square', gain: 0.16, slideTo: 520 }); }
  bite() { this._tone(700, 0.09, { type: 'sine', gain: 0.16 }); this._tone(1040, 0.12, { type: 'sine', gain: 0.14, delay: 0.08 }); }
  lineBreak() { this._burst(0.3, { gain: 0.3, from: 4000, to: 700, type: 'highpass' }); this._tone(180, 0.4, { type: 'sawtooth', gain: 0.16, slideTo: 60 }); }
  landed() { [523, 659, 784, 1046].forEach((f, i) => this._tone(f, 0.18, { type: 'triangle', gain: 0.13, delay: i * 0.09 })); }
  coin() { this._tone(880, 0.07, { type: 'square', gain: 0.1 }); this._tone(1320, 0.09, { type: 'square', gain: 0.09, delay: 0.06 }); }
  /** Chapoteo lejano: se atenúa y se apaga de agudos con la distancia. */
  distantSplash(closeness = 1) {
    const c = clamp(closeness, 0.05, 1);
    this._burst(0.35 + (1 - c) * 0.3, { gain: 0.05 + c * 0.16, from: 600 + c * 2200, to: 200 });
  }
  /** Zumbido del hilo cuando la tensión aprieta. Sube de tono con ella. */
  lineStress(ratio) {
    if (ratio < 0.5) return;
    this._tone(180 + ratio * 520, 0.16, { type: 'sawtooth', gain: 0.02 + ratio * 0.05 });
  }
  /** Coletazo del pez en la superficie. */
  thrash(strength = 1) {
    this._burst(0.22 * strength, { gain: 0.1 + strength * 0.12, from: 1800, to: 300 });
    this._tone(90, 0.14, { type: 'sine', gain: 0.06 * strength, slideTo: 55 });
  }
  /** Clic del carrete: el intervalo lo marca quien llama, según la recogida. */
  reelTick(speed = 1) {
    this._tone(1200 + Math.random() * 500 + speed * 300, 0.028, { type: 'square', gain: 0.03 + speed * 0.02 });
  }
  /** Chapoteo del jugador al andar por el agua somera. */
  wade() { this._burst(0.24, { gain: 0.09, from: 1500, to: 320 }); }

  footstep(surface) {
    if (surface === 'madera') this._tone(140 + Math.random() * 40, 0.07, { type: 'square', gain: 0.055 });
    else if (surface === 'agua') this._burst(0.2, { gain: 0.11, from: 1800, to: 400 });
    else this._burst(0.09, { gain: 0.06, from: 900, to: 200 });
  }

  // ------------------------------------------------------------- ambiente
  update(dt, { windSpeed = 2, rain = 0, nightFactor = 0, nearWater = 1, cloudiness = 0 } = {}) {
    if (!this.ready) return;
    const now = this.ctx.currentTime;
    const set = (layer, value) => {
      if (layer) layer.amp.gain.setTargetAtTime(this.muted ? 0 : value, now, 0.4);
    };

    set(this.layers.wind, clamp(0.012 + windSpeed * 0.011, 0, 0.14));
    if (this.layers.wind) {
      this.layers.wind.filter.frequency.setTargetAtTime(320 + windSpeed * 90, now, 0.6);
    }
    set(this.layers.water, clamp(nearWater * (0.02 + windSpeed * 0.006), 0, 0.09));
    set(this.layers.rain, clamp(rain * 0.13, 0, 0.13));

    // Pájaros de día, grillos de noche.
    this._birdTimer -= dt;
    if (this._birdTimer <= 0) {
      this._birdTimer = lerp(1.4, 9, nightFactor) + Math.random() * 4 + cloudiness * 3;
      if (nightFactor < 0.55 && rain < 0.4 && !this.muted) {
        const base = 1600 + Math.random() * 1400;
        const notes = 2 + Math.floor(Math.random() * 3);
        for (let i = 0; i < notes; i++) {
          this._tone(base * (1 + i * 0.12), 0.09, {
            type: 'sine', gain: 0.035, slideTo: base * 1.35, delay: i * 0.13
          });
        }
      }
    }

    this._cricketTimer -= dt;
    if (this._cricketTimer <= 0) {
      this._cricketTimer = 0.35 + Math.random() * 0.5;
      if (nightFactor > 0.45 && rain < 0.3 && !this.muted) {
        this._tone(4200 + Math.random() * 600, 0.035, { type: 'square', gain: 0.016 });
      }
    }
  }

  setVolume(value) {
    this.volume = clamp(value, 0, 1);
    if (this.master) this.master.gain.setTargetAtTime(this.volume, this.ctx.currentTime, 0.1);
  }

  setMuted(value) {
    this.muted = value;
    if (this.master) this.master.gain.setTargetAtTime(value ? 0 : this.volume, this.ctx.currentTime, 0.1);
  }
}

/* ===== src/core/Game.js ===== */
/**
 * Orquestador.
 *
 * Construye los sistemas, los conecta y ejecuta el bucle. Ningún sistema
 * conoce a los demás: el Game les pasa cada frame el contexto que necesitan
 * (hora, viento, posición del jugador…) y reparte los eventos.
 */
class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.save = new SaveSystem();
    this.settings = { ...DEFAULT_SETTINGS, ...(this.save.load()?.settings || {}) };
    this.preset = presetFor(this.settings);
    this.clock = new THREE.Clock();
    this.running = false;
    this.paused = false;
    this.autosaveTimer = 0;
    this.footstepTimer = 0;

    this._initRenderer();
    this._initWorld();
    this._initPlayer();
    this._initProgress();
    this._initFishing();
    this.cameraFx = new CameraFx(this.camera, { baseFov: this.settings.fov });
    // Una sola fuente de verdad para "qué caña se ve": la del modelo de primera
    // persona o la que sujeta el cuerpo, nunca las dos.
    this.player.onModeChange = (mode) => this.fishing.rod.setVisible(mode === 'first');

    this.interaction = new InteractionSystem(this.camera);
    // El mundo se construye antes que este sistema, así que la primera zona
    // hay que registrarla aquí; los viajes posteriores lo hacen en _buildZone.
    this._registerInteractables();
    this._initUI();
    this._initPerformance();
    this._bindInput();
    this._loadProgress();
    if (!this.save.load()) this.ui.showWelcome(() => this.input.requestLock());
  }

  // --------------------------------------------------------------- montaje
  _initRenderer() {
    this.renderer = new THREE.WebGLRenderer({
      canvas: this.canvas,
      antialias: this.preset.antialias,
      powerPreference: 'high-performance'
    });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2) * this.preset.pixelRatio);
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.shadowMap.enabled = this.preset.shadows;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    // El cielo de Preetham emite valores muy altos: con exposición 1 se
    // satura a blanco y el lago lo refleja como una lámina de leche.
    this.renderer.toneMappingExposure = 0.85;

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(
      this.settings.fov, window.innerWidth / window.innerHeight, 0.08, 5000
    );

    window.addEventListener('resize', () => this._resize());
  }

  _initWorld() {
    this.textures = new TextureLibrary();
    this.time = new TimeOfDay({ hour: 9.4 });
    this.sky = new SkyDome(this.scene, this.textures, this.preset);
    this.weather = new Weather(this.scene, this.textures, this.preset);
    this._buildZone(zoneOf('lago_niebla'));
  }

  /**
   * Construye (o reconstruye) el mundo de una zona.
   *
   * Cielo, clima, jugador, dinero y equipo sobreviven al cambio: sólo se
   * rehace la geografía. Es lo que permite añadir mapas sin tocar el motor.
   */
  _buildZone(zone) {
    this.zone = zone;
    this._disposeZone();

    this.terrain = new Terrain(this.textures, { resolution: 300, ...zone.terrain });
    this.scene.add(this.terrain.mesh);

    this.water = new WaterBody(this.textures, {
      reflectionSize: this.preset.waterReflection,
      sunDirection: this.time.sunDirection,
      terrain: this.terrain,
      zoneId: zone.id
    });
    this.water.addTo(this.scene);

    this.vegetation = new Vegetation(this.scene, this.terrain, this.textures, this.preset, {
      seed: zone.terrain.seed + 1, density: zone.vegetation.grass
    });
    this.grass = new GrassBlades(this.scene, this.terrain, this.preset, {
      seed: zone.terrain.seed + 5, density: zone.vegetation.grass
    });
    this.trees = new Trees(this.scene, this.terrain, this.textures, this.preset, {
      seed: zone.terrain.seed + 2, count: zone.vegetation.trees, conifer: zone.vegetation.conifer
    });
    this.props = new Props(this.scene, this.terrain, this.textures, this.preset);
    this.boat = new Boat(this.scene, this.terrain, this.textures, this.preset, {
      position: this.props.boatAnchor, heading: Math.PI * 0.62
    });
    this.fishManager = new FishManager(this.scene, this.terrain, {
      seed: zone.terrain.seed + 3, species: zone.species
    });
    if (this.interaction) this._registerInteractables();
    this.ambient = new AmbientLife(this.scene, this.terrain, this.water, {
      seed: zone.terrain.seed + 7, audio: this.audio
    });
  }

  _disposeZone() {
    if (!this.terrain) return;
    this.fishManager?.dispose();
    this.ambient?.dispose();
    this.boat?.dispose();
    this.props?.dispose();
    this.trees?.dispose();
    this.grass?.dispose();
    this.vegetation?.dispose();
    if (this.water) {
      this.scene.remove(this.water.water);
      this.scene.remove(this.water.rippleGroup);
      this.water.dispose();
    }
    this.scene.remove(this.terrain.mesh);
    this.terrain.dispose();
  }

  /** Viaja a otra zona: rehace el mundo y recoloca al jugador en su muelle. */
  travelTo(zoneId) {
    const zone = zoneOf(zoneId);
    if (zone.id === this.zone?.id) return;
    const busy = this._busyMessage('viajar');
    if (busy) { this.fishing._say(busy, 'bad'); return; }
    if (this.fishing.state !== 'idle') this.fishing.reelIn('Recoges el sedal antes de viajar');
    if (this.player.platform) { this.boat.leave(); this.player.setPlatform(null); }

    this._buildZone(zone);

    // Los sistemas que guardaban referencias al mundo anterior se reenganchan.
    this.player.terrain = this.terrain;
    this.player.walkables = [this.props.group];
    this.fishing.terrain = this.terrain;
    this.fishing.water = this.water;
    this.fishing.fishManager = this.fishManager;

    this.scene.updateMatrixWorld(true);
    const spot = this.props.fishingSpots[0];
    this.player.teleport(spot.position.clone());
    this.player.yaw = Math.atan2(spot.position.x, spot.position.z);
    this.time.setHour(zone.startHour);
    this.weather.setWeather(zone.weather);
    this.economy.currentZone = zone.id;
    this._persist();
    this.fishing._say(`Has llegado a ${zone.name}`);
  }

  _initPlayer() {
    const spot = this.props.fishingSpots[0];
    const spawn = spot.position.clone().add(new THREE.Vector3(0, 0, 0));
    this.player = new Player(this.camera, this.terrain, {
      spawn,
      walkables: [this.props.group]
    });
    this.scene.add(this.player.rig);
    // Mirando al centro del lago.
    this.player.yaw = Math.atan2(-spawn.x, -spawn.z) + Math.PI;
  }

  _initProgress() {
    this.inventory = new Inventory();
    this.equipment = new Equipment(this.inventory);
    this.economy = new Economy();
  }

  _initFishing() {
    this.audio = new AudioSystem();
    this.fishing = new FishingSystem({
      scene: this.scene,
      camera: this.camera,
      terrain: this.terrain,
      water: this.water,
      fishManager: this.fishManager,
      equipment: this.equipment,
      events: {
        onCast: (power) => {
          this.economy.stats.casts++;
          this.audio.cast();
          this.cameraFx.addFovKick(2.5 + power * 3.5);
        },
        onSplash: (p) => this.audio.splash(0.9),
        onBite: () => this.audio.bite(),
        onHookSet: () => {
          this.economy.stats.hooked++;
          this.audio.hookSet();
          this.cameraFx.addShake(0.35);
          this.cameraFx.addFovKick(-3);
        },
        onDragSlip: () => { if (Math.random() < 0.35) this.audio.dragSlip(); },
        onJump: (fish) => {
          this.water.splash(fish.position, 1.1);
          this.audio.thrash(clamp(0.4 + fish.weight * 0.06, 0.4, 1.4));
          this.cameraFx.addShake(0.18);
        },
        onRun: () => this.cameraFx.addShake(0.12),
        onLineBreak: () => {
          this.economy.stats.lineBreaks++; this.economy.stats.lost++;
          this.lastEvent = 'lineBreak'; this.audio.lineBreak();
          this.cameraFx.addShake(0.9);
        },
        onFishLost: () => { this.economy.stats.lost++; this.lastEvent = 'fishLost'; },
        onLanded: (fish) => {
          this.lastEvent = 'landed';
          this.cameraFx.addShake(0.2);
          this._onLanded(fish);
        }
      }
    });
  }

  _initPerformance() {
    this.coach = new Coach();
    this.lastEvent = null;
    this.perf = new Performance({
      renderer: this.renderer,
      sky: this.sky,
      vegetationRef: () => this.vegetation,
      grassRef: () => this.grass,
      treesRef: () => this.trees,
      weather: this.weather,
      settings: this.settings,
      onChange: (level, direccion, fps) => {
        const texto = direccion === 'baja'
          ? `Calidad bajada a «${level}» para ir fluido (${fps} fps)`
          : `Calidad subida a «${level}» (${fps} fps)`;
        this.fishing._say(texto);
      }
    });
  }

  _initUI() {
    this.ui = new UI({
      onEquip: (category, id) => {
        const result = this.equipment.equip(category, id);
        if (typeof result === 'string') { this.fishing._say(result, 'bad'); return false; }
        this._persist();
        return true;
      },
      onBuy: (category, id) => {
        if (this.economy.buy(category, id)) {
          this.inventory.add(category, id);
          this.audio.coin();
          this._persist();
        }
      },
      onSetting: (key, value) => this._applySetting(key, value),
      onUnlockZone: (zoneId) => {
        const zone = zoneOf(zoneId);
        if (this.economy.unlockedZones.includes(zoneId)) return true;
        if (!this.economy.canAfford(zone.price)) return false;
        this.economy.money -= zone.price;
        this.economy.unlockedZones.push(zoneId);
        this.audio.coin();
        this._persist();
        return true;
      },
      onTravel: (zoneId) => { this.ui.closePanel(); this.travelTo(zoneId); },
      onPanelOpen: () => { this.input.releaseLock(); this.ui.setCrosshairVisible(false); },
      onPanelClose: () => { this.ui.setCrosshairVisible(true); }
    });
  }

  _bindInput() {
    this.input = new Input(this.canvas);

    this.canvas.addEventListener('click', () => {
      if (!this.ui.isPanelOpen && !this.input.locked) {
        this.audio.init();
        this.input.requestLock();
      }
    });

    this.input.on('pointerdown', (e) => {
      if (this.ui.isPanelOpen || !this.input.locked) return;
      if (e.button === 0) {
        if (this.fishing.state === FishingState.BITE) this.fishing.strike();
        else this.fishing.beginCast();
      }
    });
    this.input.on('pointerup', (e) => {
      if (e.button === 0) this.fishing.releaseCast();
    });

    this.input.on('keydown', (e) => {
      if (e.repeat) return;
      switch (e.code) {
        case 'Escape': this._togglePause(); break;
        case 'Tab': this._panel(() => this.ui.showGear(this.inventory, this.equipment)); break;
        case 'KeyB': this._panel(() => this.ui.showShop(this.inventory, this.economy)); break;
        case 'KeyC': this._panel(() => this.ui.showRecords(this.economy)); break;
        case 'KeyG': this._panel(() => this.ui.showStats(this.economy)); break;
        case 'KeyR': if (!this.ui.isPanelOpen) this.fishing.reelIn(); break;
        case 'KeyE':
          if (!this.ui.isPanelOpen) this.interaction.interact();
          break;
        case 'KeyQ':
          if (!this.ui.isPanelOpen) this.fishing.toggleRod();
          break;
        case 'KeyZ': this._panel(() => this.ui.showZones(ZONES, this.economy, this.zone.id)); break;
        case 'KeyF':
          this.player.setCameraMode(this.player.mode === 'first' ? 'third' : 'first');
          break;
        default: break;
      }
    });
  }

  /** Sube o baja de la barca. Desembarcar exige tener orilla al lado. */
  /**
   * Todo lo que teletransporta al jugador o salta el reloj tiene que preguntar
   * esto antes: con un pez enganchado la respuesta es que no.
   */
  _busyMessage(what) {
    if (this.fishing.state === 'fighting') return `No puedes ${what} con un pez enganchado`;
    return null;
  }

  _toggleBoat() {
    if (this.player.platform) {
      const busy = this._busyMessage('bajar de la barca');
      if (busy) { this.fishing._say(busy, 'bad'); return; }
      const shore = this._findShoreNear(this.boat.position);
      if (!shore) { this.fishing._say('Acerca la barca a la orilla para bajar', 'bad'); return; }
      // Bajar teletransporta al jugador hasta la orilla: con el sedal fuera,
      // ese salto se traduciría en un tirón imposible.
      if (this.fishing.state !== 'idle') this.fishing.reelIn('Recoges el sedal antes de bajar');
      this.boat.leave();
      this.player.setPlatform(null);
      this.player.teleport(shore);
      this.fishing._say('Has desembarcado');
    } else if (this.boat.canBoard(this.player.position)) {
      const busy = this._busyMessage('subir a la barca');
      if (busy) { this.fishing._say(busy, 'bad'); return; }
      if (this.fishing.state !== 'idle') this.fishing.reelIn('Recoges el sedal antes de subir');
      this.player.setPlatform(this.boat);
      this.fishing._say('A bordo · W/S para bogar, A/D para virar, E para bajar');
    }
  }

  /**
   * Sitio donde bajarse de la barca. Vale el agua por la rodilla —de ahí se
   * puede vadear—, no sólo la tierra seca: exigir tierra firme dejaba el
   * fondeadero sin salida.
   */
  _findShoreNear(position, maxRadius = 13) {
    let best = null;
    for (let radius = 2.5; radius <= maxRadius; radius += 1.25) {
      for (let i = 0; i < 20; i++) {
        const angle = (i / 20) * Math.PI * 2;
        const x = position.x + Math.cos(angle) * radius;
        const z = position.z + Math.sin(angle) * radius;
        const h = this.terrain.heightAt(x, z);
        if (h > 0.25) return new THREE.Vector3(x, h, z);      // tierra seca: ideal
        if (h > -0.6 && !best) best = new THREE.Vector3(x, h, z);  // vadeable
      }
      if (best) return best;
    }
    return null;
  }

  _panel(open) {
    if (this.ui.isPanelOpen) { this.ui.closePanel(); return; }
    open();
  }

  _togglePause() {
    if (this.ui.isPanelOpen) { this.ui.closePanel(); return; }
    this.ui.showPause({
      onResume: () => {},
      onSave: () => { this._persist(); this.fishing._say('Partida guardada'); },
      onSettings: () => this.ui.showSettings(this.settings),
      onReset: () => {
        this.save.clear();
        window.location.reload();
      }
    });
  }

  // -------------------------------------------------------------- eventos
  _onLanded(fish) {
    this.audio.landed();
    const result = this.economy.registerCatch(fish);
    this.ui.showCatch(fish, result, {
      onKeep: () => {
        this.economy.sell(result.value);
        this.audio.coin();
        this.fishing.finishCatch(true);
        this._persist();
      },
      onRelease: () => {
        this.fishing.finishCatch(false);
        this._persist();
      }
    });
  }

  _applySetting(key, value) {
    this.settings[key] = value;
    if (key === 'quality') this.perf.lockTo(value);
    if (key === 'autoQuality') this.perf.auto = value;
    if (key === 'fov') {
      this.camera.fov = value;
      this.cameraFx.setBaseFov(value);
      this.camera.updateProjectionMatrix();
    }
    if (key === 'masterVolume') this.audio.setVolume(value);
    this._persist();
  }

  // ----------------------------------------------------------- persistencia
  _persist() {
    this.save.save({
      settings: this.settings,
      inventory: this.inventory.toJSON(),
      equipment: this.equipment.toJSON(),
      economy: this.economy.toJSON(),
      world: { hour: this.time.hour, weather: this.weather.current, zone: this.zone?.id },
      coach: this.coach?.toJSON() ?? []
    });
  }

  _loadProgress() {
    const data = this.save.load();
    if (!data) return;
    this.inventory = Inventory.fromJSON(data.inventory);
    this.equipment = Equipment.fromJSON(this.inventory, data.equipment);
    this.economy = new Economy(data.economy);
    this.fishing.equipment = this.equipment;
    if (data.world?.hour !== undefined) this.time.setHour(data.world.hour);
    if (data.world?.weather) this.weather.setWeather(data.world.weather);
    if (data.world?.zone && data.world.zone !== this.zone?.id &&
        this.economy.unlockedZones.includes(data.world.zone)) {
      this.travelTo(data.world.zone);
    }
    this.audio.setVolume(this.settings.masterVolume);
    if (Array.isArray(data.coach)) this.coach.seen = new Set(data.coach);
  }

  // ---------------------------------------------------------------- bucle
  start() {
    this.running = true;
    this.clock.start();
    this.renderer.setAnimationLoop(() => this._frame());
  }

  _resize() {
    this.camera.aspect = window.innerWidth / window.innerHeight;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(window.innerWidth, window.innerHeight);
  }

  _frame() {
    const dt = Math.min(0.05, this.clock.getDelta());
    this.simulate(dt);
    this.renderer.render(this.scene, this.camera);
  }

  /**
   * Un paso de simulación, independiente del dibujado.
   *
   * Separarlo permite ejecutar el juego a velocidad de cálculo (pruebas
   * automáticas, ajuste de equilibrio) sin pasar por la GPU, y deja la puerta
   * abierta a un paso fijo si en el futuro hace falta determinismo.
   */
  simulate(dt, { headless = false } = {}) {
    const panelOpen = this.ui.isPanelOpen;
    const controllable = headless || (!panelOpen && this.input.locked);

    if (controllable && !headless) {
      const mouse = this.input.consumeMouseDelta();
      this.player.look(mouse.dx, mouse.dy, this.settings.sensitivity, this.settings.invertY);
      if (mouse.wheel) this.fishing.adjustDrag(-mouse.wheel * 0.06);
      this.fishing.setRetrieve(this.input.mouse.right ? 1 : 0);
    } else if (!headless) {
      this.input.consumeMouseDelta();
      this.fishing.setRetrieve(0);
    }

    // El jugador se actualiza también sin entrada: así sigue a la barca y las
    // pruebas automáticas ejercitan el mismo código que la partida real.
    const moving = controllable
      ? this.player.update(dt, this.input)
      : { speed: 0, surface: this.player.surface, depth: 0 };

    this.time.update(panelOpen ? 0 : dt);
    this.weather.update(dt, this.player.position, this.time.fogColor);
    this.sky.update(this.time, this.weather, dt, this.player.position);

    // El viento base más la racha en curso: la vegetación se mueve a rachas,
    // no a velocidad constante.
    const gust = this.ambient?.gustStrength ?? 0;
    const wind = new THREE.Vector3(
      this.weather.windDirection.x, 0, this.weather.windDirection.y
    ).multiplyScalar(this.weather.windSpeed * (1 + gust * 0.55));

    this.water.update(dt, {
      sunDirection: this.time.sunDirection,
      sunColor: this.time.sunColor,
      waterColor: new THREE.Color(0x0d2630).lerp(this.time.skyColor, 0.16),
      choppiness: this.weather.choppiness
    });
    this.vegetation.update(dt, wind, this.player.position);
    this.grass.update(dt, wind, this.player.position);
    this.trees.update(this.player.position);

    const aboard = this.player.platform === this.boat;
    this.boat.update(dt, {
      row: aboard && controllable
        ? (this.input.isDown('KeyW') ? 1 : 0) - (this.input.isDown('KeyS') ? 1 : 0) : 0,
      turn: aboard && controllable
        ? (this.input.isDown('KeyA') ? 1 : 0) - (this.input.isDown('KeyD') ? 1 : 0) : 0,
      time: this.clock.elapsedTime,
      water: this.water
    });

    const context = {
      terrain: this.terrain,
      hour: this.time.hour,
      time: this.clock.elapsedTime,
      weatherModifier: this.weather.biteModifier,
      feeding: this.time.feedingFactor,
      wind,
      lookDelta: this.player.lookDelta,
      cameraPosition: this.player.position,
      playerPosition: this.player.position,
      // Cuanto más ruido hace el jugador, antes se espantan.
      playerNoise: clamp((moving.speed / 5.6) * (moving.surface === 'agua' ? 1.4 : 0.35), 0, 1.4),
      lurePosition: this.fishing.lure.isFishable ? this.fishing.lure.position : null,
      lureAction: this.fishing.lure.action,
      onBite: () => {},
      onSpit: () => {}
    };

    if (!panelOpen) {
      this.fishing.update(dt, context);
      this.fishManager.update(dt, context);
      this.ambient.update(dt, { player: this.player.position, time: this.time, weather: this.weather });
      this._updateFeedback(dt, moving);
    }
    if (!panelOpen) this.interaction.update(this.player.position);
    this.player.holdingRod = this.fishing.rodStowed ? 0 : 1;
    this.cameraFx.update(dt);

    if (!headless) {
      this.perf.update(dt);
      this._updateAudio(dt, moving);

      const tip = this.coach.check({
        fishingState: this.fishing.state,
        lastEvent: this.lastEvent,
        casts: this.economy.stats.casts,
        landed: this.economy.stats.landed,
        money: this.economy.money,
        nearBoat: this.boat.canBoard(this.player.position),
        rig: this.fishing.lure.rig
      }, dt);
      if (tip) { this.ui.showCoach(tip); this._persist(); }
      else if (!this.coach.text) this.ui.showCoach(null);
      this.lastEvent = null;

      this.ui.update({
        fishing: this.fishing.hud,
        time: this.time,
        weather: this.weather,
        money: this.economy.money,
        equipment: this.equipment,
        hint: this._contextHint(),
        fps: this.settings.showFps ? Math.round(this.perf.fps) : undefined,
        quality: this.perf.level
      });
      this.autosaveTimer += dt;
      if (this.autosaveTimer > 30) { this.autosaveTimer = 0; this._persist(); }
    }
  }

  /** Registra lo que se puede mirar e interactuar en la zona actual. */
  _registerInteractables() {
    const I = this.interaction;
    I.clear();

    I.register({
      object: this.boat.group,
      range: 4.5,
      label: () => (this.player.platform ? 'E · desembarcar' : 'E · subir a la barca'),
      enabled: () => this.player.platform === this.boat || this.boat.canBoard(this.player.position),
      action: () => this._toggleBoat()
    });
    I.register({
      object: this.props.camp,
      range: 4,
      label: () => `E · descansar hasta las ${String(Math.floor(this._nextFeedingHour())).padStart(2, '0')}:00`,
      enabled: () => !this.player.platform,
      action: () => this._rest(this._nextFeedingHour())
    });
    I.register({
      object: this.props.sign,
      range: 4,
      label: () => `E · ${this.zone.name}: leer el cartel`,
      enabled: () => !this.player.platform,
      action: () => this.ui.showZones(ZONES, this.economy, this.zone.id)
    });
    I.register({
      object: this.props.bucket,
      range: 3,
      label: 'E · mirar el cubo de cebo',
      enabled: () => !this.player.platform,
      action: () => this._inspectBait()
    });
  }

  /** Examinar el cebo: consejo real según la hora y el tiempo que hace. */
  _inspectBait() {
    const hour = this.time.hour;
    const band = hour < 6 || hour > 20 ? 'de noche'
      : hour < 10 ? 'a primera hora'
      : hour < 17 ? 'a pleno día' : 'al caer la tarde';
    const consejo = hour < 6 || hour > 20
      ? 'los peces de fondo están activos: prueba vinilo o boilie hondo'
      : hour < 10 || hour > 17
      ? 'es la mejor franja: cucharilla o popper en superficie'
      : 'con el sol alto conviene bajar: cucharilla pesada o boilie';
    this.audio.coin();
    this.fishing._say(`El cubo huele fuerte. ${band.charAt(0).toUpperCase() + band.slice(1)} y ${this.weather.label.toLowerCase()}: ${consejo}`);
  }

  /**
   * Puntos con los que se puede interactuar, en orden de prioridad.
   *
   * Todos comparten la misma tecla y el mismo aviso bajo el punto de mira, de
   * modo que el jugador aprende un solo gesto y vale para todo.
   */
  _interactables() {
    const list = [];
    const here = this.player.position;

    if (this.player.platform) {
      list.push({ label: 'W/S bogar · A/D virar · E desembarcar', action: () => this._toggleBoat() });
      return list;
    }
    if (this.boat.canBoard(here)) {
      list.push({ label: 'E · subir a la barca', action: () => this._toggleBoat() });
    }
    const camp = this.props.camp?.position;
    if (camp && here.distanceTo(camp) < 3.6) {
      const next = this._nextFeedingHour();
      list.push({
        label: `E · descansar junto al fuego hasta las ${String(Math.floor(next)).padStart(2, '0')}:00`,
        action: () => this._rest(next)
      });
    }
    return list;
  }

  _contextHint() {
    if (this.player.platform) return 'W/S bogar · A/D virar · E desembarcar';
    return this.interaction?.label ?? '';
  }

  /** Siguiente hora punta de actividad: amanecer o atardecer. */
  _nextFeedingHour() {
    const h = this.time.hour;
    return h < 5.5 || h >= 19 ? 6 : 19;
  }

  /** Descansar: salta a la siguiente franja buena, con fundido. */
  _rest(hour) {
    // Un pez enganchado no se abandona en silencio: se cobra o se pierde, pero
    // nunca desaparece porque el jugador haya pulsado otra tecla.
    const busy = this._busyMessage('descansar');
    if (busy) { this.fishing._say(busy, 'bad'); return; }
    if (this.fishing.state !== 'idle') this.fishing.reelIn('Recoges el sedal antes de descansar');
    this.input.releaseLock();
    this.ui.fadeThrough(() => {
      this.time.setHour(hour);
      // Al levantarse, el tiempo puede haber cambiado.
      if (Math.random() < 0.55) this.weather.cycle();
      this._persist();
      this.fishing._say(`Has descansado. Son las ${String(Math.floor(hour)).padStart(2, '0')}:00 · ${this.weather.label}`);
      this.input.requestLock();
    });
  }

  /**
   * Reacciones continuas: tirón de cámara durante la pelea, zumbido del hilo,
   * clics del carrete y ondas al vadear.
   */
  _updateFeedback(dt, moving) {
    const f = this.fishing;

    // La vista se va detrás del pez cuando tira, proporcional a la tensión.
    if (f.state === 'fighting' && f.hooked) {
      const toFish = f.hooked.position.clone().sub(this.camera.getWorldPosition(new THREE.Vector3()));
      const forward = this.camera.getWorldDirection(new THREE.Vector3());
      const lateral = forward.x * toFish.z - forward.z * toFish.x;
      const strength = clamp(f.tensionRatio, 0, 1) * 0.02;
      this.cameraFx.setPull(clamp(-lateral * 0.002, -1, 1) * strength, -strength * 0.5);
      this.cameraFx.setRoll(f.sidePressure * 0.035);
      this._stressTimer = (this._stressTimer ?? 0) - dt;
      if (this._stressTimer <= 0 && f.tensionRatio > 0.55) {
        this._stressTimer = 0.28;
        this.audio.lineStress(f.tensionRatio);
      }
    } else {
      this.cameraFx.setPull(0, 0);
      this.cameraFx.setRoll(0);
    }

    // Clics del carrete al ritmo de la recogida.
    if (f.retrieveInput > 0.05 && f.state !== 'idle') {
      this._reelTimer = (this._reelTimer ?? 0) - dt * f.retrieveInput * (1 + f.tensionRatio);
      if (this._reelTimer <= 0) { this._reelTimer = 0.1; this.audio.reelTick(f.retrieveInput); }
    }

    // Andar por el agua somera levanta ondas y suena.
    if (moving.surface === 'agua' && moving.speed > 1) {
      this._wadeTimer = (this._wadeTimer ?? 0) - dt * moving.speed * 0.45;
      if (this._wadeTimer <= 0) {
        this._wadeTimer = 1;
        this.water.splash(this.player.position, 0.25 + moving.depth * 0.3);
        this.audio.wade();
      }
    }
  }

  _updateAudio(dt, moving) {
    const depthUnderPlayer = this.terrain.depthAt(this.player.position.x, this.player.position.z);
    const distanceToWater = clamp(1 - Math.max(0, this.player.position.y) / 12, 0.15, 1);
    this.audio.update(dt, {
      windSpeed: this.weather.windSpeed,
      rain: this.weather.rainAmount,
      nightFactor: this.time.nightFactor,
      nearWater: depthUnderPlayer > 0 ? 1 : distanceToWater,
      cloudiness: this.weather.cloudiness
    });

    // El paso suena cuando el pie toca de verdad, no cada N segundos: así el
    // sonido va sincronizado con la animación por construcción.
    if (moving.stepped) this.audio.footstep(moving.surface);
  }

  dispose() {
    this.renderer.setAnimationLoop(null);
    this.fishing.dispose();
    this.fishManager.dispose();
    this.vegetation.dispose();
    this.trees.dispose();
    this.grass.dispose();
    this.ambient.dispose();
    this.boat.dispose();
    this.props.dispose();
    this.water.dispose();
    this.sky.dispose();
    this.weather.dispose();
    this.terrain.dispose();
    this.textures.dispose();
    this.renderer.dispose();
  }
}

/** Punto de entrada: monta el juego y quita la pantalla de carga. */
const canvas = document.getElementById('viewport');
const loader = document.getElementById('loading');
const loaderText = document.getElementById('loading-text');

function fail(error) {
  console.error(error);
  if (loaderText) {
    loaderText.innerHTML = `<b>No se pudo iniciar el juego.</b><br>${error.message}<br>
      <small>Requiere un navegador con WebGL 2.</small>`;
  }
}

try {
  if (loaderText) loaderText.textContent = 'Generando el lago…';
  const game = new Game(canvas);
  window.game = game;                     // útil para depurar desde la consola
  game.start();
  requestAnimationFrame(() => {
    loader?.classList.add('done');
    setTimeout(() => loader?.remove(), 700);
  });
} catch (error) {
  fail(error);
}
</script>

<script>
  // Si el módulo no llega a arrancar (three.js bloqueado, WebGL 2 ausente),
  // el usuario vería una pantalla de carga eterna. Esto lo explica.
  setTimeout(function () {
    if (window.game) return;
    var t = document.getElementById('loading-text');
    if (t) t.innerHTML = '<b>No se pudo iniciar.</b><br>' +
      'Necesita WebGL 2 y acceso a la librería three.js.<br>' +
      '<small>Prueba con Chrome o Firefox actualizados en un ordenador.</small>';
  }, 20000);
</script>
