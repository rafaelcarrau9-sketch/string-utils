    this.stats.totalWeight += fish.weight;
    this.stats.biggest = Math.max(this.stats.biggest, fish.weight);

    const value = valueFor(fish.species, fish.weight);
    return { value, isRecord, isNew: record.count === 1 };
  }

  sell(amount) {
    this.money += amount;
    return this.money;
  }

  canAfford(price) { return this.money >= price; }

  buy(category, id) {
    const item = findItem(category, id);
    if (!item || !this.canAfford(item.price)) return false;
    this.money -= item.price;
    return true;
  }

  get discovered() {
    return Object.keys(this.records).filter((id) => this.records[id].count > 0).length;
  }

  get speciesTotal() { return Object.keys(SPECIES_BY_ID).length; }

  toJSON() {
    return {
      money: this.money,
      records: this.records,
      stats: this.stats,
      unlockedZones: this.unlockedZones
    };
  }
}

/* ===== src/fishing/Line.js ===== */
/**
 * Línea de pesca: cuerda de Verlet entre la puntera y el señuelo.
 *
 * La simulación es puramente visual —la tensión de juego la calcula
 * `FishingSystem` a partir de fuerzas— pero comparte con ella el mismo dato:
 * `lineOut`, los metros de hilo soltados. Si hay más hilo que distancia, la
 * cuerda cuelga; si hay menos, se tensa en línea recta. Por eso lo que se ve
 * coincide siempre con lo que se siente.
 */

const SEGMENTS = 22;
const LINE_GRAVITY = new THREE.Vector3(0, -9.81, 0);

class FishingLine {
  constructor(scene, { color = 0xe8f1f5 } = {}) {
    this.points = [];
    for (let i = 0; i < SEGMENTS; i++) {
      this.points.push({
        position: new THREE.Vector3(),
        previous: new THREE.Vector3()
      });
    }

    const positions = new Float32Array(SEGMENTS * 3);
    this.geometry = new THREE.BufferGeometry();
    this.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    this.material = new THREE.LineBasicMaterial({
      color, transparent: true, opacity: 0.75, depthWrite: false
    });
    this.mesh = new THREE.Line(this.geometry, this.material);
    this.mesh.frustumCulled = false;
    this.mesh.visible = false;
    this.mesh.name = 'linea';
    scene.add(this.mesh);
  }

  /** Coloca la cuerda recta entre dos puntos (al lanzar). */
  reset(start, end) {
    for (let i = 0; i < SEGMENTS; i++) {
      const t = i / (SEGMENTS - 1);
      const p = start.clone().lerp(end, t);
      this.points[i].position.copy(p);
      this.points[i].previous.copy(p);
    }
  }

  /**
   * @param start   puntera de la caña
   * @param end     posición del señuelo
   * @param lineOut metros de hilo fuera del carrete
   * @param wind    viento, que curva el hilo suelto
   */
  update(dt, start, end, lineOut, wind) {
    const step = Math.min(dt, 0.033);
    const restLength = Math.max(0.05, lineOut / (SEGMENTS - 1));

    // Integración de Verlet con amortiguación.
    for (let i = 1; i < SEGMENTS - 1; i++) {
      const p = this.points[i];
      const velocity = p.position.clone().sub(p.previous).multiplyScalar(0.94);
      p.previous.copy(p.position);
      p.position.add(velocity);
      p.position.addScaledVector(LINE_GRAVITY, step * step * 0.55);
      if (wind) p.position.addScaledVector(wind, step * step * 0.35);
    }

    // Extremos fijos: puntera y señuelo.
    this.points[0].position.copy(start);
    this.points[SEGMENTS - 1].position.copy(end);

    // Relajación de distancias. Varias pasadas dan una cuerda estable.
    for (let iteration = 0; iteration < 6; iteration++) {
      for (let i = 0; i < SEGMENTS - 1; i++) {
        const a = this.points[i].position;
        const b = this.points[i + 1].position;
        const delta = b.clone().sub(a);
        const distance = delta.length();
        if (distance < 1e-5) continue;
        // Sólo tira si está estirado: una cuerda no empuja.
        const difference = (distance - restLength) / distance;
        if (difference <= 0) continue;
        const correction = delta.multiplyScalar(difference * 0.5);
        if (i > 0) a.add(correction);
        if (i + 1 < SEGMENTS - 1) b.sub(correction);
      }
      this.points[0].position.copy(start);
      this.points[SEGMENTS - 1].position.copy(end);
    }

    const array = this.geometry.attributes.position.array;
    for (let i = 0; i < SEGMENTS; i++) {
      const p = this.points[i].position;
      array[i * 3] = p.x;
      array[i * 3 + 1] = p.y;
      array[i * 3 + 2] = p.z;
    }
    this.geometry.attributes.position.needsUpdate = true;
    this.geometry.computeBoundingSphere();
  }

  /** La línea muy tensa se ve más fina y clara. */
  setTension(ratio) {
    this.material.opacity = clamp(0.5 + ratio * 0.45, 0.5, 0.98);
    this.material.color.setHSL(0.55 - ratio * 0.55, ratio * 0.7, 0.85);
  }

  setVisible(value) { this.mesh.visible = value; }

  dispose() {
    this.geometry.dispose();
    this.material.dispose();
  }
}

/* ===== src/fishing/Lure.js ===== */
/**
 * Señuelo/flotador: vuelo balístico, entrada en el agua y trabajo sumergido.
 *
 * Cada señuelo del catálogo tiene su profundidad de trabajo: la cucharilla
 * pesada baja al fondo, el popper se queda en superficie. Al recoger, sube
 * hacia su profundidad y genera "acción", que es lo que despierta a los peces.
 */

const LureState = {
  STOWED: 'stowed',
  FLYING: 'flying',
  WATER: 'water',
  LANDED: 'landed'      // en tierra: lanzamiento fallido
};

const AIR_DRAG = 0.16;
const GRAVITY_Y = -9.81;

class Lure {
  constructor(scene) {
    this.state = LureState.STOWED;
    this.position = new THREE.Vector3();
    this.velocity = new THREE.Vector3();
    this.depthTarget = 0;
    this.action = 0;          // 0..1, cuánto se está moviendo bajo el agua
    this.submergedTime = 0;

    const group = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.SphereGeometry(0.055, 10, 8),
      new THREE.MeshStandardMaterial({ color: 0xd8402c, roughness: 0.35, metalness: 0.45 })
    );
    body.scale.set(1, 1, 1.7);
    group.add(body);
    const blade = new THREE.Mesh(
      new THREE.SphereGeometry(0.04, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0xd9d2b0, roughness: 0.2, metalness: 0.9 })
    );
    blade.scale.set(0.4, 1.2, 0.9);
    blade.position.z = 0.08;
    group.add(blade);

    this.object = group;
    this.object.visible = false;
    scene.add(this.object);
  }

  cast(origin, direction, speed, lure) {
    this.position.copy(origin);
    this.velocity.copy(direction).normalize().multiplyScalar(speed);
    this.state = LureState.FLYING;
    this.depthTarget = lure.workingDepth;
    this.submergedTime = 0;
    this.action = 0;
    this.object.visible = true;
  }

  stow() {
    this.state = LureState.STOWED;
    this.object.visible = false;
    this.action = 0;
  }

  get isFishable() { return this.state === LureState.WATER; }

  /**
   * @param retrieve  0..1 cuánto está recogiendo el jugador
   * @returns evento de entrada en el agua, para salpicadura y sonido
   */
  update(dt, { terrain, waterLevel, retrieve = 0, rodTip, retrieveSpeed = 1.5, wind }) {
    let event = null;

    if (this.state === LureState.FLYING) {
      this.velocity.y += GRAVITY_Y * dt;
      this.velocity.addScaledVector(this.velocity.clone().normalize(), -AIR_DRAG * this.velocity.length() * dt);
      if (wind) this.velocity.addScaledVector(wind, dt * 0.06);
      this.position.addScaledVector(this.velocity, dt);

      const bed = terrain.heightAt(this.position.x, this.position.z);
      if (this.position.y <= waterLevel && bed < waterLevel) {
        this.position.y = waterLevel;
        this.state = LureState.WATER;
        this.velocity.set(0, 0, 0);
        this.submergedTime = 0;
        event = { type: 'splash', position: this.position.clone(), strength: 1 };
      } else if (this.position.y <= bed) {
        this.position.y = bed;
        this.state = LureState.LANDED;
        this.velocity.set(0, 0, 0);
        event = { type: 'ground', position: this.position.clone() };
      }
    } else if (this.state === LureState.WATER) {
      this.submergedTime += dt;
      const bed = terrain.heightAt(this.position.x, this.position.z);
      const maxDepth = Math.max(0.15, waterLevel - bed - 0.08);

      // Hundimiento hasta su profundidad de trabajo; al recoger, sube.
      const sinkTarget = waterLevel - clamp(this.depthTarget, 0, maxDepth);
      const workTarget = waterLevel - clamp(this.depthTarget * (1 - retrieve * 0.55), 0, maxDepth);
      const target = retrieve > 0.05 ? workTarget : sinkTarget;
      const sinkRate = retrieve > 0.05 ? 3.2 : 0.55;
      this.position.y = damp(this.position.y, target, sinkRate, dt);

      if (retrieve > 0.05 && rodTip) {
        const toRod = rodTip.clone().setY(this.position.y).sub(this.position);
        const distance = toRod.length();
        if (distance > 0.01) {
          const step = Math.min(distance, retrieveSpeed * retrieve * dt);
          this.position.addScaledVector(toRod.divideScalar(distance), step);
        }
      }

      // La "acción" decae si el señuelo está quieto.
      this.action = damp(this.action, retrieve, 6, dt);
      this.object.rotation.z += this.action * dt * 6;
    }

    this.object.position.copy(this.position);
    if (this.state === LureState.FLYING && this.velocity.lengthSq() > 0.01) {
      this.object.lookAt(this.position.clone().add(this.velocity));
    }
    return event;
  }

  dispose() {
    this.object.traverse((o) => {
      if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); }
    });
  }
}

/* ===== src/fishing/Rod.js ===== */
/**
 * Caña en primera persona.
 *
 * Es un tubo generado sobre una curva: al subir la tensión, la puntera se
 * dobla de verdad (se recalcula la curva), en vez de rotar la malla entera.
 * La puntera es también el ancla de la línea, así que lo que se ve y lo que
 * simula la física es el mismo punto.
 */
class Rod {
  constructor(camera, equipment) {
    this.equipment = equipment;
    this.bend = 0;
    this.targetBend = 0;
    this.sway = new THREE.Vector2();

    this.group = new THREE.Group();
    this.group.position.set(0.42, -0.34, -0.42);
    this.group.rotation.set(0.05, -0.3, 0.2);
    camera.add(this.group);

    this.material = new THREE.MeshStandardMaterial({ color: 0x4a5158, roughness: 0.35, metalness: 0.35 });
    this.gripMaterial = new THREE.MeshStandardMaterial({ color: 0x4a3527, roughness: 0.9 });

    const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.026, 0.28, 8), this.gripMaterial);
    grip.rotation.x = Math.PI / 2;
    grip.position.z = 0.1;
    this.group.add(grip);

    const reelSeat = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.06, 10),
      new THREE.MeshStandardMaterial({ color: 0x8b8f96, roughness: 0.3, metalness: 0.8 }));
    reelSeat.position.set(0, -0.05, 0.02);
    this.group.add(reelSeat);
    this.reelSeat = reelSeat;

    this._buildBlank();
    this.tip = new THREE.Object3D();
    this.group.add(this.tip);
  }

  _buildBlank() {
    if (this.blank) {
      this.group.remove(this.blank);
      this.blank.geometry.dispose();
    }
    this.curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0, -0.45),
      new THREE.Vector3(0, 0, -0.9),
      new THREE.Vector3(0, 0, -1.35)
    ]);
    this.blank = new THREE.Mesh(
      new THREE.TubeGeometry(this.curve, 20, 0.007, 5, false),
      this.material
    );
    this.group.add(this.blank);
  }

  /** `tensionRatio` 0..1 respecto a la resistencia de la caña. */
  update(dt, tensionRatio, lookDelta) {
    this.targetBend = clamp(tensionRatio, 0, 1.2);
    this.bend = damp(this.bend, this.targetBend, 7, dt);

    // Balanceo suave al mover la vista: la caña "pesa".
    this.sway.x = damp(this.sway.x, clamp(-lookDelta.x * 0.0016, -0.06, 0.06), 6, dt);
    this.sway.y = damp(this.sway.y, clamp(-lookDelta.y * 0.0016, -0.06, 0.06), 6, dt);
    this.group.rotation.z = 0.16 + this.sway.x;
    this.group.rotation.x = 0.06 + this.sway.y;

    const b = this.bend;
    const points = this.curve.points;
    points[1].set(0, -b * 0.04, -0.45);
    points[2].set(0, -b * 0.16, -0.88);
    points[3].set(0, -b * 0.38, -1.3 + b * 0.06);
    this.curve.needsUpdate = true;

    const geometry = new THREE.TubeGeometry(this.curve, 20, 0.007, 5, false);
    this.blank.geometry.dispose();
    this.blank.geometry = geometry;

    this.tip.position.copy(points[3]);
  }

  /** Puntera en coordenadas de mundo: de ahí sale la línea. */
  worldTip(out = new THREE.Vector3()) {
    return this.tip.getWorldPosition(out);
  }

  setVisible(value) { this.group.visible = value; }

  dispose() {
    this.blank.geometry.dispose();
    this.material.dispose();
    this.gripMaterial.dispose();
  }
}

/* ===== src/fishing/FishingSystem.js ===== */
/**
 * Sistema de pesca: lanzamiento, espera, picada, clavada y pelea.
 *
 * El modelo de tensión es el núcleo de todo:
 *
 *   tensión = rigidez · (distancia_al_pez − hilo_soltado)
 *
 * Es decir, la línea sólo tira cuando hay menos hilo fuera que distancia. De
 * ahí salen solos los tres comportamientos que se esperan de un carrete:
 *
 *  - Recoger acorta el hilo → sube la tensión.
 *  - El freno deja escapar hilo cuando la tensión lo supera → la carrera del
 *    pez se "paga" con metros, no con vida.
 *  - Demasiada holgura mantenida → el anzuelo se desprende.
 *
 * Si la tensión supera la resistencia de la línea, rompe.
 */

const FishingState = {
  IDLE: 'idle',
  AIMING: 'aiming',
  CASTING: 'casting',
  FISHING: 'fishing',
  BITE: 'bite',
  FIGHTING: 'fighting',
  LANDED: 'landed'
};

const SLACK_TOLERANCE = 1.4;      // metros de holgura antes de arriesgar el anzuelo
const SLACK_GRACE = 2.2;          // segundos de holgura que aguanta el anzuelo
const LAND_DISTANCE = 2.2;

class FishingSystem {
  constructor({ scene, camera, terrain, water, fishManager, equipment, events }) {
    this.scene = scene;
    this.camera = camera;
    this.terrain = terrain;
    this.water = water;
    this.fishManager = fishManager;
    this.equipment = equipment;
    this.events = events;

    this.rod = new Rod(camera, equipment);
    this.line = new FishingLine(scene);
    this.lure = new Lure(scene);

    this.state = FishingState.IDLE;
    this.power = 0;              // carga del lanzamiento 0..1
    this.charging = false;
    this.lineOut = 0;
    this.tension = 0;
    this.dragSetting = 0.45;     // 0..1 del freno máximo
    this.slackTimer = 0;
    this.hooked = null;
    this.biteTimer = 0;
    this.retrieveInput = 0;
    this.message = null;
    this.lastCatch = null;

    this._rodTip = new THREE.Vector3();
    this._tmp = new THREE.Vector3();
  }

  get stats() { return this.equipment.stats; }
  get tensionRatio() { return clamp(this.tension / this.stats.lineStrength, 0, 1.4); }
  get dragForce() { return this.dragSetting * this.stats.maxDrag; }
  get canCast() { return this.state === FishingState.IDLE; }

  // ---------------------------------------------------------------- entrada
  beginCast() {
    if (!this.canCast) return;
    this.state = FishingState.AIMING;
    this.charging = true;
    this.power = 0;
  }

  releaseCast() {
    if (this.state !== FishingState.AIMING) return;
    this.charging = false;

    const direction = new THREE.Vector3();
    this.camera.getWorldDirection(direction);
    // Se lanza algo por encima de la línea de visión, como en la realidad.
    direction.y += 0.22;
    direction.normalize();

    const distance = this.stats.castDistance * (0.25 + 0.75 * this.power);
    const speed = Math.sqrt(distance * 9.81 / Math.max(0.35, Math.sin(2 * Math.asin(clamp(direction.y, -0.99, 0.99)))));
    const launchSpeed = clamp(isFinite(speed) ? speed : 18, 6, 34);

    this.rod.worldTip(this._rodTip);
    this.lure.cast(this._rodTip, direction, launchSpeed, this.equipment.lure);
    this.line.reset(this._rodTip, this.lure.position);
    this.line.setVisible(true);
    this.lineOut = 1;
    this.tension = 0;
    this.state = FishingState.CASTING;
    this.events?.onCast?.(this.power);
    this.power = 0;
  }

  /** Clavada. Sólo sirve durante la ventana de picada. */
  strike() {
    if (this.state === FishingState.BITE) {
      const fish = this.fishManager.biting;
      if (fish) {
        fish.setState(FishState.FIGHTING);
        this.hooked = fish;
        this.state = FishingState.FIGHTING;
        this.slackTimer = 0;
        // La línea queda tensa pero sin estirar: sin esto, el desfase que
        // acumula el recogido se convertiría en un pico de tensión que rompe
        // el hilo en el mismo instante de clavar.
        this.lineOut = Math.max(this.lineOut, this._rodTip.distanceTo(fish.position) + 0.15);
        this.fight = {
          stamina: 1,
          burst: 0,
          burstTimer: 1 + Math.random() * 2,
          jumping: 0,
          runsLeft: fish.species.fight.runs
        };
        this.events?.onHookSet?.(fish);
        return true;
      }
    }
    if (this.state === FishingState.FISHING || this.state === FishingState.CASTING) {
      // Clavada en falso: se recoge el señuelo.
      this.reelIn('Clavada en vacío');
    }
    return false;
  }

  reelIn(reason = null) {
    // Sin esto, seguir pulsando recoger al terminar un lance hacía que el
    // siguiente se recuperase solo nada más tocar el agua.
    this.retrieveInput = 0;
    this.lure.stow();
    this.line.setVisible(false);
    if (this.hooked) this.fishManager.release(this.hooked);
    this.hooked = null;
    this.fight = null;
    this.state = FishingState.IDLE;
    this.tension = 0;
    this.lineOut = 0;
    if (reason) this._say(reason);
  }

  adjustDrag(delta) {
    this.dragSetting = clamp(this.dragSetting + delta, 0.05, 1);
  }

  setRetrieve(amount) { this.retrieveInput = clamp(amount, 0, 1); }

  _say(text, kind = 'info') {
    this.message = { text, kind, time: 0 };
    this.events?.onMessage?.(text, kind);
  }

  // ----------------------------------------------------------------- update
  update(dt, context) {
    this.rod.worldTip(this._rodTip);
    const stats = this.stats;

    if (this.charging) {
      this.power = Math.min(1, this.power + dt * 0.85);
    }

    const event = this.lure.update(dt, {
      terrain: this.terrain,
      waterLevel: this.terrain.waterLevel,
      retrieve: this.state === FishingState.FIGHTING ? 0 : this.retrieveInput,
      rodTip: this._rodTip,
      retrieveSpeed: stats.retrieveSpeed,
      wind: context.wind
    });

    if (event?.type === 'splash') {
      this.water.splash(event.position, 0.8);
      this.events?.onSplash?.(event.position);
      this.state = FishingState.FISHING;
      this.lineOut = this._rodTip.distanceTo(this.lure.position) + 0.3;
    } else if (event?.type === 'ground') {
      this._say('El señuelo ha caído en tierra');
      this.state = FishingState.FISHING;
      this.lineOut = this._rodTip.distanceTo(this.lure.position) + 0.3;
    }

    switch (this.state) {
      case FishingState.CASTING: this._updateCasting(dt); break;
      case FishingState.FISHING: this._updateFishing(dt, context); break;
      case FishingState.BITE: this._updateBite(dt, context); break;
      case FishingState.FIGHTING: this._updateFight(dt, context); break;
      default: break;
    }

    this._updateLineVisual(dt, context);
    this.rod.update(dt, clamp(this.tension / Math.max(1, stats.rodStrength), 0, 1.2), context.lookDelta);
    if (this.message) {
      this.message.time += dt;
      if (this.message.time > 3.5) this.message = null;
    }
  }

  _updateCasting() {
    this.lineOut = Math.max(this.lineOut, this._rodTip.distanceTo(this.lure.position) + 0.2);
  }

  _updateFishing(dt, context) {
    if (!this.lure.isFishable) return;

    // Recoger acorta el hilo; si llega al final, el lance ha terminado.
    if (this.retrieveInput > 0.05) {
      const toLure = this._rodTip.distanceTo(this.lure.position);
      this.lineOut = Math.max(0.6, this.lineOut - this.stats.retrieveSpeed * this.retrieveInput * dt);
      // El señuelo tarda en seguir al carrete; sin este tope el hilo "fuera"
      // se quedaría por debajo de la distancia real.
      this.lineOut = Math.max(this.lineOut, toLure);
      if (toLure < 1.4) {
        this.reelIn();
        return;
      }
    }

    this.fishManager.evaluate({
      lurePosition: this.lure.position,
      lure: this.equipment.lure,
      hour: context.hour,
      weatherModifier: context.weatherModifier,
      lureAction: this.lure.action * this.stats.lureAction,
      feeding: context.feeding
    });

    if (this.fishManager.biting) {
      this.state = FishingState.BITE;
      this.biteTimer = 0;
      this.water.splash(this.lure.position, 0.5);
      this.events?.onBite?.(this.fishManager.biting);
    }
  }

  _updateBite(dt) {
    this.biteTimer += dt;
    const fish = this.fishManager.biting;
    if (!fish) {
      // Lo ha soltado sin que reaccionáramos.
      this.state = FishingState.FISHING;
      this._say('Se ha soltado');
      return;
    }
    // Tirones visibles en el señuelo mientras el pez lo tiene en la boca.
    this.lure.position.lerp(fish.position, 0.35 * dt * 4);
    this.lineOut = Math.max(0.8, this.lineOut - dt * 0.4);
  }

  _updateFight(dt, context) {
    const fish = this.hooked;
    if (!fish) { this.state = FishingState.FISHING; return; }

    const stats = this.stats;
    const f = this.fight;
    const species = fish.species;

    // --- comportamiento del pez -------------------------------------------
    f.burstTimer -= dt;
    if (f.burstTimer <= 0) {
      const wantsRun = f.runsLeft > 0 && f.stamina > 0.25 && Math.random() < 0.55 + this.tensionRatio * 0.3;
      if (wantsRun) {
        f.burst = 1;
        f.runsLeft -= 1;
        f.burstTimer = 1.2 + Math.random() * 1.8;
        this.events?.onRun?.(fish);
      } else {
        f.burst = 0;
        f.burstTimer = 0.8 + Math.random() * 1.6;
      }
      if (Math.random() < species.fight.jumpChance * 0.5 && f.stamina > 0.3) {
        f.jumping = 0.55;
        this.events?.onJump?.(fish);
      }
    }
    f.burst = damp(f.burst, f.burst > 0.5 ? 1 : 0, 4, dt);

    // Nada alejándose del pescador, con sacudidas laterales.
    const away = fish.position.clone().sub(this._rodTip).setY(0);
    if (away.lengthSq() < 0.01) away.set(1, 0, 0);
    away.normalize();
    const shake = Math.sin(context.time * 6 * species.fight.headshake) * 0.5;
    away.applyAxisAngle(new THREE.Vector3(0, 1, 0), shake);

    // El tirón crece con el peso, pero de forma sublineal: un siluro de 50 kg
    // es muchísimo más fuerte que una perca, no cien veces más.
    const power = species.strength
      * (0.5 + Math.pow(fish.weight, 0.45) * 0.7)
      * (0.5 + f.burst * 1.2)
      * (0.25 + 0.75 * f.stamina);
    const pullSpeed = species.speed * 0.42 * (0.4 + f.burst) * clamp(f.stamina, 0.12, 1);
    // La tensión frena al pez: tirar cansa a los dos.
    const resisted = pullSpeed / (1 + this.tensionRatio * 1.6);

    fish.velocity.copy(away).multiplyScalar(resisted);
    if (f.jumping > 0) {
      f.jumping -= dt;
      fish.velocity.y = 2.4;                    // salto fuera del agua
    } else {
      const bed = this.terrain.heightAt(fish.position.x, fish.position.z);
      const target = clamp(this.terrain.waterLevel - 0.6, bed + 0.25, this.terrain.waterLevel - 0.15);
      fish.velocity.y = (target - fish.position.y) * 0.8;
    }
    fish.position.addScaledVector(fish.velocity, dt);
    // No se mete en la orilla: si toca fondo, gira.
    const bed = this.terrain.heightAt(fish.position.x, fish.position.z);
    if (fish.position.y < bed + 0.12) fish.position.y = bed + 0.12;

    // --- carrete y línea ---------------------------------------------------
    const distance = this._rodTip.distanceTo(fish.position);
    if (this.retrieveInput > 0.05) {
      // Cuanta más tensión, más cuesta recuperar hilo.
      const effort = stats.retrieveSpeed * this.retrieveInput / (1 + this.tensionRatio * 2.2);
      this.lineOut = Math.max(0.8, this.lineOut - effort * dt);
    }

    // La línea es una cuerda: si hay menos hilo fuera que distancia, el pez
    // viene hacia la caña. Cuanto más cansado, menos se resiste — y eso es lo
    // que convierte "cansarlo" en la forma de cobrarlo.
    let stretch = distance - this.lineOut;
    const netPull = this.tension - power * 0.85;
    if (stretch > 0 && netPull > 0) {
      const rate = netPull * 0.5 * (1 + (1 - f.stamina) * 2.4);
      const give = Math.min(stretch, rate * dt);
      const toRod = this._rodTip.clone().sub(fish.position).normalize();
      fish.position.addScaledVector(toRod, give);
      stretch -= give;
    }

    // El freno es un embrague: mientras la carga lo supere, el carrete cede
    // hilo y la tensión se queda clavada en el valor del freno. Lo único que
    // lo atraviesa son los picos (embestidas y saltos), y por eso apretar el
    // freno al máximo es la forma más rápida de romper la línea.
    const stiffness = lerp(9, 3.5, stats.elasticity);
    const load = Math.max(0, stretch) * stiffness + power * 0.55;
    const slipping = load > this.dragForce;
    const shock = slipping ? Math.min(load - this.dragForce, load * 0.2) * (1 - stats.elasticity * 0.5) : 0;
    this.tension = damp(this.tension, Math.min(load, this.dragForce + shock), 11, dt);

    if (slipping) {
      const slip = (load - this.dragForce) * 0.4;
      this.lineOut = Math.min(stats.capacity, this.lineOut + slip * dt);
      this.events?.onDragSlip?.(slip);
    }

    // El pez se cansa por la tensión sostenida.
    const drain = (0.028 + this.tensionRatio * 0.16) / species.stamina;
    f.stamina = clamp(f.stamina - drain * dt, 0, 1);
    fish.energy = f.stamina;

    // --- desenlaces --------------------------------------------------------
    if (this.tension > stats.lineStrength) {
      this._breakLine(fish);
      return;
    }
    if (this.lineOut >= stats.capacity - 0.5) {
      this._breakLine(fish, 'Se acabó el hilo del carrete');
      return;
    }

    // El hilo que cede el freno no es holgura: el pez se lo está llevando.
    // Sólo cuenta como holgura si la línea se afloja sin que nadie tire.
    const slack = this.lineOut - distance;
    if (!slipping && slack > SLACK_TOLERANCE) {
      this.slackTimer += dt;
      if (this.slackTimer > SLACK_GRACE) {
        this._loseFish(fish, 'Demasiada holgura: el anzuelo se ha soltado');
        return;
      }
    } else {
      this.slackTimer = Math.max(0, this.slackTimer - dt * 1.5);
    }

    if (distance < LAND_DISTANCE && f.stamina < 0.3) {
      this._land(fish);
    }
  }

  _breakLine(fish, reason = 'La línea ha roto') {
    this.retrieveInput = 0;
    this.events?.onLineBreak?.(fish);
    this.fishManager.release(fish);
    this.hooked = null;
    this.fight = null;
    this.lure.stow();
    this.line.setVisible(false);
    this.state = FishingState.IDLE;
    this.tension = 0;
    this._say(reason, 'bad');
  }

  _loseFish(fish, reason) {
    this.retrieveInput = 0;
    this.events?.onFishLost?.(fish);
    this.fishManager.release(fish);
    this.hooked = null;
    this.fight = null;
    this.lure.stow();
    this.line.setVisible(false);
    this.state = FishingState.IDLE;
    this.tension = 0;
    this._say(reason, 'bad');
  }

  _land(fish) {
    this.retrieveInput = 0;
    this.state = FishingState.LANDED;
    this.lastCatch = fish;
    this.tension = 0;
    this.lure.stow();
    this.line.setVisible(false);
    this.water.splash(fish.position, 1.4);
    this.events?.onLanded?.(fish);
    this.hooked = null;
    this.fight = null;
  }

  /** Se llama desde la UI cuando el jugador cierra la ficha de captura. */
  finishCatch(keep = true) {
    const fish = this.lastCatch;
    this.lastCatch = null;
    this.state = FishingState.IDLE;
    if (fish) {
      if (keep) this.fishManager.remove(fish);
      else this.fishManager.release(fish);
    }
  }

  _updateLineVisual(dt, context) {
    if (!this.line.mesh.visible) return;
    const end = this.hooked ? this.hooked.position : this.lure.position;
    const visualLineOut = this.state === FishingState.FIGHTING
      ? this.lineOut
      : Math.max(this.lineOut, this._rodTip.distanceTo(end));
    this.line.update(dt, this._rodTip, end, visualLineOut, context.wind);
    this.line.setTension(this.tensionRatio);
  }

  /** Datos para el HUD. */
  get hud() {
    return {
      state: this.state,
      power: this.power,
      tension: this.tension,
      tensionRatio: this.tensionRatio,
      lineStrength: this.stats.lineStrength,
      drag: this.dragForce,
      dragSetting: this.dragSetting,
      lineOut: this.lineOut,
      capacity: this.stats.capacity,
      lure: this.equipment.lure,
      hooked: this.hooked ? {
        name: this.hooked.displayName,
        weight: this.hooked.weight,
        stamina: this.fight?.stamina ?? 1
      } : null,
      message: this.message
    };
  }

  dispose() {
    this.rod.dispose();
    this.line.dispose();
    this.lure.dispose();
  }
}

/* ===== src/player/Player.js ===== */
/**
 * Jugador en primera persona.
 *
 * La cámara vive dentro de un "rig" para dejar preparada la tercera persona:
 * basta con alejar `camera` del pivote y añadir un modelo visible; el resto
 * del control no cambia. El movimiento sigue el terreno de forma analítica
 * (sin física de cuerpos) y sólo lanza un rayo hacia abajo para subirse al
 * muelle y demás construcciones.
 */

const EYE_HEIGHT = 1.68;
const WALK_SPEED = 3.1;
const RUN_SPEED = 5.6;
const WADE_DEPTH = 1.05;

class Player {
  constructor(camera, terrain, { spawn = new THREE.Vector3(0, 0, 0), walkables = [] } = {}) {
    this.terrain = terrain;
    this.camera = camera;
    this.walkables = walkables;

    this.rig = new THREE.Object3D();
    this.rig.position.copy(spawn);
    this.rig.add(camera);
    camera.position.set(0, EYE_HEIGHT, 0);

    this.yaw = 0;
    this.pitch = 0;
    this.velocity = new THREE.Vector3();
    this.grounded = true;
    this.bobPhase = 0;
    this.bobAmount = 0;
    this.surface = 'tierra';
    this.mode = 'first';          // 'first' | 'third' (preparado, no expuesto aún)
    this.thirdPersonDistance = 3.4;

    this._raycaster = new THREE.Raycaster();
    this._down = new THREE.Vector3(0, -1, 0);
    this._forward = new THREE.Vector3();
    this._right = new THREE.Vector3();
    this.lookDelta = new THREE.Vector2();
  }

  get position() { return this.rig.position; }

  /** Altura pisable: terreno o cualquier estructura por encima (muelle, barca). */
  groundHeight(x, z) {
    const terrainY = this.terrain.heightAt(x, z);
    if (!this.walkables.length) return { y: terrainY, surface: 'tierra' };

    this._raycaster.set(new THREE.Vector3(x, terrainY + 6, z), this._down);
    this._raycaster.far = 8;
    const hits = this._raycaster.intersectObjects(this.walkables, true);
    if (hits.length && hits[0].point.y > terrainY + 0.15) {
      return { y: hits[0].point.y, surface: 'madera' };
    }
    return { y: terrainY, surface: terrainY < this.terrain.waterLevel ? 'agua' : 'tierra' };
  }

  look(dx, dy, sensitivity = 1, invertY = false) {
    this.lookDelta.set(dx, dy);
    this.yaw -= dx * 0.0022 * sensitivity;
    this.pitch -= dy * 0.0022 * sensitivity * (invertY ? -1 : 1);
    this.pitch = clamp(this.pitch, -Math.PI / 2 + 0.05, Math.PI / 2 - 0.05);
  }

  update(dt, input) {
    const forwardInput = (input.isDown('KeyW') ? 1 : 0) - (input.isDown('KeyS') ? 1 : 0);
    const strafeInput = (input.isDown('KeyD') ? 1 : 0) - (input.isDown('KeyA') ? 1 : 0);
    const running = input.isDown('ShiftLeft') || input.isDown('ShiftRight');

    this._forward.set(Math.sin(this.yaw), 0, Math.cos(this.yaw)).multiplyScalar(-1);
    this._right.set(this._forward.z, 0, -this._forward.x);

    const wish = new THREE.Vector3()
      .addScaledVector(this._forward, forwardInput)
      .addScaledVector(this._right, strafeInput);
    if (wish.lengthSq() > 0) wish.normalize();

    const depth = this.terrain.depthAt(this.rig.position.x, this.rig.position.z);
    // Andar dentro del agua cuesta; a partir de cierto calado no se avanza.
    const wadeFactor = depth > 0 ? clamp(1 - depth / WADE_DEPTH, 0.25, 1) : 1;
    const speed = (running ? RUN_SPEED : WALK_SPEED) * wadeFactor;

    this.velocity.x = damp(this.velocity.x, wish.x * speed, 12, dt);
    this.velocity.z = damp(this.velocity.z, wish.z * speed, 12, dt);

    const next = this.rig.position.clone().addScaledVector(this.velocity, dt);
    const ground = this.groundHeight(next.x, next.z);
    const nextDepth = this.terrain.waterLevel - ground.y;

    // Bloqueo suave: no se entra a nadar.
    if (ground.surface === 'agua' && nextDepth > WADE_DEPTH) {
      this.velocity.multiplyScalar(0.1);
    } else {
      this.rig.position.x = next.x;
      this.rig.position.z = next.z;
    }

    const target = this.groundHeight(this.rig.position.x, this.rig.position.z);
    this.surface = target.surface;
    this.rig.position.y = damp(this.rig.position.y, target.y, 14, dt);

    // Balanceo de cabeza proporcional a la velocidad real.
    const horizontalSpeed = Math.hypot(this.velocity.x, this.velocity.z);
    this.stepping = horizontalSpeed > 0.6;
    this.bobPhase += dt * horizontalSpeed * 2.1;
    this.bobAmount = damp(this.bobAmount, clamp(horizontalSpeed / RUN_SPEED, 0, 1), 6, dt);

    const bobY = Math.sin(this.bobPhase * 2) * 0.035 * this.bobAmount;
    const bobX = Math.cos(this.bobPhase) * 0.028 * this.bobAmount;

    this.rig.rotation.y = this.yaw;
    this.camera.rotation.set(this.pitch, 0, bobX * 0.35);
    this.camera.position.set(
      this.mode === 'third' ? 0 : bobX * 0.5,
      EYE_HEIGHT + bobY,
      this.mode === 'third' ? this.thirdPersonDistance : 0
    );

    this.lookDelta.multiplyScalar(0.82);
    return { speed: horizontalSpeed, surface: this.surface, depth: Math.max(0, depth) };
  }

  /** Prepara la tercera persona sin cambiar el resto del control. */
  setCameraMode(mode) {
    this.mode = mode === 'third' ? 'third' : 'first';
  }

  teleport(position) {
    this.rig.position.copy(position);
    const g = this.groundHeight(position.x, position.z);
    this.rig.position.y = g.y;
  }
}

/* ===== src/ui/UI.js ===== */
/**
 * Interfaz: HUD de pesca y pantallas (equipo, tienda, capturas, estadísticas,
 * ajustes y pausa).
 *
 * La UI no toca el estado del juego directamente: recibe datos en `update()` y
 * comunica intenciones por callbacks. Así se puede rediseñar sin arriesgar la
 * lógica.
 */

const CSS = `
.sw-root, .sw-root * { box-sizing: border-box; margin: 0; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
.sw-root { position: fixed; inset: 0; pointer-events: none; color: #eef4f6; z-index: 10;
  --panel: rgba(14,19,24,.92); --edge: rgba(255,255,255,.12); --dim: #9fb0bb;
  --accent: #6fd3c7; --warn: #f2c14e; --bad: #e2604a; --good: #74d68a; }
.sw-root button { font: inherit; color: inherit; cursor: pointer; pointer-events: auto; }

.sw-crosshair { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px;
  border-radius: 50%; background: rgba(255,255,255,.75); box-shadow: 0 0 4px rgba(0,0,0,.8); }

.sw-topbar { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px; align-items: center; }
.sw-chip { background: var(--panel); border: 1px solid var(--edge); border-radius: 8px;
  padding: 5px 11px; font-size: 12px; letter-spacing: .02em; display: flex; gap: 7px; align-items: baseline; backdrop-filter: blur(8px); }
.sw-chip b { font-variant-numeric: tabular-nums; font-weight: 600; }
.sw-chip .k { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
.sw-money b { color: var(--warn); }

.sw-gear { position: absolute; left: 16px; bottom: 16px; background: var(--panel);
  border: 1px solid var(--edge); border-radius: 10px; padding: 10px 13px; min-width: 205px; backdrop-filter: blur(8px); }
.sw-gear h4 { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--dim); font-weight: 500; margin-bottom: 6px; }
.sw-gear .row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; padding: 2px 0; }
.sw-gear .row span:last-child { color: var(--dim); font-variant-numeric: tabular-nums; }

.sw-tension { position: absolute; right: 18px; bottom: 16px; width: 190px; background: var(--panel);
  border: 1px solid var(--edge); border-radius: 10px; padding: 11px 13px; backdrop-filter: blur(8px); }
.sw-tension .label { display: flex; justify-content: space-between; font-size: 10px;
  text-transform: uppercase; letter-spacing: .12em; color: var(--dim); margin-bottom: 5px; }
.sw-tension .label b { color: #eef4f6; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.sw-bar { height: 9px; border-radius: 99px; background: rgba(255,255,255,.09); overflow: hidden; position: relative; }
.sw-bar i { display: block; height: 100%; width: 0; background: var(--good); transition: width .06s linear, background .2s; }
.sw-bar .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: rgba(255,255,255,.8); }
.sw-tension .sub { margin-top: 9px; }

.sw-prompt { position: absolute; left: 50%; bottom: 88px; transform: translateX(-50%); text-align: center; width: 460px; }
.sw-prompt .big { font-size: 26px; font-weight: 700; letter-spacing: .01em; text-shadow: 0 2px 12px rgba(0,0,0,.9); }
.sw-prompt .small { font-size: 13px; color: #d6e2e8; text-shadow: 0 2px 8px rgba(0,0,0,.9); margin-top: 3px; }
.sw-prompt .bite { color: var(--warn); animation: swpulse .45s ease-in-out infinite alternate; }
@keyframes swpulse { from { transform: scale(1); } to { transform: scale(1.05); } }
.sw-power { width: 260px; height: 10px; margin: 8px auto 0; border-radius: 99px;
  background: rgba(0,0,0,.55); border: 1px solid var(--edge); overflow: hidden; }
.sw-power i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--warn)); }

.sw-toast { position: absolute; left: 50%; top: 90px; transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 15px; font-size: 13px; }
.sw-toast.bad { border-color: rgba(226,96,74,.6); color: #ffc9bd; }

.sw-overlay { position: absolute; inset: 0; background: rgba(6,10,13,.82); backdrop-filter: blur(7px);
  display: flex; align-items: center; justify-content: center; pointer-events: auto; padding: 22px; }
.sw-panel { background: #0e1318; border: 1px solid var(--edge); border-radius: 14px;
  width: min(760px, 100%); max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 30px 80px -30px #000; }
.sw-panel > header { display: flex; align-items: center; justify-content: space-between;
  padding: 15px 18px; border-bottom: 1px solid var(--edge); }
.sw-panel h2 { font-size: 17px; font-weight: 650; }
.sw-panel .body { padding: 16px 18px 20px; overflow-y: auto; }
.sw-close { background: none; border: none; font-size: 22px; line-height: 1; color: var(--dim); padding: 2px 6px; }
.sw-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.sw-tabs button { background: rgba(255,255,255,.05); border: 1px solid var(--edge); border-radius: 7px;
  padding: 7px 13px; font-size: 12px; font-weight: 550; }
.sw-tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #06231f; }

.sw-item { display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 11px 13px; border: 1px solid var(--edge); border-radius: 9px; margin-bottom: 7px; background: rgba(255,255,255,.03); }
.sw-item .t { font-size: 14px; font-weight: 600; }
.sw-item .d { font-size: 11.5px; color: var(--dim); margin-top: 3px; line-height: 1.45; }
.sw-item .stats { font-size: 11px; color: var(--accent); margin-top: 4px; font-variant-numeric: tabular-nums; }
.sw-item .act { display: flex; gap: 6px; flex-shrink: 0; }
.sw-btn { background: var(--accent); border: 1px solid var(--accent); color: #06231f;
  border-radius: 7px; padding: 7px 13px; font-size: 12px; font-weight: 650; white-space: nowrap; }
.sw-btn.ghost { background: transparent; color: #eef4f6; border-color: var(--edge); }
.sw-btn:disabled { opacity: .35; cursor: not-allowed; }
.sw-item.equipped { border-color: rgba(111,211,199,.55); }
.sw-tag { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }

.sw-catch { text-align: center; }
.sw-catch .name { font-size: 26px; font-weight: 700; }
.sw-catch .latin { font-style: italic; color: var(--dim); font-size: 13px; margin-top: 2px; }
.sw-catch .measures { display: flex; gap: 26px; justify-content: center; margin: 18px 0; }
.sw-catch .measures div { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; }
.sw-catch .measures b { display: block; font-size: 25px; color: #eef4f6; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.sw-catch .badges { display: flex; gap: 7px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
.sw-badge { font-size: 10px; text-transform: uppercase; letter-spacing: .11em; padding: 4px 10px;
  border-radius: 99px; border: 1px solid currentColor; }
.sw-actions { display: flex; gap: 9px; justify-content: center; }

.sw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.sw-card { border: 1px solid var(--edge); border-radius: 9px; padding: 11px 12px; background: rgba(255,255,255,.03); }
.sw-card .t { font-size: 13px; font-weight: 600; }
.sw-card .m { font-size: 11px; color: var(--dim); margin-top: 3px; font-variant-numeric: tabular-nums; }
.sw-card.unknown { opacity: .45; }
.sw-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 9px; }
.sw-stat { border: 1px solid var(--edge); border-radius: 9px; padding: 11px 12px; }
.sw-stat .k { font-size: 10px; text-transform: uppercase; letter-spacing: .11em; color: var(--dim); }
.sw-stat .v { font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 3px; }
.sw-field { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--edge); }
.sw-field:last-child { border-bottom: none; }
.sw-field label { font-size: 13px; }
.sw-field input[type=range] { width: 180px; pointer-events: auto; }
.sw-hint { font-size: 12px; color: var(--dim); line-height: 1.6; }
.sw-keys { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 12.5px; margin-top: 6px; }
.sw-keys b { color: var(--accent); font-weight: 600; }
`;

const el = (tag, className, html) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (html !== undefined) node.innerHTML = html;
  return node;
};

class UI {
  constructor(callbacks = {}) {
    this.cb = callbacks;
    this.openPanel = null;
    this.shopTab = 'rods';
    this.gearTab = 'rods';

    const style = document.createElement('style');
    style.textContent = CSS;
    document.head.appendChild(style);

    this.root = el('div', 'sw-root');
    document.body.appendChild(this.root);

    this.crosshair = el('div', 'sw-crosshair');
    this.root.appendChild(this.crosshair);

    this.topbar = el('div', 'sw-topbar');
    this.chips = {
      time: this._chip('Hora', '07:30'),
      weather: this._chip('Tiempo', 'Despejado'),
      money: this._chip('Monedas', '60')
    };
    this.chips.money.classList.add('sw-money');
    Object.values(this.chips).forEach((c) => this.topbar.appendChild(c));
    this.root.appendChild(this.topbar);

    this.gearBox = el('div', 'sw-gear');
    this.root.appendChild(this.gearBox);

    this.tensionBox = el('div', 'sw-tension');
    this.tensionBox.innerHTML = `
      <div class="label"><span>Tensión</span><b class="t-val">0.0 kg</b></div>
      <div class="sw-bar"><i class="t-fill"></i><div class="mark"></div></div>
      <div class="sub">
        <div class="label"><span>Freno</span><b class="d-val">1.4 kg</b></div>
        <div class="sw-bar"><i class="d-fill" style="background:var(--warn)"></i></div>
      </div>
      <div class="sub">
        <div class="label"><span>Hilo fuera</span><b class="l-val">0 m</b></div>
      </div>`;
    this.root.appendChild(this.tensionBox);

    this.prompt = el('div', 'sw-prompt');
    this.root.appendChild(this.prompt);

    this.toast = el('div', 'sw-toast');
    this.toast.style.display = 'none';
    this.root.appendChild(this.toast);
  }

  _chip(key, value) {
    const chip = el('div', 'sw-chip');
    chip.innerHTML = `<span class="k">${key}</span><b>${value}</b>`;
    return chip;
  }

  setChip(name, value) {
    const b = this.chips[name]?.querySelector('b');
    if (b && b.textContent !== String(value)) b.textContent = value;
  }

  // ------------------------------------------------------------------ HUD
  update(data) {
    const { fishing, time, weather, money, equipment } = data;
    this.setChip('time', time.label);
    this.setChip('weather', weather.label);
    this.setChip('money', money);

    const s = equipment.stats;
    this.gearBox.innerHTML = `
      <h4>Montaje</h4>
      <div class="row"><span>${equipment.rod.name}</span><span>${s.castDistance.toFixed(0)} m</span></div>
      <div class="row"><span>${equipment.reel.name}</span><span>freno ${s.maxDrag.toFixed(1)} kg</span></div>
      <div class="row"><span>${equipment.line.name}</span><span>${s.lineStrength.toFixed(1)} kg</span></div>
      <div class="row"><span>${equipment.lure.name}</span><span>${equipment.lure.workingDepth.toFixed(1)} m</span></div>`;

    const hud = fishing;
    const ratio = clamp(hud.tensionRatio, 0, 1);
    const fill = this.tensionBox.querySelector('.t-fill');
    fill.style.width = `${ratio * 100}%`;
    fill.style.background = ratio > 0.82 ? 'var(--bad)' : ratio > 0.55 ? 'var(--warn)' : 'var(--good)';
    this.tensionBox.querySelector('.t-val').textContent = `${hud.tension.toFixed(1)} kg`;
    this.tensionBox.querySelector('.mark').style.left =
      `${clamp(hud.drag / Math.max(0.1, hud.lineStrength), 0, 1) * 100}%`;
    this.tensionBox.querySelector('.d-fill').style.width = `${hud.dragSetting * 100}%`;
    this.tensionBox.querySelector('.d-val').textContent = `${hud.drag.toFixed(1)} kg`;
    this.tensionBox.querySelector('.l-val').textContent =
      `${hud.lineOut.toFixed(0)} / ${hud.capacity} m`;

    this._updatePrompt(hud);
    this._updateToast(hud.message);
  }

  _updatePrompt(hud) {
    let html = '';
    switch (hud.state) {
      case FishingState.IDLE:
        html = `<div class="small">Mantén <b>clic izquierdo</b> para cargar el lanzamiento</div>`;
        break;
      case FishingState.AIMING:
        html = `<div class="small">Suelta para lanzar</div>
                <div class="sw-power"><i style="width:${hud.power * 100}%"></i></div>`;
        break;
      case FishingState.CASTING:
        html = `<div class="small">…</div>`;
        break;
      case FishingState.FISHING:
        html = `<div class="small">Mantén <b>clic derecho</b> para recoger · rueda para el freno</div>`;
        break;
      case FishingState.BITE:
        html = `<div class="big bite">¡PICADA!</div><div class="small">Clic izquierdo para clavar</div>`;
        break;
      case FishingState.FIGHTING:
        html = `<div class="small"><b>${hud.hooked?.name ?? ''}</b> · ${(hud.hooked?.weight ?? 0).toFixed(2)} kg
                — recoge sin pasarte de tensión</div>`;
        break;
      default:
        html = '';
    }
    if (this.prompt.innerHTML !== html) this.prompt.innerHTML = html;
  }

  _updateToast(message) {
    if (!message) { this.toast.style.display = 'none'; return; }
    this.toast.style.display = 'block';
    this.toast.textContent = message.text;
    this.toast.className = `sw-toast${message.kind === 'bad' ? ' bad' : ''}`;
  }

  setCrosshairVisible(value) {
    this.crosshair.style.display = value ? 'block' : 'none';
  }

  // -------------------------------------------------------------- paneles
  _overlay(title, bodyNode, { onClose = null } = {}) {
    this.closePanel();
    const overlay = el('div', 'sw-overlay');
    const panel = el('div', 'sw-panel');
    const header = el('header');
    header.appendChild(el('h2', null, title));
    const close = el('button', 'sw-close', '&times;');
    close.addEventListener('click', () => { this.closePanel(); onClose?.(); });
    header.appendChild(close);
    const body = el('div', 'body');
    body.appendChild(bodyNode);
    panel.appendChild(header);
    panel.appendChild(body);
    overlay.appendChild(panel);
    this.root.appendChild(overlay);
    this.openPanel = { overlay, onClose };
    this.cb.onPanelOpen?.();
    return { overlay, body };
  }

  closePanel() {
    if (!this.openPanel) return;
    this.root.removeChild(this.openPanel.overlay);
    const cb = this.openPanel.onClose;
    this.openPanel = null;
    this.cb.onPanelClose?.();
    cb?.();
  }

  get isPanelOpen() { return !!this.openPanel; }

  showCatch(fish, result, { onKeep, onRelease }) {
    const body = el('div', 'sw-catch');
    const badges = [];
    if (result.isNew) badges.push('<span class="sw-badge" style="color:var(--accent)">Especie nueva</span>');
    if (result.isRecord) badges.push('<span class="sw-badge" style="color:var(--warn)">Récord personal</span>');
    if (fish.trophy > 0.8) badges.push('<span class="sw-badge" style="color:var(--good)">Ejemplar de trofeo</span>');

    body.innerHTML = `
      <div class="name">${fish.species.name}</div>
      <div class="latin">${fish.species.latin}</div>
      <div class="measures">
        <div>Longitud<b>${fish.length.toFixed(1)} cm</b></div>
        <div>Peso<b>${fish.weight.toFixed(2)} kg</b></div>
        <div>Valor<b>${result.value}</b></div>
      </div>
      <div class="badges">${badges.join('')}</div>`;

    const actions = el('div', 'sw-actions');
    const keep = el('button', 'sw-btn', `Quedárselo · ${result.value} monedas`);
    const release = el('button', 'sw-btn ghost', 'Devolver al agua');
    keep.addEventListener('click', () => { this.closePanel(); onKeep(); });
    release.addEventListener('click', () => { this.closePanel(); onRelease(); });
    actions.appendChild(keep);
    actions.appendChild(release);
    body.appendChild(actions);

    this._overlay('Captura', body, { onClose: onRelease });
  }

  showGear(inventory, equipment) {
    const body = el('div');
    const render = () => {
      body.innerHTML = '';
      const tabs = el('div', 'sw-tabs');
      Object.keys(CATALOG).forEach((category) => {
        const b = el('button', null, CATEGORY_LABELS[category]);
        b.setAttribute('aria-selected', String(this.gearTab === category));
        b.addEventListener('click', () => { this.gearTab = category; render(); });
        tabs.appendChild(b);
      });
      body.appendChild(tabs);

      inventory.list(this.gearTab).forEach((item) => {
        const equipped = equipment.equipped[this.gearTab] === item.id;
        const row = el('div', `sw-item${equipped ? ' equipped' : ''}`);
        row.innerHTML = `<div><div class="t">${item.name}</div>
          <div class="d">${item.description}</div>
          <div class="stats">${this._itemStats(this.gearTab, item)}</div></div>`;
        const act = el('div', 'act');
        if (equipped) {
          act.appendChild(el('span', 'sw-tag', 'Equipado'));
        } else {
          const b = el('button', 'sw-btn', 'Equipar');
          b.addEventListener('click', () => { this.cb.onEquip?.(this.gearTab, item.id); render(); });
          act.appendChild(b);
        }
        row.appendChild(act);
        body.appendChild(row);
      });
    };
    render();
    this._overlay('Equipo', body);
  }

  _itemStats(category, item) {
    switch (category) {
      case 'rods': return `potencia ${item.power} · resistencia ${item.strength} kg · sensibilidad ${(item.sensitivity * 100).toFixed(0)}%`;
      case 'reels': return `${item.capacity} m · recogida ${item.retrieve} · freno máx ${item.maxDrag} kg`;
      case 'lines': return `${item.strength} kg · ⌀ ${item.diameter} mm · elasticidad ${(item.elasticity * 100).toFixed(0)}%`;
      case 'lures': return `${item.weightG} g · trabaja a ${item.workingDepth} m · acción ${(item.action * 100).toFixed(0)}%`;
      default: return '';
    }
  }

  showShop(inventory, economy) {
    const body = el('div');
    const render = () => {
      body.innerHTML = '';
      const money = el('div', 'sw-hint', `Monedas disponibles: <b style="color:var(--warn)">${economy.money}</b>`);
      money.style.marginBottom = '12px';
      body.appendChild(money);

      const tabs = el('div', 'sw-tabs');
      Object.keys(CATALOG).forEach((category) => {
        const b = el('button', null, CATEGORY_LABELS[category]);
        b.setAttribute('aria-selected', String(this.shopTab === category));
        b.addEventListener('click', () => { this.shopTab = category; render(); });
        tabs.appendChild(b);
      });
      body.appendChild(tabs);

      CATALOG[this.shopTab].forEach((item) => {
        const owned = inventory.has(this.shopTab, item.id);
        const row = el('div', `sw-item${owned ? ' equipped' : ''}`);
        row.innerHTML = `<div><div class="t">${item.name}</div>
          <div class="d">${item.description}</div>
          <div class="stats">${this._itemStats(this.shopTab, item)}</div></div>`;
        const act = el('div', 'act');
        if (owned) {
          act.appendChild(el('span', 'sw-tag', 'En propiedad'));
        } else {
          const b = el('button', 'sw-btn', `${item.price}`);
          b.disabled = !economy.canAfford(item.price);
          b.addEventListener('click', () => { this.cb.onBuy?.(this.shopTab, item.id); render(); });
          act.appendChild(b);
        }
        row.appendChild(act);
        body.appendChild(row);
      });
    };
    render();
    this._overlay('Tienda del embarcadero', body);
  }

  showRecords(economy) {
    const body = el('div');
    const grid = el('div', 'sw-grid');
    SPECIES.forEach((species) => {
      const record = economy.records[species.id];
      const card = el('div', `sw-card${record ? '' : ' unknown'}`);
      card.innerHTML = record
        ? `<div class="t">${species.name}</div>
           <div class="m">${record.count} capturas · récord ${record.bestLength.toFixed(1)} cm / ${record.bestWeight.toFixed(2)} kg</div>`
        : `<div class="t">? ? ?</div><div class="m">Sin capturar</div>`;
      grid.appendChild(card);
    });
    body.appendChild(grid);
    this._overlay(`Capturas · ${economy.discovered}/${economy.speciesTotal}`, body);
  }

  showStats(economy) {
    const body = el('div', 'sw-stats');
    const s = economy.stats;
    const items = [
      ['Lances', s.casts],
      ['Picadas clavadas', s.hooked],
      ['Cobrados', s.landed],
      ['Perdidos', s.lost],
      ['Líneas rotas', s.lineBreaks],
      ['Peso total', `${s.totalWeight.toFixed(1)} kg`],
      ['Mayor captura', `${s.biggest.toFixed(2)} kg`],
      ['Efectividad', s.hooked ? `${Math.round((s.landed / s.hooked) * 100)}%` : '—']
    ];
    items.forEach(([k, v]) => {
      const stat = el('div', 'sw-stat');
      stat.innerHTML = `<div class="k">${k}</div><div class="v">${v}</div>`;
      body.appendChild(stat);
    });
    this._overlay('Estadísticas', body);
  }

  showSettings(settings) {
    const body = el('div');
    const quality = el('div', 'sw-field');
    quality.innerHTML = '<label>Calidad gráfica</label>';
    const buttons = el('div', 'sw-tabs');
    buttons.style.margin = '0';
    Object.entries(QUALITY_PRESETS).forEach(([key, preset]) => {
      const b = el('button', null, preset.label);
      b.setAttribute('aria-selected', String(settings.quality === key));
      b.addEventListener('click', () => {
        this.cb.onSetting?.('quality', key);
        [...buttons.children].forEach((c) => c.setAttribute('aria-selected', String(c === b)));
      });
      buttons.appendChild(b);
    });
    quality.appendChild(buttons);
    body.appendChild(quality);

    const slider = (label, key, min, max, step, value, format) => {
      const field = el('div', 'sw-field');
      field.innerHTML = `<label>${label}</label>`;
      const wrap = el('div');
      const input = document.createElement('input');
      input.type = 'range';
      input.min = min; input.max = max; input.step = step; input.value = value;
      const out = el('span', null, format(value));
      out.style.cssText = 'margin-left:10px;color:var(--dim);font-size:12px';
      input.addEventListener('input', () => {
        out.textContent = format(Number(input.value));
        this.cb.onSetting?.(key, Number(input.value));
      });
      wrap.appendChild(input);
      wrap.appendChild(out);
      field.appendChild(wrap);
      body.appendChild(field);
    };
    slider('Campo de visión', 'fov', 55, 100, 1, settings.fov, (v) => `${v}°`);
    slider('Sensibilidad', 'sensitivity', 0.2, 3, 0.1, settings.sensitivity, (v) => v.toFixed(1));
    slider('Volumen', 'masterVolume', 0, 1, 0.05, settings.masterVolume, (v) => `${Math.round(v * 100)}%`);

    const hint = el('div', 'sw-hint');
    hint.style.marginTop = '14px';
    hint.innerHTML = 'La calidad se aplica al reiniciar el mundo desde el menú de pausa.';
    body.appendChild(hint);

    this._overlay('Configuración', body);
  }

  showPause({ onResume, onSave, onSettings, onReset }) {
    const body = el('div');
    const keys = el('div', 'sw-keys');
    keys.innerHTML = `
      <b>WASD</b><span>Moverse (Mayús para correr)</span>
      <b>Ratón</b><span>Mirar</span>
      <b>Clic izq. (mantener)</b><span>Cargar y lanzar</span>
      <b>Clic izq.</b><span>Clavar durante la picada</span>
      <b>Clic der. (mantener)</b><span>Recoger carrete</span>
      <b>Rueda</b><span>Ajustar el freno</span>
      <b>R</b><span>Recoger el sedal</span>
      <b>Tab</b><span>Equipo</span>
      <b>B</b><span>Tienda</span>
      <b>C</b><span>Capturas</span>
      <b>G</b><span>Estadísticas</span>
      <b>F</b><span>Cambiar cámara</span>
      <b>Esc</b><span>Pausa</span>`;
    body.appendChild(keys);

    const actions = el('div', 'sw-actions');
    actions.style.marginTop = '18px';
    const mk = (label, cls, fn) => {
      const b = el('button', `sw-btn${cls}`, label);
      b.addEventListener('click', fn);
      return b;
    };
    actions.appendChild(mk('Continuar', '', () => { this.closePanel(); onResume(); }));
    actions.appendChild(mk('Guardar', ' ghost', onSave));
    actions.appendChild(mk('Configuración', ' ghost', () => { this.closePanel(); onSettings(); }));
    actions.appendChild(mk('Empezar de cero', ' ghost', onReset));
    body.appendChild(actions);

    this._overlay('Pausa', body, { onClose: onResume });
  }
}

/* ===== src/audio/AudioSystem.js ===== */
/**
 * Audio sintetizado con WebAudio.
 *
 * No se descarga ningún fichero: el viento y la lluvia son ruido filtrado, el
 * agua es ruido con un filtro que respira, los pájaros y los grillos son
 * osciladores con envolvente. La mezcla responde a la hora y al tiempo
 * atmosférico, así que el paisaje sonoro cambia solo.
 */

class AudioSystem {
  constructor() {
    this.ctx = null;
    this.ready = false;
    this.master = null;
    this.volume = 0.8;
    this.muted = false;
    this.layers = {};
    this._birdTimer = 3;
    this._cricketTimer = 5;
  }

  /** Debe llamarse desde un gesto del usuario (política de autoplay). */
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    this.ctx = new Ctx();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.volume;
    this.master.connect(this.ctx.destination);

    this.layers.wind = this._noiseLayer({ type: 'lowpass', frequency: 480, q: 0.7, gain: 0 });
    this.layers.water = this._noiseLayer({ type: 'bandpass', frequency: 900, q: 1.4, gain: 0 });
    this.layers.rain = this._noiseLayer({ type: 'highpass', frequency: 1500, q: 0.6, gain: 0 });
    this.ready = true;
  }

  _noiseBuffer(seconds = 3) {
    const length = Math.floor(this.ctx.sampleRate * seconds);
    const buffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
  }

  _noiseLayer({ type, frequency, q, gain }) {
    const source = this.ctx.createBufferSource();
    source.buffer = this._noiseBuffer();
    source.loop = true;
    const filter = this.ctx.createBiquadFilter();
    filter.type = type;
    filter.frequency.value = frequency;
    filter.Q.value = q;
    const amp = this.ctx.createGain();
    amp.gain.value = gain;
    // LFO lento sobre el filtro: evita que el ruido suene estático.
    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    lfo.frequency.value = 0.07 + Math.random() * 0.1;
    lfoGain.gain.value = frequency * 0.28;
    lfo.connect(lfoGain);
    lfoGain.connect(filter.frequency);
    lfo.start();

    source.connect(filter);
    filter.connect(amp);
    amp.connect(this.master);
    source.start();
    return { source, filter, amp };
  }

  _tone(freq, duration, { type = 'sine', gain = 0.12, slideTo = null, delay = 0, attack = 0.01 } = {}) {
    if (!this.ready || this.muted) return;
    const t0 = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const amp = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + duration);
    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.exponentialRampToValueAtTime(gain, t0 + attack);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(amp);
    amp.connect(this.master);
    osc.start(t0);
    osc.stop(t0 + duration + 0.05);
  }

  _burst(duration, { gain = 0.2, type = 'lowpass', from = 3000, to = 300 } = {}) {
    if (!this.ready || this.muted) return;
    const t0 = this.ctx.currentTime;
    const source = this.ctx.createBufferSource();
    source.buffer = this._noiseBuffer(Math.max(0.4, duration));
    const filter = this.ctx.createBiquadFilter();
    filter.type = type;
    filter.frequency.setValueAtTime(from, t0);
    filter.frequency.exponentialRampToValueAtTime(Math.max(60, to), t0 + duration);
    const amp = this.ctx.createGain();
    amp.gain.setValueAtTime(gain, t0);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    source.connect(filter); filter.connect(amp); amp.connect(this.master);
    source.start(t0);
    source.stop(t0 + duration + 0.05);
  }

  // ------------------------------------------------------------- efectos
  cast() { this._burst(0.32, { gain: 0.16, from: 600, to: 2600, type: 'bandpass' }); }
  splash(strength = 1) { this._burst(0.45 * strength, { gain: 0.26, from: 2600, to: 280 }); }
  reelClick() { this._tone(1500 + Math.random() * 400, 0.03, { type: 'square', gain: 0.045 }); }
  dragSlip() { this._tone(820, 0.16, { type: 'sawtooth', gain: 0.09, slideTo: 1250 }); }
  hookSet() { this._tone(240, 0.16, { type: 'square', gain: 0.16, slideTo: 520 }); }
  bite() { this._tone(700, 0.09, { type: 'sine', gain: 0.16 }); this._tone(1040, 0.12, { type: 'sine', gain: 0.14, delay: 0.08 }); }
  lineBreak() { this._burst(0.3, { gain: 0.3, from: 4000, to: 700, type: 'highpass' }); this._tone(180, 0.4, { type: 'sawtooth', gain: 0.16, slideTo: 60 }); }
  landed() { [523, 659, 784, 1046].forEach((f, i) => this._tone(f, 0.18, { type: 'triangle', gain: 0.13, delay: i * 0.09 })); }
  coin() { this._tone(880, 0.07, { type: 'square', gain: 0.1 }); this._tone(1320, 0.09, { type: 'square', gain: 0.09, delay: 0.06 }); }
  footstep(surface) {
    if (surface === 'madera') this._tone(140 + Math.random() * 40, 0.07, { type: 'square', gain: 0.055 });
    else if (surface === 'agua') this._burst(0.2, { gain: 0.11, from: 1800, to: 400 });
    else this._burst(0.09, { gain: 0.06, from: 900, to: 200 });
  }

  // ------------------------------------------------------------- ambiente
  update(dt, { windSpeed = 2, rain = 0, nightFactor = 0, nearWater = 1, cloudiness = 0 } = {}) {
    if (!this.ready) return;
    const now = this.ctx.currentTime;
    const set = (layer, value) => {
      if (layer) layer.amp.gain.setTargetAtTime(this.muted ? 0 : value, now, 0.4);
    };

    set(this.layers.wind, clamp(0.012 + windSpeed * 0.011, 0, 0.14));
    if (this.layers.wind) {
      this.layers.wind.filter.frequency.setTargetAtTime(320 + windSpeed * 90, now, 0.6);
    }
    set(this.layers.water, clamp(nearWater * (0.02 + windSpeed * 0.006), 0, 0.09));
    set(this.layers.rain, clamp(rain * 0.13, 0, 0.13));

    // Pájaros de día, grillos de noche.
    this._birdTimer -= dt;
    if (this._birdTimer <= 0) {
      this._birdTimer = lerp(1.4, 9, nightFactor) + Math.random() * 4 + cloudiness * 3;
      if (nightFactor < 0.55 && rain < 0.4 && !this.muted) {
        const base = 1600 + Math.random() * 1400;
        const notes = 2 + Math.floor(Math.random() * 3);
        for (let i = 0; i < notes; i++) {
          this._tone(base * (1 + i * 0.12), 0.09, {
            type: 'sine', gain: 0.035, slideTo: base * 1.35, delay: i * 0.13
          });
        }
      }
    }

    this._cricketTimer -= dt;
    if (this._cricketTimer <= 0) {
      this._cricketTimer = 0.35 + Math.random() * 0.5;
      if (nightFactor > 0.45 && rain < 0.3 && !this.muted) {
        this._tone(4200 + Math.random() * 600, 0.035, { type: 'square', gain: 0.016 });
      }
    }
  }

  setVolume(value) {
    this.volume = clamp(value, 0, 1);
    if (this.master) this.master.gain.setTargetAtTime(this.volume, this.ctx.currentTime, 0.1);
  }

  setMuted(value) {
    this.muted = value;
    if (this.master) this.master.gain.setTargetAtTime(value ? 0 : this.volume, this.ctx.currentTime, 0.1);
  }
}

/* ===== src/core/Game.js ===== */
/**
 * Orquestador.
 *
 * Construye los sistemas, los conecta y ejecuta el bucle. Ningún sistema
 * conoce a los demás: el Game les pasa cada frame el contexto que necesitan
 * (hora, viento, posición del jugador…) y reparte los eventos.
 */
class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.save = new SaveSystem();
    this.settings = { ...DEFAULT_SETTINGS, ...(this.save.load()?.settings || {}) };
    this.preset = presetFor(this.settings);
    this.clock = new THREE.Clock();
    this.running = false;
    this.paused = false;
    this.autosaveTimer = 0;
    this.footstepTimer = 0;

    this._initRenderer();
    this._initWorld();
    this._initPlayer();
    this._initProgress();
    this._initFishing();
    this._initUI();
    this._bindInput();
    this._loadProgress();
  }

  // --------------------------------------------------------------- montaje
  _initRenderer() {
    this.renderer = new THREE.WebGLRenderer({
      canvas: this.canvas,
      antialias: this.preset.antialias,
      powerPreference: 'high-performance'
    });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2) * this.preset.pixelRatio);
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.shadowMap.enabled = this.preset.shadows;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    // El cielo de Preetham emite valores muy altos: con exposición 1 se
    // satura a blanco y el lago lo refleja como una lámina de leche.
    this.renderer.toneMappingExposure = 0.34;

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(
      this.settings.fov, window.innerWidth / window.innerHeight, 0.08, 5000
    );

    window.addEventListener('resize', () => this._resize());
  }

  _initWorld() {
    this.textures = new TextureLibrary();
    this.time = new TimeOfDay({ hour: 9.4 });

    this.terrain = new Terrain(this.textures, { resolution: 300 });
    this.scene.add(this.terrain.mesh);

    this.water = new WaterBody(this.textures, {
      reflectionSize: this.preset.waterReflection,
      sunDirection: this.time.sunDirection
    });
    this.water.addTo(this.scene);

    this.sky = new SkyDome(this.scene, this.textures, this.preset);
    this.weather = new Weather(this.scene, this.textures, this.preset);
    this.vegetation = new Vegetation(this.scene, this.terrain, this.textures, this.preset);
    this.props = new Props(this.scene, this.terrain, this.textures, this.preset);
  }

  _initPlayer() {
    const spot = this.props.fishingSpots[0];
    const spawn = spot.position.clone().add(new THREE.Vector3(0, 0, 0));
    this.player = new Player(this.camera, this.terrain, {
      spawn,
      walkables: [this.props.group]
    });
    this.scene.add(this.player.rig);
    // Mirando al centro del lago.
    this.player.yaw = Math.atan2(-spawn.x, -spawn.z) + Math.PI;
    this.fishManager = new FishManager(this.scene, this.terrain);
  }

  _initProgress() {
    this.inventory = new Inventory();
    this.equipment = new Equipment(this.inventory);
    this.economy = new Economy();
  }

  _initFishing() {
    this.audio = new AudioSystem();
    this.fishing = new FishingSystem({
      scene: this.scene,
      camera: this.camera,
      terrain: this.terrain,
      water: this.water,
      fishManager: this.fishManager,
      equipment: this.equipment,
      events: {
        onCast: () => { this.economy.stats.casts++; this.audio.cast(); },
        onSplash: (p) => this.audio.splash(0.9),
        onBite: () => this.audio.bite(),
        onHookSet: () => { this.economy.stats.hooked++; this.audio.hookSet(); },
        onDragSlip: () => { if (Math.random() < 0.35) this.audio.dragSlip(); },
        onJump: (fish) => this.water.splash(fish.position, 1.1),
        onLineBreak: () => { this.economy.stats.lineBreaks++; this.economy.stats.lost++; this.audio.lineBreak(); },
        onFishLost: () => { this.economy.stats.lost++; },
        onLanded: (fish) => this._onLanded(fish)
      }
    });
  }

  _initUI() {
    this.ui = new UI({
      onEquip: (category, id) => { this.equipment.equip(category, id); this._persist(); },
      onBuy: (category, id) => {
        if (this.economy.buy(category, id)) {
          this.inventory.add(category, id);
          this.audio.coin();
          this._persist();
        }
      },
      onSetting: (key, value) => this._applySetting(key, value),
      onPanelOpen: () => { this.input.releaseLock(); this.ui.setCrosshairVisible(false); },
      onPanelClose: () => { this.ui.setCrosshairVisible(true); }
    });
  }

  _bindInput() {
    this.input = new Input(this.canvas);

    this.canvas.addEventListener('click', () => {
      if (!this.ui.isPanelOpen && !this.input.locked) {
        this.audio.init();
        this.input.requestLock();
      }
    });

    this.input.on('pointerdown', (e) => {
      if (this.ui.isPanelOpen || !this.input.locked) return;
      if (e.button === 0) {
        if (this.fishing.state === FishingState.BITE) this.fishing.strike();
        else this.fishing.beginCast();
      }
    });
    this.input.on('pointerup', (e) => {
      if (e.button === 0) this.fishing.releaseCast();
    });

    this.input.on('keydown', (e) => {
      if (e.repeat) return;
      switch (e.code) {
        case 'Escape': this._togglePause(); break;
        case 'Tab': this._panel(() => this.ui.showGear(this.inventory, this.equipment)); break;
        case 'KeyB': this._panel(() => this.ui.showShop(this.inventory, this.economy)); break;
        case 'KeyC': this._panel(() => this.ui.showRecords(this.economy)); break;
        case 'KeyG': this._panel(() => this.ui.showStats(this.economy)); break;
        case 'KeyR': if (!this.ui.isPanelOpen) this.fishing.reelIn(); break;
        case 'KeyF':
          this.player.setCameraMode(this.player.mode === 'first' ? 'third' : 'first');
          this.fishing.rod.setVisible(this.player.mode === 'first');
          break;
        default: break;
      }
    });
  }

  _panel(open) {
    if (this.ui.isPanelOpen) { this.ui.closePanel(); return; }
    open();
  }

  _togglePause() {
    if (this.ui.isPanelOpen) { this.ui.closePanel(); return; }
    this.ui.showPause({
      onResume: () => {},
      onSave: () => { this._persist(); this.fishing._say('Partida guardada'); },
      onSettings: () => this.ui.showSettings(this.settings),
      onReset: () => {
        this.save.clear();
        window.location.reload();
      }
    });
  }

  // -------------------------------------------------------------- eventos
  _onLanded(fish) {
    this.audio.landed();
    const result = this.economy.registerCatch(fish);
    this.ui.showCatch(fish, result, {
      onKeep: () => {
        this.economy.sell(result.value);
        this.audio.coin();
        this.fishing.finishCatch(true);
        this._persist();
      },
      onRelease: () => {
        this.fishing.finishCatch(false);
        this._persist();
      }
    });
  }

  _applySetting(key, value) {
    this.settings[key] = value;
    if (key === 'fov') {
      this.camera.fov = value;
      this.camera.updateProjectionMatrix();
    }
    if (key === 'masterVolume') this.audio.setVolume(value);
    this._persist();
  }

  // ----------------------------------------------------------- persistencia
  _persist() {
    this.save.save({
      settings: this.settings,
      inventory: this.inventory.toJSON(),
      equipment: this.equipment.toJSON(),
      economy: this.economy.toJSON(),
      world: { hour: this.time.hour, weather: this.weather.current }
    });
  }

  _loadProgress() {
    const data = this.save.load();
    if (!data) return;
    this.inventory = Inventory.fromJSON(data.inventory);
    this.equipment = Equipment.fromJSON(this.inventory, data.equipment);
    this.economy = new Economy(data.economy);
    this.fishing.equipment = this.equipment;
    if (data.world?.hour !== undefined) this.time.setHour(data.world.hour);
    if (data.world?.weather) this.weather.setWeather(data.world.weather);
    this.audio.setVolume(this.settings.masterVolume);
  }

  // ---------------------------------------------------------------- bucle
  start() {
    this.running = true;
    this.clock.start();
    this.renderer.setAnimationLoop(() => this._frame());
  }

  _resize() {
    this.camera.aspect = window.innerWidth / window.innerHeight;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(window.innerWidth, window.innerHeight);
  }

  _frame() {
    const dt = Math.min(0.05, this.clock.getDelta());
    this.simulate(dt);
    this.renderer.render(this.scene, this.camera);
  }

  /**
   * Un paso de simulación, independiente del dibujado.
   *
   * Separarlo permite ejecutar el juego a velocidad de cálculo (pruebas
   * automáticas, ajuste de equilibrio) sin pasar por la GPU, y deja la puerta
   * abierta a un paso fijo si en el futuro hace falta determinismo.
   */
  simulate(dt, { headless = false } = {}) {
    const panelOpen = this.ui.isPanelOpen;
    const controllable = headless || (!panelOpen && this.input.locked);

    if (controllable && !headless) {
      const mouse = this.input.consumeMouseDelta();
      this.player.look(mouse.dx, mouse.dy, this.settings.sensitivity, this.settings.invertY);
      if (mouse.wheel) this.fishing.adjustDrag(-mouse.wheel * 0.06);
      this.fishing.setRetrieve(this.input.mouse.right ? 1 : 0);
    } else if (!headless) {
      this.input.consumeMouseDelta();
      this.fishing.setRetrieve(0);
    }

    const moving = controllable && !headless
      ? this.player.update(dt, this.input)
      : { speed: 0, surface: this.player.surface, depth: 0 };

    this.time.update(panelOpen ? 0 : dt);
    this.weather.update(dt, this.player.position, this.time.fogColor);
    this.sky.update(this.time, this.weather, dt, this.player.position);

    const wind = new THREE.Vector3(
      this.weather.windDirection.x, 0, this.weather.windDirection.y
    ).multiplyScalar(this.weather.windSpeed);

    this.water.update(dt, {
      sunDirection: this.time.sunDirection,
      sunColor: this.time.sunColor,
      waterColor: new THREE.Color(0x0d2630).lerp(this.time.skyColor, 0.16),
      choppiness: this.weather.choppiness
    });
    this.vegetation.update(dt, wind, this.player.position);

    const context = {
      terrain: this.terrain,
      hour: this.time.hour,
      time: this.clock.elapsedTime,
      weatherModifier: this.weather.biteModifier,
      feeding: this.time.feedingFactor,
      wind,
      lookDelta: this.player.lookDelta,
      cameraPosition: this.player.position,
      lurePosition: this.fishing.lure.isFishable ? this.fishing.lure.position : null,
      lureAction: this.fishing.lure.action,
      onBite: () => {},
      onSpit: () => {}
    };

    if (!panelOpen) {
      this.fishing.update(dt, context);
      this.fishManager.update(dt, context);
    }

    if (!headless) {
      this._updateAudio(dt, moving);
      this.ui.update({
        fishing: this.fishing.hud,
        time: this.time,
        weather: this.weather,
        money: this.economy.money,
        equipment: this.equipment
      });
      this.autosaveTimer += dt;
      if (this.autosaveTimer > 30) { this.autosaveTimer = 0; this._persist(); }
    }
  }

  _updateAudio(dt, moving) {
    const depthUnderPlayer = this.terrain.depthAt(this.player.position.x, this.player.position.z);
    const distanceToWater = clamp(1 - Math.max(0, this.player.position.y) / 12, 0.15, 1);
    this.audio.update(dt, {
      windSpeed: this.weather.windSpeed,
      rain: this.weather.rainAmount,
      nightFactor: this.time.nightFactor,
      nearWater: depthUnderPlayer > 0 ? 1 : distanceToWater,
      cloudiness: this.weather.cloudiness
    });

    if (moving.speed > 0.8) {
      this.footstepTimer -= dt * moving.speed;
      if (this.footstepTimer <= 0) {
        this.footstepTimer = 1.5;
        this.audio.footstep(moving.surface);
      }
    }
  }

  dispose() {
    this.renderer.setAnimationLoop(null);
    this.fishing.dispose();
    this.fishManager.dispose();
    this.vegetation.dispose();
    this.props.dispose();
    this.water.dispose();
    this.sky.dispose();
    this.weather.dispose();
    this.terrain.dispose();
    this.textures.dispose();
    this.renderer.dispose();
  }
}

/* ===== src/main.js ===== */
/** Punto de entrada: monta el juego y quita la pantalla de carga. */
const canvas = document.getElementById('viewport');
const loader = document.getElementById('loading');
const loaderText = document.getElementById('loading-text');

function fail(error) {
  console.error(error);
  if (loaderText) {
    loaderText.innerHTML = `<b>No se pudo iniciar el juego.</b><br>${error.message}<br>
      <small>Requiere un navegador con WebGL 2.</small>`;
  }
}

try {
  if (loaderText) loaderText.textContent = 'Generando el lago…';
  const game = new Game(canvas);
  window.game = game;                     // útil para depurar desde la consola
  game.start();
  requestAnimationFrame(() => {
    loader?.classList.add('done');
    setTimeout(() => loader?.remove(), 700);
  });
} catch (error) {
  fail(error);
}
</script>

<script>
  // Si el módulo no llega a arrancar (three.js bloqueado, WebGL 2 ausente),
  // el usuario vería una pantalla de carga eterna. Esto lo explica.
  setTimeout(function () {
    if (window.game) return;
    var t = document.getElementById('loading-text');
    if (t) t.innerHTML = '<b>No se pudo iniciar.</b><br>' +
      'Necesita WebGL 2 y acceso a la librería three.js.<br>' +
      '<small>Prueba con Chrome o Firefox actualizados en un ordenador.</small>';
  }, 20000);
</script>
